<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhyme Time Quiz: Poem Power</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS",system-ui,sans-serif;background:linear-gradient(160deg,#e9f7ef,#e3ecff);min-height:100vh;color:#2b2b44;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:740px}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px rgba(60,60,120,.15);padding:24px;margin-top:12px}
h1{margin:0;text-align:center;font-size:2.1rem;color:#5b5bd6}
.sub{text-align:center;margin:6px 0 0;color:#5a5a7a}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;gap:10px}
.bar{height:14px;background:#e8eaf6;border-radius:10px;overflow:hidden;margin:10px 0 0}
.bar div{height:100%;width:0;background:linear-gradient(90deg,#34c38f,#5b8def);transition:width .3s}
.prompt{font-size:1.35rem;text-align:center;margin:18px 0 6px}
.big{font-size:2.8rem;font-weight:bold;text-align:center;color:#5b5bd6;margin:4px 0 14px}
.line{font-size:1.5rem;text-align:center;font-weight:bold;color:#5b5bd6;margin:4px 0 14px;line-height:1.4}
.poem{background:#f4f1ff;border-left:6px solid #8b7cf6;border-radius:12px;padding:12px 18px;margin:10px 0 14px;font-size:1.2rem;line-height:1.6;font-style:italic}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{font:inherit;font-size:1.4rem;font-weight:bold;padding:16px 8px;border:3px solid #d6dcff;background:#f6f8ff;border-radius:16px;cursor:pointer;transition:transform .1s}
.opt:hover:enabled{transform:scale(1.03);border-color:#5b5bd6}
.opt.right{background:#c9f7e0;border-color:#2fb87a}
.opt.wrong{background:#ffd9d9;border-color:#ee5a5a}
.opt:disabled{cursor:default}
.btn{font:inherit;font-size:1.15rem;font-weight:bold;border:none;border-radius:14px;padding:12px 22px;cursor:pointer;background:#5b5bd6;color:#fff}
.btn.alt{background:#2fb87a}
.btn.ghost{background:#e8eaf6;color:#3a3a6a}
.row{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.fb{text-align:center;font-size:1.15rem;min-height:2.2em;margin-top:14px;font-weight:bold}
.fb.ok{color:#1f9d64}.fb.no{color:#d64545}
.score{font-size:3.8rem;text-align:center;font-weight:bold;color:#5b5bd6}
.stars{font-size:2.2rem;text-align:center}
.miss{background:#fff7e6;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:1.02rem}
.hide{display:none}
@media(max-width:480px){.opt{font-size:1.15rem}.big{font-size:2.2rem}}
</style>
</head>
<body>
<div class="app">
  <h1>📖 Rhyme Time: Poem Power 📖</h1>
  <p class="sub">Rhyming words have the same ending sound, even when they are spelled differently!</p>

  <div id="start" class="card">
    <p style="font-size:1.25rem;text-align:center">50 questions about rhyming words, odd words out, and poems.<br>Tap 🔊 if you want a question read aloud.</p>
    <p id="best" class="sub"></p>
    <div class="row"><button class="btn" id="go">Start the Quiz 🚀</button></div>
  </div>

  <div id="quiz" class="card hide">
    <div class="top"><span id="qn"></span><span id="sc"></span></div>
    <div class="bar"><div id="pb"></div></div>
    <div class="prompt" id="prompt"></div>
    <div id="visual"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <div class="row">
      <button class="btn ghost" id="say">🔊 Read to me</button>
      <button class="btn alt hide" id="next">Next ➜</button>
    </div>
  </div>

  <div id="end" class="card hide">
    <div class="stars" id="stars"></div>
    <div class="score" id="final"></div>
    <p class="prompt" id="msg"></p>
    <div id="missed"></div>
    <div class="row"><button class="btn" id="again">Play Again 🔁</button></div>
  </div>
</div>

<script>
/* A = rhymes with [word]; B = odd one out; C = which pair rhymes;
   D = finish the poem (two lines); E = questions about a poem */
var P1='The bees buzz loud in the warm spring air,\nthey fly from flower to flower with care.\nThe sun shines bright and the sky is blue,\nwhat a lovely day for me and you!';
var P2='My brother has a big red kite,\nit flies up high on a windy day.\nIt dances in the light,\nand soars so far away.';
var DIFF=' They are spelled differently but sound the same at the end!';
var Q = [
 // A
 {t:'A',w:'night',a:'kite',o:['knit','nine','neat']},
 {t:'A',w:'through',a:'blue',o:['though','tough','thought'],n:DIFF},
 {t:'A',w:'rough',a:'stuff',o:['cough','though','bough']},
 {t:'A',w:'know',a:'snow',o:['now','knot','knew']},
 {t:'A',w:'chair',a:'share',o:['cheer','chin','charm']},
 {t:'A',w:'pear',a:'square',o:['peer','peak','pearl']},
 {t:'A',w:'word',a:'bird',o:['cord','lord','wood']},
 {t:'A',w:'laugh',a:'giraffe',o:['tough','cough','lunch']},
 {t:'A',w:'eight',a:'gate',o:['height','eat','edge'],n:DIFF},
 {t:'A',w:'flower',a:'tower',o:['floor','flavor','fewer']},
 {t:'A',w:'sleigh',a:'play',o:['sly','sleep','slip'],n:DIFF},
 {t:'A',w:'beach',a:'reach',o:['bench','beak','bath']},
 {t:'A',w:'bright',a:'write',o:['bridge','broke','brought'],n:DIFF},
 {t:'A',w:'stone',a:'bone',o:['stand','store','stun']},
 {t:'A',w:'moose',a:'juice',o:['mouse','mouth','mood']},
 {t:'A',w:'clown',a:'crown',o:['clue','cloud','clap']},
 {t:'A',w:'swim',a:'trim',o:['swam','swing','sweep']},
 {t:'A',w:'gold',a:'cold',o:['golf','good','goat']},
 {t:'A',w:'tooth',a:'truth',o:['toad','toast','tool']},
 {t:'A',w:'coin',a:'join',o:['corn','cone','count']},
 // B
 {t:'B',a:'though',o:['blue','shoe','through']},
 {t:'B',a:'kit',o:['right','write','kite']},
 {t:'B',a:'gone',o:['bone','phone','grown']},
 {t:'B',a:'rail',o:['rain','plane','vein']},
 {t:'B',a:'hear',o:['bear','chair','hair']},
 {t:'B',a:'light',o:['weight','late','gate']},
 {t:'B',a:'boot',o:['boat','coat','note']},
 {t:'B',a:'say',o:['sea','bee','key']},
 // C
 {t:'C',a:'blue – shoe',o:['blue – blow','blue – black','blue – blur']},
 {t:'C',a:'flight – bite',o:['flight – fleet','flight – flat','flight – float']},
 {t:'C',a:'deer – cheer',o:['deer – door','deer – dare','deer – dread']},
 {t:'C',a:'caught – taught',o:['caught – cat','caught – coat','caught – cut']},
 {t:'C',a:'worm – term',o:['worm – warm','worm – wore','worm – worn']},
 {t:'C',a:'knight – kite',o:['knight – knit','knight – knee','knight – kind']},
 // D
 {t:'D',poem:'The sun came up and the day began,\nI packed my lunch and off I ___',rw:'began',a:'ran',o:['went','walked','left']},
 {t:'D',poem:'A little frog sat on a log,\nand looked out across the ___',rw:'log',a:'fog',o:['pond','lake','marsh']},
 {t:'D',poem:'I planted a seed in the warm spring ground,\nand soon green sprouts popped up all ___',rw:'ground',a:'around',o:['over','near','outside']},
 {t:'D',poem:'The wind blew hard and the trees did sway,\nso I stayed in on a rainy ___',rw:'sway',a:'day',o:['night','morning','week']},
 {t:'D',poem:'My little sister loves to sing,\nshe sings the whole day long in the ___',rw:'sing',a:'spring',o:['house','garden','morning']},
 {t:'D',poem:'The bright full moon shone in the sky,\nand an owl flew by with a loud ___',rw:'sky',a:'cry',o:['hoot','screech','call']},
 {t:'D',poem:'We built a sandcastle by the sea,\nand shared a snack beneath a ___',rw:'sea',a:'tree',o:['umbrella','shade','rock']},
 {t:'D',poem:'The class sat quietly in a row,\nand listened to the story, soft and ___',rw:'row',a:'slow',o:['calm','sweet','still']},
 // E
 {t:'E',poem:P1,q:'Which two words end lines 1 and 2?',a:'air and care',o:['flower and air','air and spring','buzz and loud'],why:'air and care rhyme!'},
 {t:'E',poem:P1,q:'Which two words end lines 3 and 4?',a:'blue and you',o:['bright and blue','sun and sky','day and you'],why:'blue and you rhyme!'},
 {t:'E',poem:P1,q:'What is the rhyme scheme of this poem?',a:'AABB',o:['ABAB','ABBA','AAAA'],why:'Lines 1 and 2 rhyme, and lines 3 and 4 rhyme. That is AABB.'},
 {t:'E',poem:P1,q:'Which word in the poem rhymes with night?',a:'bright',o:['blue','shines','buzz'],why:'night and bright rhyme!'},
 {t:'E',poem:P2,q:'Which two words end lines 1 and 3?',a:'kite and light',o:['kite and day','light and away','high and day'],why:'kite and light rhyme!'},
 {t:'E',poem:P2,q:'What is the rhyme scheme of this poem?',a:'ABAB',o:['AABB','ABBA','ABCD'],why:'Lines 1 and 3 rhyme, and lines 2 and 4 rhyme. That is ABAB.'},
 {t:'E',poem:P2,q:'Which word inside the poem rhymes with sky?',a:'high',o:['kite','windy','soars'],why:'sky and high rhyme!'},
 {t:'E',poem:P2,q:'Which two words end lines 2 and 4?',a:'day and away',o:['day and kite','high and far','windy and away'],why:'day and away rhyme!'}
];

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function $(id){return document.getElementById(id)}
function poemHtml(p){return '<div class="poem">'+p.replace(/___/g,'<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>').split('\n').join('<br>')+'</div>'}

var order,idx,score,missed,locked,cur;

function getBest(){try{return localStorage.getItem('rhymeBest3')}catch(e){return null}}
function setBest(v){try{localStorage.setItem('rhymeBest3',v)}catch(e){}}
function showBest(){var b=getBest();$('best').textContent=b?('Your best score: '+b+' / 50 ⭐'):''}

function start(){
  order=shuffle(Q);idx=0;score=0;missed=[];
  $('start').classList.add('hide');$('end').classList.add('hide');$('quiz').classList.remove('hide');
  show();
}

function promptFor(q){
  if(q.t==='A')return 'Which word rhymes with…';
  if(q.t==='B')return 'Which word does NOT rhyme with the others?';
  if(q.t==='C')return 'Which two words rhyme?';
  if(q.t==='D')return 'Which word finishes the poem and rhymes with the line above?';
  return q.q;
}

function show(){
  cur=order[idx];locked=false;
  $('qn').textContent='Question '+(idx+1)+' of 50';
  $('sc').textContent='⭐ '+score;
  $('pb').style.width=(idx/50*100)+'%';
  $('prompt').textContent=promptFor(cur);
  var v=$('visual');
  if(cur.t==='A')v.innerHTML='<div class="big">'+cur.w+'</div>';
  else if(cur.t==='D'||cur.t==='E')v.innerHTML=poemHtml(cur.poem);
  else v.innerHTML='<div style="height:10px"></div>';
  $('fb').textContent='';$('fb').className='fb';
  $('next').classList.add('hide');
  var box=$('opts');box.innerHTML='';
  shuffle([cur.a].concat(cur.o)).forEach(function(txt){
    var b=document.createElement('button');
    b.className='opt';b.textContent=txt;
    b.onclick=function(){pick(b,txt)};
    box.appendChild(b);
  });
}

function why(q){
  if(q.t==='A')return q.w+' and '+q.a+' rhyme!'+(q.n||'');
  if(q.t==='B')return q.o.join(', ')+' rhyme. '+q.a+' does not.';
  if(q.t==='C')return q.a.replace(' – ',' and ')+' rhyme!';
  if(q.t==='D')return q.a+' rhymes with '+q.rw+'!';
  return q.why;
}

function pick(btn,txt){
  if(locked)return;locked=true;
  var ok=txt===cur.a;
  var all=$('opts').children;
  for(var i=0;i<all.length;i++){
    all[i].disabled=true;
    if(all[i].textContent===cur.a)all[i].classList.add('right');
  }
  if(ok){score++;$('fb').textContent='🎉 Correct! '+why(cur);$('fb').className='fb ok'}
  else{btn.classList.add('wrong');missed.push(cur);$('fb').textContent='Not quite. '+why(cur);$('fb').className='fb no'}
  $('sc').textContent='⭐ '+score;
  $('next').textContent=idx===49?'See my score 🏆':'Next ➜';
  $('next').classList.remove('hide');
}

function next(){idx++;if(idx>=50)finish();else show()}

function finish(){
  $('quiz').classList.add('hide');$('end').classList.remove('hide');
  $('final').textContent=score+' / 50';
  var s=score>=45?5:score>=38?4:score>=30?3:score>=20?2:1;
  $('stars').textContent=new Array(s+1).join('⭐');
  $('msg').textContent=score>=45?'Amazing! You are a rhyming expert!':score>=38?'Great job! You really know your rhymes!':score>=30?'Good work! A little more practice and you will have it.':'Nice try! Let\'s practice again.';
  var b=getBest();if(!b||score>parseInt(b,10))setBest(score);
  var m=$('missed');m.innerHTML='';
  if(missed.length){
    var h=document.createElement('div');h.style.fontWeight='bold';h.style.margin='10px 0 4px';h.textContent='Let\'s look at the ones to practice:';m.appendChild(h);
    missed.forEach(function(q){var d=document.createElement('div');d.className='miss';d.textContent=why(q);m.appendChild(d)});
  }
}

function speak(){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var parts=[promptFor(cur)];
  if(cur.t==='A')parts.push(cur.w);
  if(cur.poem)parts.push(cur.poem.replace(/___/g,'blank').replace(/\n/g,'. '));
  var opts=$('opts').children;
  for(var i=0;i<opts.length;i++)parts.push(opts[i].textContent.replace(' – ',' and '));
  var u=new SpeechSynthesisUtterance(parts.join('. '));
  u.lang='en-US';u.rate=0.9;
  window.speechSynthesis.speak(u);
}

$('go').onclick=start;
$('again').onclick=function(){showBest();start()};
$('next').onclick=next;
$('say').onclick=speak;
showBest();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numbers to One Million — 100 Question Quiz</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --brand:#4f46e5; --brand-dark:#3730a3; --good:#16a34a; --bad:#dc2626;
  --border:#e5e7eb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161f; --card:#1e2130; --ink:#eef0f5; --muted:#9aa1b1;
    --border:#2c3040;
  }
}
:root[data-theme="dark"]{
  --bg:#14161f; --card:#1e2130; --ink:#eef0f5; --muted:#9aa1b1; --border:#2c3040;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); min-height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:640px; margin:0 auto; padding:24px 16px 60px;}
h1{font-size:1.3rem; margin:0 0 4px;}
.sub{color:var(--muted); font-size:.9rem; margin:0 0 20px;}
.bar{height:8px; background:var(--border); border-radius:99px; overflow:hidden; margin-bottom:8px;}
.bar > div{height:100%; background:var(--brand); transition:width .25s;}
.meta{display:flex; justify-content:space-between; font-size:.85rem; color:var(--muted); margin-bottom:18px;}
.card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
.tag{display:inline-block; font-size:.7rem; font-weight:600; color:var(--brand); background:rgba(79,70,229,.1); padding:3px 9px; border-radius:99px; margin-bottom:10px;}
.q{font-size:1.15rem; line-height:1.5; margin:0 0 18px; font-weight:600;}
.opt{display:block; width:100%; text-align:left; padding:13px 16px; margin:8px 0; border-radius:10px; border:1.5px solid var(--border); background:transparent; color:var(--ink); font-size:1rem; cursor:pointer; transition:border-color .15s, background .15s;}
.opt:hover{border-color:var(--brand);}
.opt.correct{border-color:var(--good); background:rgba(22,163,74,.12);}
.opt.wrong{border-color:var(--bad); background:rgba(220,38,38,.12);}
.opt:disabled{cursor:default;}
.feedback{margin-top:14px; font-size:.92rem; padding:12px 14px; border-radius:10px; display:none;}
.feedback.show{display:block;}
.feedback.good{background:rgba(22,163,74,.1); color:var(--good);}
.feedback.bad{background:rgba(220,38,38,.1); color:var(--bad);}
.next{margin-top:16px; width:100%; padding:13px; border:none; border-radius:10px; background:var(--brand); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; display:none;}
.next.show{display:block;}
.next:hover{background:var(--brand-dark);}
.done{text-align:center; padding:20px 0;}
.done .score{font-size:2.6rem; font-weight:700; color:var(--brand); margin:10px 0;}
.restart{margin-top:18px; padding:13px 22px; border:none; border-radius:10px; background:var(--brand); color:#fff; font-weight:600; cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Numbers to One Million</h1>
  <p class="sub">100-question quiz — place value, expanded form, comparing, rounding &amp; mental math</p>
  <div class="bar"><div id="barFill" style="width:0%"></div></div>
  <div class="meta"><span id="qCount">Question 1 of 100</span><span id="scoreCount">Score: 0</span></div>
  <div class="card" id="card"></div>
</div>

<script>
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(n){return n.toLocaleString('en-US');}
function placeNames(){return ["ones","tens","hundreds","thousands","ten thousands","hundred thousands"];}

function randNumber(digits){
  const min = digits===1?1:Math.pow(10,digits-1);
  const max = Math.pow(10,digits)-1;
  return randInt(min,max);
}

function makeOptions(correct, spread){
  const opts=new Set([correct]);
  while(opts.size<4){
    let delta = randInt(1,spread) * (Math.random()<0.5?-1:1);
    let v = correct+delta;
    if(v>=0) opts.add(v);
  }
  return shuffle([...opts].map(String));
}

// ---- Question generators ----
function genPlaceValue(){
  const digits = randInt(5,6);
  const n = randNumber(digits);
  const s = String(n);
  const pos = randInt(0, s.length-1); // from left
  const digit = s[pos];
  const placeIndexFromRight = s.length-1-pos;
  const names = placeNames();
  const placeName = names[placeIndexFromRight];
  const value = Number(digit) * Math.pow(10, placeIndexFromRight);
  const correct = fmt(value);
  const opts = makeOptions(value, Math.max(value,10)).map(v=>isNaN(Number(v))?v:fmt(Number(v)));
  return {
    tag:"Place Value",
    q:`In ${fmt(n)}, what is the value of the digit ${digit} (the digit in the ${placeName} place)?`,
    opts, correct
  };
}

function genDigitStands(){
  const digits = randInt(5,6);
  const n = randNumber(digits);
  const s = String(n);
  const pos = randInt(0, s.length-1);
  const digit = s[pos];
  const placeIndexFromRight = s.length-1-pos;
  const names = placeNames();
  const placeName = names[placeIndexFromRight];
  const wrongNames = shuffle(names.filter(x=>x!==placeName)).slice(0,3);
  const opts = shuffle([placeName,...wrongNames]);
  return {
    tag:"Place Value",
    q:`In ${fmt(n)}, the digit ${digit} stands for ${digit} ___?`,
    opts, correct: placeName
  };
}

function genExpandedToNumeral(){
  const digits = randInt(4,6);
  const n = randNumber(digits);
  const s = String(n);
  let parts=[];
  for(let i=0;i<s.length;i++){
    const d=Number(s[i]);
    if(d===0) continue;
    parts.push(d*Math.pow(10,s.length-1-i));
  }
  const expanded = parts.map(fmt).join(" + ");
  const correct = fmt(n);
  const opts = makeOptions(n, Math.max(Math.pow(10,digits-3),10)).map(v=>isNaN(Number(v))?v:fmt(Number(v)));
  return {
    tag:"Expanded Form",
    q:`What number is ${expanded} written in expanded form?`,
    opts, correct
  };
}

function genNumeralToExpanded(){
  const digits = randInt(4,6);
  const n = randNumber(digits);
  const s = String(n);
  let parts=[];
  for(let i=0;i<s.length;i++){
    const d=Number(s[i]);
    if(d===0) continue;
    parts.push(d*Math.pow(10,s.length-1-i));
  }
  const correctExp = parts.map(fmt).join(" + ");
  // generate 3 wrong expansions by tweaking one part's magnitude
  const wrongs = new Set();
  let guard=0;
  while(wrongs.size<3 && guard<30){
    guard++;
    let p2 = [...parts];
    const idx = randInt(0,p2.length-1);
    const factor = [10,0.1,2][randInt(0,2)];
    let newVal = Math.round(p2[idx]*factor);
    if(newVal===0 || newVal===p2[idx]) continue;
    p2[idx]=newVal;
    const str = p2.map(fmt).join(" + ");
    if(str!==correctExp) wrongs.add(str);
  }
  while(wrongs.size<3){ wrongs.add(correctExp+" "); } // fallback filler (rare)
  const opts = shuffle([correctExp, ...wrongs]);
  return {
    tag:"Expanded Form",
    q:`What is the expanded form of ${fmt(n)}?`,
    opts, correct: correctExp
  };
}

const onesWords=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const tensWords=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function threeDigitWords(n){
  let out=[];
  const h=Math.floor(n/100), r=n%100;
  if(h>0) out.push(onesWords[h]+" hundred");
  if(r>0){
    if(r<20) out.push(onesWords[r]);
    else{
      let t=Math.floor(r/10), o=r%10;
      out.push(tensWords[t]+(o>0?"-"+onesWords[o]:""));
    }
  }
  return out.join(" ");
}
function numberToWords(n){
  if(n===0) return "zero";
  const groups=[[1000000,"million"],[1000,"thousand"],[1,""]];
  let out=[];
  let rem=n;
  for(const [size,label] of groups){
    const g=Math.floor(rem/size);
    rem%=size;
    if(g>0){
      out.push(threeDigitWords(g)+(label?" "+label:""));
    }
  }
  return out.join(", ");
}

function genWordsToNumeral(){
  const digits = randInt(4,6);
  const n = randNumber(digits);
  const words = numberToWords(n);
  const correct = fmt(n);
  const opts = makeOptions(n, Math.max(Math.pow(10,digits-3),10)).map(v=>isNaN(Number(v))?v:fmt(Number(v)));
  return {
    tag:"Numbers in Words",
    q:`Write this number in numerals: "${words}"`,
    opts, correct
  };
}

function genNumeralToWords(){
  const digits = randInt(4,6);
  const n = randNumber(digits);
  const correct = numberToWords(n);
  const wrongs=new Set();
  let guard=0;
  while(wrongs.size<3 && guard<30){
    guard++;
    const delta=randInt(1,9)*Math.pow(10,randInt(1,digits-1));
    const v=n+delta*(Math.random()<0.5?-1:1);
    if(v>0 && v!==n) wrongs.add(numberToWords(v));
  }
  while(wrongs.size<3){wrongs.add(correct+"");}
  const opts=shuffle([correct,...wrongs]);
  return {
    tag:"Numbers in Words",
    q:`How do you write ${fmt(n)} in words?`,
    opts, correct
  };
}

function genCompare(){
  const digits = randInt(5,6);
  const a = randNumber(digits);
  let b = a + randInt(-500,500);
  if(b<0) b = a+randInt(1,500);
  if(b===a) b=a+1;
  const correct = a>b ? ">" : "<";
  return {
    tag:"Comparing Numbers",
    q:`Which symbol correctly compares ${fmt(a)} ___ ${fmt(b)}?`,
    opts:[">","<","=","none of these"],
    correct
  };
}

function genOrder(){
  const digits = randInt(4,5);
  let nums = new Set();
  while(nums.size<4) nums.add(randNumber(digits));
  const arr=[...nums];
  const sorted=[...arr].sort((a,b)=>a-b);
  const correct = sorted.map(fmt).join(", ");
  const wrongs=new Set();
  let guard=0;
  while(wrongs.size<3 && guard<20){
    guard++;
    const shuffled=shuffle([...arr]);
    const str=shuffled.map(fmt).join(", ");
    if(str!==correct) wrongs.add(str);
  }
  while(wrongs.size<3){wrongs.add(shuffle([...arr]).map(fmt).join(", "));}
  const opts=shuffle([correct,...wrongs]);
  return {
    tag:"Ordering Numbers",
    q:`Which lists these numbers from least to greatest: ${arr.map(fmt).join(", ")}?`,
    opts, correct
  };
}

const roundUnits=[
  {size:10,name:"ten"},{size:100,name:"hundred"},{size:1000,name:"thousand"},
  {size:10000,name:"ten thousand"},{size:100000,name:"hundred thousand"}
];
function genRounding(){
  const digits=randInt(5,6);
  const n=randNumber(digits);
  const unit=roundUnits[randInt(1,roundUnits.length-1)];
  if(unit.size>=Math.pow(10,digits)) return genRounding();
  const rounded = Math.round(n/unit.size)*unit.size;
  const correct=fmt(rounded);
  const opts=makeOptions(rounded, unit.size).map(v=>isNaN(Number(v))?v:fmt(Number(v)));
  return {
    tag:"Rounding",
    q:`Round ${fmt(n)} to the nearest ${unit.name}.`,
    opts, correct
  };
}

function genMentalMath(){
  const type=randInt(0,3);
  const mags=[100,1000,10000,100000];
  const mag=mags[randInt(0,mags.length-1)];
  let a,b,op,result,qtext;
  if(type===0){
    a=randInt(1,90)*mag; b=randInt(1,90)*mag; op="+";
    result=a+b; qtext=`${fmt(a)} + ${fmt(b)} = ?`;
  } else if(type===1){
    a=randInt(20,99)*mag; b=randInt(1,19)*mag; op="-";
    result=a-b; qtext=`${fmt(a)} − ${fmt(b)} = ?`;
  } else if(type===2){
    a=randInt(1,20)*mag; b=randInt(2,9); op="×";
    result=a*b; qtext=`${fmt(a)} × ${b} = ?`;
  } else {
    b=randInt(2,9); const q=randInt(1,20)*mag/1; a=q*b;
    result=q; qtext=`${fmt(a)} ÷ ${b} = ?`;
  }
  const spread = Math.max(mag, 100);
  const opts=makeOptions(result, spread).map(v=>isNaN(Number(v))?v:fmt(Number(v)));
  return { tag:"Mental Math", q:qtext, opts, correct: fmt(result) };
}

function genUnitConversion(){
  const units=[
    {size:10,name:"tens"},{size:100,name:"hundreds"},{size:1000,name:"thousands"},{size:10000,name:"ten thousands"}
  ];
  const u = units[randInt(0,units.length-1)];
  const multiplier = randInt(2,90);
  const n = multiplier*u.size;
  const correct=String(multiplier);
  const opts=makeOptions(multiplier, Math.max(Math.floor(multiplier/2),3)).map(String);
  return {
    tag:"Place Value",
    q:`${fmt(n)} = ___ ${u.name}`,
    opts, correct
  };
}

function genPattern(){
  const digits=randInt(4,6);
  const start=randNumber(digits);
  const steps=[10,100,1000,10000];
  const step=steps[randInt(0,steps.length-1)];
  const dir = Math.random()<0.5?1:-1;
  const seqStart = dir===1 ? start : start+step*4;
  const seq=[seqStart, seqStart+dir*step, seqStart+dir*step*2, seqStart+dir*step*3];
  const next = seqStart+dir*step*4;
  if(next<0) return genPattern();
  const correct=fmt(next);
  const opts=makeOptions(next, step).map(v=>isNaN(Number(v))?v:fmt(Number(v)));
  return {
    tag:"Number Patterns",
    q:`What comes next in the pattern? ${seq.map(fmt).join(", ")}, ___`,
    opts, correct
  };
}

const generators=[genPlaceValue, genDigitStands, genExpandedToNumeral, genNumeralToExpanded,
  genWordsToNumeral, genNumeralToWords, genCompare, genOrder, genRounding, genMentalMath,
  genUnitConversion, genPattern];

function buildQuiz(total){
  const qs=[];
  let guardTotal=0;
  while(qs.length<total && guardTotal<total*5){
    guardTotal++;
    const gen=generators[randInt(0,generators.length-1)];
    try{
      const q=gen();
      if(q && q.opts && q.opts.length>=2) qs.push(q);
    }catch(e){/* skip a failed generation */}
  }
  return qs;
}

// ---- App state ----
const TOTAL=100;
let questions=buildQuiz(TOTAL);
let idx=0, score=0, answered=false;

const card=document.getElementById('card');
const barFill=document.getElementById('barFill');
const qCount=document.getElementById('qCount');
const scoreCount=document.getElementById('scoreCount');

function render(){
  if(idx>=questions.length){ renderDone(); return; }
  const q=questions[idx];
  answered=false;
  barFill.style.width = ((idx)/questions.length*100)+"%";
  qCount.textContent = `Question ${idx+1} of ${questions.length}`;
  scoreCount.textContent = `Score: ${score}`;
  card.innerHTML = `
    <span class="tag">${q.tag}</span>
    <p class="q">${q.q}</p>
    <div id="opts"></div>
    <div class="feedback" id="fb"></div>
    <button class="next" id="nextBtn">Next Question</button>
  `;
  const optsDiv=card.querySelector('#opts');
  q.opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='opt'; btn.textContent=opt;
    btn.onclick=()=>selectAnswer(btn, opt, q.correct);
    optsDiv.appendChild(btn);
  });
  card.querySelector('#nextBtn').onclick=()=>{ idx++; render(); };
}

function selectAnswer(btn, chosen, correct){
  if(answered) return;
  answered=true;
  const allBtns=card.querySelectorAll('.opt');
  allBtns.forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct) b.classList.add('correct');
  });
  const fb=card.querySelector('#fb');
  const isCorrect = chosen===correct;
  if(isCorrect){
    score++;
    fb.textContent="Correct! 🎉";
    fb.className="feedback show good";
  } else {
    btn.classList.add('wrong');
    fb.textContent=`Not quite — the correct answer is ${correct}.`;
    fb.className="feedback show bad";
  }
  scoreCount.textContent = `Score: ${score}`;
  card.querySelector('#nextBtn').classList.add('show');
}

function renderDone(){
  barFill.style.width="100%";
  qCount.textContent=`Question ${questions.length} of ${questions.length}`;
  const pct=Math.round(score/questions.length*100);
  card.innerHTML = `
    <div class="done">
      <p style="color:var(--muted);margin:0;">Quiz complete!</p>
      <div class="score">${score} / ${questions.length}</div>
      <p style="color:var(--muted);margin:0 0 6px;">${pct}% correct</p>
      <button class="restart" id="restartBtn">Try Again (New Questions)</button>
    </div>
  `;
  card.querySelector('#restartBtn').onclick=()=>{
    questions=buildQuiz(TOTAL); idx=0; score=0; render();
  };
}

render();
</script>
</body>
</html>

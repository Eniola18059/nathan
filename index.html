<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 4 Math Word Problems</title>
<style>
:root{--bg:#f4f8ff;--card:#fff;--ink:#1c2540;--mute:#5d6a8a;--pri:#d52b1e;--pri-ink:#fff;--ok:#1f8a4c;--okbg:#e3f6ea;--bad:#b3261e;--badbg:#fde8e6;--line:#d5def0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162a;--card:#1a2340;--ink:#eef2ff;--mute:#9aa7c9;--pri:#ff5a4d;--pri-ink:#1a0805;--ok:#58d38a;--okbg:#12361f;--bad:#ff8a80;--badbg:#3d1714;--line:#2c3860}}
:root[data-theme="dark"]{--bg:#10162a;--card:#1a2340;--ink:#eef2ff;--mute:#9aa7c9;--pri:#ff5a4d;--pri-ink:#1a0805;--ok:#58d38a;--okbg:#12361f;--bad:#ff8a80;--badbg:#3d1714;--line:#2c3860}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px}
h1{font-size:1.7rem;margin:0 0 8px}
p{margin:0 0 14px}
.mute{color:var(--mute)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 22px;background:var(--pri);color:var(--pri-ink);cursor:pointer;min-height:48px}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mute);margin-bottom:12px}
.q{font-size:1.25rem;margin:18px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.opts button{background:var(--bg);color:var(--ink);border:2px solid var(--line);font-size:1.15rem;padding:14px 10px}
.opts button:disabled{opacity:1;cursor:default}
.opts button.right{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.opts button.wrong{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.nx{margin-top:14px}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
.unit{color:var(--mute)}
.fb{margin-top:16px;padding:14px;border-radius:12px;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.score{font-size:3rem;font-weight:800;margin:6px 0}
ul{padding-left:20px}
li{margin-bottom:10px}
.hide{display:none}
</style>
</head>
<body>
<main>
<div id="app"></div>
</main>
<script>
// [question, answer, unit label]
var Q=[
["Maya collected 247 hockey cards. Her brother gave her 135 more. How many cards does she have now?",382,"cards"],
["A school library had 512 books. Students borrowed 168 of them. How many books are left on the shelves?",344,"books"],
["On Saturday, 326 people visited the ice maze at Winterlude. On Sunday, 289 people visited. How many people visited in all?",615,"people"],
["A farm in Saskatchewan had 450 bales of hay. The farmer sold 275 bales. How many bales are left?",175,"bales"],
["Liam read 138 pages last week and 159 pages this week. How many pages did he read altogether?",297,"pages"],
["A bus in Toronto had 64 passengers. At the next stop, 29 people got off. How many passengers are still on the bus?",35,"passengers"],
["There are 87 students in the Grade 3 choir and 76 in the Grade 4 choir. How many students are in both choirs?",163,"students"],
["A maple farm made 605 bottles of syrup and sold 348 bottles. How many bottles are left?",257,"bottles"],
["A hockey arena has 800 seats. At tonight’s game, 536 seats are filled. How many seats are empty?",264,"seats"],
["Ava had 1000 beads. She used 375 beads to make bracelets. How many beads does she have left?",625,"beads"],
["Noah scored 45 points in game 1, 38 points in game 2, and 27 points in game 3. How many points did he score in all three games?",110,"points"],
["A bakery baked 120 muffins in the morning and 85 in the afternoon. They sold 160 muffins. How many muffins are left?",45,"muffins"],
["A train travelled 245 km in the morning and 178 km in the afternoon. How many kilometres farther did it go in the morning?",67,"km"],
["A zoo had 1250 visitors on Monday and 1475 visitors on Tuesday. How many visitors came on both days?",2725,"visitors"],
["A town library has 2000 books. Of those, 1350 are fiction. How many books are NOT fiction?",650,"books"],
["Sam has 3 toonies and 2 loonies. How many dollars does he have?",8,"dollars ($)"],
["A pencil costs $1.25 and an eraser costs $0.75. How much do they cost together?",2,"dollars ($)"],
["Mia pays with a $5 bill for a snack that costs $3.40. How much change should she get?",1.6,"dollars ($)"],
["One notebook costs $2.50. How much do 3 notebooks cost?",7.5,"dollars ($)"],
["Max has 4 quarters and 3 dimes. How many cents does he have in all?",130,"cents (¢)"],
["A toy costs $9.75. Zara pays with a $10 bill. How much change does she get?",0.25,"dollars ($)"],
["Juice costs $1.50 and a sandwich costs $3.25. How much do they cost altogether?",4.75,"dollars ($)"],
["A classroom has 6 rows of desks with 7 desks in each row. How many desks are there?",42,"desks"],
["A box holds 6 donut holes. How many donut holes are in 4 boxes?",24,"donut holes"],
["There are 7 days in a week. How many days are in 5 weeks?",35,"days"],
["Each pack has 5 crayons. How many crayons are in 9 packs?",45,"crayons"],
["Each bike has 2 wheels. How many wheels are on 12 bikes?",24,"wheels"],
["An egg carton holds 12 eggs. How many eggs are in 4 cartons?",48,"eggs"],
["Each of 6 friends has 8 marbles. How many marbles do they have altogether?",48,"marbles"],
["A ticket to the school play costs $4. How much do 7 tickets cost?",28,"dollars ($)"],
["A bookcase has 9 shelves with 6 books on each shelf. How many books are on the bookcase?",54,"books"],
["A pool has 4 lanes. There are 15 swimmers in each lane. How many swimmers are there in all?",60,"swimmers"],
["Ben has 24 cookies. He shares them equally among 4 friends. How many cookies does each friend get?",6,"cookies"],
["A sticker book has 5 stickers on each page. Priya has 35 stickers. How many pages can she fill?",7,"pages"],
["42 students are split into 6 equal teams. How many students are on each team?",7,"students"],
["A coach puts 56 pucks equally into 7 buckets. How many pucks are in each bucket?",8,"pucks"],
["There are 18 apples to share equally into 3 baskets. How many apples go in each basket?",6,"apples"],
["Jo hikes 45 km over 5 days, going the same distance each day. How many kilometres does she hike each day?",9,"km"],
["A bakery packs 48 muffins into bags of 6. How many bags do they need?",8,"bags"],
["Lena has 29 stickers. Each page holds 4 stickers. How many pages can she fill completely?",7,"pages"],
["A chocolate bar has 12 squares. Omar eats half of the bar. How many squares does he eat?",6,"squares"],
["There are 20 students in a class. One quarter of them wear red. How many students wear red?",5,"students"],
["A 12 cm ribbon is cut into 3 equal pieces. How long is each piece?",4,"cm"],
["A pizza is cut into 8 equal slices. The family eats 5 slices. How many eighths of the pizza are left?",3,"slices"],
["Hockey practice starts at 3:30 p.m. and ends at 4:15 p.m. How many minutes long is practice?",45,"minutes"],
["A movie is 2 hours long. How many minutes is that?",120,"minutes"],
["A rectangular garden is 6 m long and 4 m wide. What is its perimeter?",20,"m"],
["A square skating rink has sides that are each 9 m long. What is its perimeter?",36,"m"],
["Each jug holds 2 litres of water. How many litres are in 5 jugs?",10,"L"],
["Emma saves $3 each week for 8 weeks. Then she spends $10. How many dollars does she have left?",14,"dollars ($)"]
];
var app=document.getElementById("app"),order=[],i=0,score=0,missed=[],answered=false;
function shuffle(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function fmt(n,u){return (u.indexOf("$")>-1?"$"+n.toFixed(2):n)+(u.indexOf("$")>-1?"":" "+u)}
function start(list){order=list;i=0;score=0;missed=[];show()}
function home(){app.innerHTML='<div class="card"><h1>🍁 Math Word Problems</h1><p class="mute">50 questions for Grade 4. Most review Grade 3 skills: adding, subtracting, money, times tables, sharing, fractions, time and measuring.</p><p>Tap the answer you think is right. Take your time and picture the story!</p><button id="go">Start the quiz</button></div>';
document.getElementById("go").onclick=function(){start(shuffle(Q.map(function(_,k){return k})))}}
function show(){
if(i>=order.length)return done();
answered=false;var q=Q[order[i]],o=opts(q);
app.innerHTML='<div class="card"><div class="top"><span>Question '+(i+1)+' of '+order.length+'</span><span>Score: '+score+'</span></div><div class="bar"><i style="width:'+(i/order.length*100)+'%"></i></div><div class="q">'+q[0]+'</div><p class="mute">Pick the answer (in '+q[2]+'):</p><div class="opts">'+o.map(function(x){return '<button data-v="'+x+'">'+lab(x,q[2])+'</button>'}).join("")+'</div><div id="fb" aria-live="polite"></div></div>';
var bs=app.querySelectorAll(".opts button");
bs.forEach(function(b){b.onclick=function(){pick(b,bs,q)}})}
function lab(n,u){return u.indexOf("$")>-1?"$"+n.toFixed(2):String(n)}
function opts(q){var a=q[1],money=q[2].indexOf("$")>-1,D;
if(money&&a%1!==0)D=[.25,-.25,.5,-.5,.75,1,-1,.1];else if(a>=100)D=[10,-10,100,-100,1,-1,20,-20];else if(a>=20)D=[1,-1,10,-10,2,-2,5,-5];else D=[1,-1,2,-2,3,-3,4];
var c=shuffle(D).map(function(d){return Math.round((a+d)*100)/100}).filter(function(x){return x>0&&x!==a});
return shuffle([a].concat(c.slice(0,3)))}
function pick(b,bs,q){if(answered)return;answered=true;
var ok=Math.abs(parseFloat(b.getAttribute("data-v"))-q[1])<0.001,fb=document.getElementById("fb");
bs.forEach(function(x){x.disabled=true;if(Math.abs(parseFloat(x.getAttribute("data-v"))-q[1])<0.001)x.className="right"});
if(ok){score++;fb.innerHTML='<div class="fb ok">✔ Correct! Great job.</div>'}
else{b.className="wrong";missed.push(order[i]);fb.innerHTML='<div class="fb no">Not quite. The answer is '+fmt(q[1],q[2])+'.</div>'}
var n=document.createElement("button");n.className="nx";n.textContent=(i===order.length-1)?"See my score":"Next";
n.onclick=function(){i++;show()};fb.appendChild(n);n.focus()}
function done(){
var pct=Math.round(score/order.length*100),msg=pct>=90?"Superstar! 🌟":pct>=70?"Great work! 👏":pct>=50?"Good effort, keep practising!":"Nice try! Practice makes progress.";
var h='<div class="card"><h1>All done!</h1><div class="score">'+score+' / '+order.length+'</div><p>'+msg+'</p>';
if(missed.length){h+='<p><b>Questions to review:</b></p><ul>'+missed.map(function(k){return '<li>'+Q[k][0]+'<br><b>Answer: '+fmt(Q[k][1],Q[k][2])+'</b></li>'}).join("")+'</ul><div class="row"><button id="rm">Retry missed questions</button><button class="alt" id="ag">New quiz</button></div>'}
else h+='<button id="ag">New quiz</button>';
app.innerHTML=h+'</div>';
document.getElementById("ag").onclick=home;
var rm=document.getElementById("rm");if(rm)rm.onclick=function(){start(shuffle(missed))}}
home();
</script>
</body>
</html>

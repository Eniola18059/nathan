<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christabel's Grade 2 Maths Quiz (Set 2)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2d42;--accent:#7b4fe0;--good:#2fb36d;--bad:#ef476f;--soft:#efe8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b2e;--card:#2a2745;--ink:#f3f0ff;--soft:#3a3560}}
:root[data-theme="dark"]{--bg:#1d1b2e;--card:#2a2745;--ink:#f3f0ff;--soft:#3a3560}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,'Comic Sans MS',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:560px}
.card{background:var(--card);border-radius:24px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.12);text-align:center}
h1{margin:.2em 0;font-size:2rem;color:var(--accent)}
.big{font-size:4rem;margin:0}
button{font-family:inherit;font-size:1.3rem;border:0;border-radius:16px;cursor:pointer;color:var(--ink)}
.start{background:var(--accent);color:#fff;padding:14px 36px;margin-top:16px}
.bar{height:14px;background:var(--soft);border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;font-weight:600}
.q{font-size:1.7rem;margin:18px 0;min-height:3.4em;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:var(--soft);padding:16px 8px;border:3px solid transparent;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad);color:#fff}
.fb{min-height:2em;margin-top:14px;font-size:1.2rem;font-weight:600}
.next{background:var(--accent);color:#fff;padding:12px 30px;margin-top:8px}
.rev{text-align:left;font-size:1rem;margin-top:12px}
.rev div{padding:6px 0;border-bottom:1px dashed var(--soft)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
 <div class="card" id="start">
  <p class="big">🧮</p>
  <h1>Hi Christabel!</h1>
  <p>Grade 2 Maths Quiz &ndash; Set 2<br>50 brand new questions. Take your time and do your best!</p>
  <button class="start" onclick="begin()">Start Quiz ⭐</button>
 </div>
 <div class="card hide" id="quiz">
  <div class="top"><span id="num"></span><span id="sc"></span></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="q" id="q"></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb"></div>
  <button class="next hide" id="nx" onclick="next()">Next ➜</button>
 </div>
 <div class="card hide" id="end">
  <p class="big" id="stars"></p>
  <h1 id="res"></h1>
  <p id="msg"></p>
  <div class="rev" id="rev"></div>
  <button class="start" onclick="begin()">Try Again 🔁</button>
 </div>
</div>
<script>
// [question, correct answer, wrong, wrong, wrong]
const Q=[
["17 + 6 = ?","23","22","24","13"],
["38 + 5 = ?","43","33","42","44"],
["54 + 30 = ?","84","57","74","94"],
["67 + 19 = ?","86","76","85","96"],
["23 + 48 = ?","71","61","70","81"],
["81 − 6 = ?","75","85","74","76"],
["63 − 40 = ?","23","103","33","22"],
["72 − 28 = ?","44","54","56","46"],
["100 − 35 = ?","65","75","55","135"],
["56 − 29 = ?","27","37","23","35"],
["9 + 9 = ?","18","81","17","19"],
["12 − 7 = ?","5","4","6","19"],
["40 + 40 = ?","80","8","44","70"],
["15 + 15 = ?","30","20","25","35"],
["What number comes after 99?","100","98","101","90"],
["What number comes just before 60?","59","61","50","58"],
["Which number is between 47 and 49?","48","46","50","57"],
["3 tens and 4 ones make which number?","34","43","7","304"],
["6 tens and 0 ones make which number?","60","6","600","66"],
["What is the ones digit in 82?","2","8","82","80"],
["What is 10 more than 36?","46","37","35","136"],
["What is 10 less than 71?","61","70","81","72"],
["Which list goes from smallest to greatest?","12, 25, 31","31, 25, 12","25, 12, 31","12, 31, 25"],
["Count backwards by 2s: 20, 18, 16, __","14","15","12","13"],
["Count by 5s: 35, 40, 45, __","50","55","46","49"],
["Count by 10s: 70, 80, 90, __","100","91","95","110"],
["Which number is even?","14","15","19","27"],
["Which number is odd?","33","20","26","48"],
["2 + 2 + 2 + 2 + 2 = ?","10","8","12","22"],
["3 rows of 5 stars. How many stars in all?","15","8","10","35"],
["Half of 20 = ?","10","2","40","5"],
["Half of 14 = ?","7","6","28","8"],
["Double 12 = ?","24","14","22","26"],
["9 − __ = 4","5","4","6","13"],
["__ + 8 = 15","7","6","8","23"],
["How many cents are in 3 ten-cent coins?","30","13","3","20"],
["A pencil costs 20 cents and an eraser costs 15 cents. How much for both?","35 cents","5 cents","25 cents","45 cents"],
["How many minutes are in half an hour?","30","15","60","20"],
["How many hours are in one day?","24","12","60","7"],
["Which day comes after Tuesday?","Wednesday","Monday","Thursday","Friday"],
["Which month comes after March?","April","February","May","June"],
["Which shape has 4 equal sides?","Square","Triangle","Circle","Oval"],
["How many corners does a triangle have?","3","4","2","0"],
["Which solid shape is like a ball?","Sphere","Cube","Cone","Cylinder"],
["Which unit is best for measuring the height of a door?","Metres","Centimetres","Litres","Grams"],
["Which holds the most water?","Bucket","Cup","Spoon","Small bottle"],
["Musa has 30 marbles. He loses 12. How many are left?","18","42","20","28"],
["3 boxes have 10 pencils each. How many pencils in all?","30","13","20","40"],
["There are 16 balloons. 9 are red and the rest are blue. How many are blue?","7","25","6","8"],
["Ngozi read 25 pages on Monday and 30 pages on Tuesday. How many pages in all?","55","5","45","65"]
];
const $=id=>document.getElementById(id);
let i,score,missed,locked;
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function show(id){["start","quiz","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function begin(){i=0;score=0;missed=[];show("quiz");load()}
function load(){
 locked=false;const d=Q[i];
 $("num").textContent="Question "+(i+1)+" of "+Q.length;
 $("sc").textContent="⭐ "+score;
 $("pb").style.width=(i/Q.length*100)+"%";
 $("q").textContent=d[0];$("fb").textContent="";$("nx").classList.add("hide");
 $("opts").innerHTML="";
 shuffle(d.slice(1)).forEach(o=>{
  const b=document.createElement("button");b.className="opt";b.textContent=o;
  b.onclick=()=>pick(b,o);$("opts").appendChild(b)});
}
function pick(b,o){
 if(locked)return;locked=true;const d=Q[i];
 document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===d[1])x.classList.add("right")});
 if(o===d[1]){score++;$("fb").textContent=["🎉 Great job!","🌟 Correct!","👏 Well done!","💪 You got it!"][Math.floor(Math.random()*4)]}
 else{b.classList.add("wrong");missed.push(d);$("fb").textContent="Good try! The answer is "+d[1]}
 $("sc").textContent="⭐ "+score;
 $("nx").textContent=i===Q.length-1?"See my score ➜":"Next ➜";$("nx").classList.remove("hide");
}
function next(){i++;i<Q.length?load():finish()}
function finish(){
 show("end");$("pb").style.width="100%";
 const s=score>=45?3:score>=30?2:1;
 $("stars").textContent="⭐".repeat(s);
 $("res").textContent="Christabel, you scored "+score+" / "+Q.length;
 $("msg").textContent=score>=45?"Amazing! You are a maths superstar!":score>=30?"Very good work! Keep practising!":"Nice effort! Try again and beat your score!";
 $("rev").innerHTML=missed.length?"<b>Let's practise these:</b>"+missed.map(m=>"<div>"+m[0]+" → <b>"+m[1]+"</b></div>").join(""):"";
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplication Quiz – Exercises 1 &amp; 2</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --muted:#6b7280; --brand:#4f46e5; --brand2:#eef2ff;
    --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2; --line:#e5e7eb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.6rem;margin:8px 0 4px}
  .sub{color:var(--muted);margin:0 0 20px}
  .card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 18px}
  .bar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
  .meta{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
  .tag{display:inline-block;background:var(--brand2);color:var(--brand);font-weight:600;font-size:.8rem;padding:2px 10px;border-radius:99px}
  .q{font-size:1.25rem;font-weight:600;margin:14px 0 18px}
  .opts{display:grid;gap:10px}
  .opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px 16px;border:2px solid var(--line);background:#fff;border-radius:12px;font:inherit;cursor:pointer;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--brand);background:var(--brand2)}
  .opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand2);color:var(--brand);display:grid;place-items:center;font-size:.85rem}
  .opt.ok{border-color:var(--ok);background:var(--okbg)}
  .opt.bad{border-color:var(--bad);background:var(--badbg)}
  .opt:disabled{cursor:default}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;display:none}
  .fb.ok{display:block;background:var(--okbg);color:#14532d}
  .fb.bad{display:block;background:var(--badbg);color:#7f1d1d}
  button.main{margin-top:16px;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer}
  button.main:hover{filter:brightness(1.08)}
  button.alt{background:#fff;color:var(--brand);border:2px solid var(--brand)}
  .score{font-size:3rem;font-weight:800;color:var(--brand);margin:6px 0}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
  .split div{background:var(--brand2);border-radius:12px;padding:12px}
  .rev{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
  .rev details{border-bottom:1px solid var(--line);padding:8px 0}
  .rev summary{cursor:pointer;font-weight:600}
  .hide{display:none}
  @media(max-width:480px){.q{font-size:1.1rem}.split{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Multiplication Quiz</h1>
  <p class="sub">Chapter 4 · Exercises 1 &amp; 2 · 50 questions</p>

  <div class="card" id="start">
    <p>Mental maths, estimating and multiplying by a 1-digit number. Pick the correct answer for each question. You will see the working after every answer.</p>
    <button class="main" id="go">Start quiz</button>
  </div>

  <div class="card hide" id="quiz">
    <div class="meta"><span id="count"></span><span id="score"></span></div>
    <div class="bar"><i id="prog"></i></div>
    <span class="tag" id="tag"></span>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="main hide" id="next">Next question</button>
  </div>

  <div class="card hide" id="end">
    <h2 style="margin-top:0">Quiz complete</h2>
    <div class="score" id="final"></div>
    <div class="split">
      <div><b>Exercise 1</b><br><span id="e1"></span></div>
      <div><b>Exercise 2</b><br><span id="e2"></span></div>
    </div>
    <button class="main" id="again">Try again</button>
    <button class="main alt" id="wrongOnly">Retry missed questions</button>
    <div class="rev" id="rev"></div>
  </div>
</div>

<script>
const DATA = [{"ex": 1, "q": "12 × 3 = 30 + 6 = ?", "a": "36", "w": ["63", "306", "39"], "e": "Split 12 into 10 and 2. 10 × 3 = 30 and 2 × 3 = 6, so 30 + 6 = 36."}, {"ex": 1, "q": "12 hundreds × 3 = 36 hundreds. What is that as a number?", "a": "3,600", "w": ["360", "36,000", "306"], "e": "36 hundreds = 36 × 100 = 3,600."}, {"ex": 1, "q": "12 thousands × 3 = 36 thousands. What is that as a number?", "a": "36,000", "w": ["3,600", "360,000", "306,000"], "e": "36 thousands = 36 × 1,000 = 36,000."}, {"ex": 1, "q": "Fill in the blank: 35 × 4 = 120 + ___", "a": "20", "w": ["5", "9", "24"], "e": "Split 35 into 30 and 5. 30 × 4 = 120 and 5 × 4 = 20."}, {"ex": 1, "q": "35 × 4 = ?", "a": "140", "w": ["120", "1,400", "130"], "e": "30 × 4 = 120 and 5 × 4 = 20, so 120 + 20 = 140."}, {"ex": 1, "q": "350 × 4 = ?", "a": "1,400", "w": ["140", "14,000", "1,200"], "e": "35 × 4 = 140, so 350 × 4 is 10 times bigger: 1,400."}, {"ex": 1, "q": "3,500 × 4 = ?", "a": "14,000", "w": ["1,400", "140,000", "12,000"], "e": "35 hundreds × 4 = 140 hundreds = 14,000."}, {"ex": 1, "q": "35,000 × 4 = ?", "a": "140,000", "w": ["14,000", "1,400,000", "120,000"], "e": "35 thousands × 4 = 140 thousands = 140,000."}, {"ex": 1, "q": "99 × 7 = ?  (Hint: 100 × 7 = 700)", "a": "693", "w": ["707", "639", "790"], "e": "99 is 1 less than 100, so take one 7 away from 700: 700 − 7 = 693."}, {"ex": 1, "q": "199 × 7 = ?  (Hint: 200 × 7 = 1,400)", "a": "1,393", "w": ["1,407", "1,293", "1,399"], "e": "199 is 1 less than 200, so 1,400 − 7 = 1,393."}, {"ex": 1, "q": "299 × 7 = ?  (Hint: 300 × 7 = 2,100)", "a": "2,093", "w": ["2,107", "2,193", "2,099"], "e": "299 is 1 less than 300, so 2,100 − 7 = 2,093."}, {"ex": 1, "q": "2,999 × 7 = ?  (Hint: 3,000 × 7 = 21,000)", "a": "20,993", "w": ["21,007", "20,907", "21,993"], "e": "2,999 is 1 less than 3,000, so 21,000 − 7 = 20,993."}, {"ex": 1, "q": "150 × 9 = ?", "a": "1,350", "w": ["135", "1,050", "1,450"], "e": "15 × 9 = 135, and 150 is 10 times 15, so 1,350."}, {"ex": 1, "q": "40,000 × 8 = ?", "a": "320,000", "w": ["32,000", "3,200,000", "280,000"], "e": "4 × 8 = 32, then 4 ten-thousands × 8 = 32 ten-thousands = 320,000."}, {"ex": 1, "q": "1,300 × 5 = ?", "a": "6,500", "w": ["650", "5,500", "65,000"], "e": "13 hundreds × 5 = 65 hundreds = 6,500."}, {"ex": 1, "q": "2,500 × 4 = ?", "a": "10,000", "w": ["8,000", "1,000", "20,000"], "e": "25 hundreds × 4 = 100 hundreds = 10,000."}, {"ex": 1, "q": "910 × 2 = ?", "a": "1,820", "w": ["182", "1,020", "1,810"], "e": "91 × 2 = 182, and 910 is 10 times 91, so 1,820."}, {"ex": 1, "q": "15,000 × 3 = ?", "a": "45,000", "w": ["4,500", "35,000", "450,000"], "e": "15 thousands × 3 = 45 thousands = 45,000."}, {"ex": 1, "q": "7,200 × 8 = ?", "a": "57,600", "w": ["56,000", "5,760", "49,600"], "e": "72 hundreds × 8 = 576 hundreds = 57,600. (7,000 × 8 = 56,000 leaves out 200 × 8.)"}, {"ex": 1, "q": "5 × 42,000 = ?", "a": "210,000", "w": ["21,000", "200,000", "2,100,000"], "e": "5 × 42 = 210, so 5 × 42 thousands = 210 thousands = 210,000."}, {"ex": 1, "q": "98 × 6 = ?  (Hint: 100 × 6 = 600)", "a": "588", "w": ["612", "568", "608"], "e": "98 is 2 less than 100, so take away two 6s: 600 − 12 = 588."}, {"ex": 1, "q": "5 × 399 = ?", "a": "1,995", "w": ["2,005", "1,905", "1,985"], "e": "399 is 1 less than 400. 5 × 400 = 2,000, so 2,000 − 5 = 1,995."}, {"ex": 1, "q": "3 × 599 = ?", "a": "1,797", "w": ["1,803", "1,697", "1,787"], "e": "599 is 1 less than 600. 3 × 600 = 1,800, so 1,800 − 3 = 1,797."}, {"ex": 1, "q": "6,999 × 4 = ?", "a": "27,996", "w": ["28,004", "27,896", "27,986"], "e": "7,000 × 4 = 28,000, then take away 1 × 4 = 4: 27,996."}, {"ex": 1, "q": "A 24-foot-wide greenhouse frame costs $4,999. A farm buys 5 of them. What is the total cost?", "a": "$24,995", "w": ["$25,005", "$24,895", "$24,955"], "e": "5 × $5,000 = $25,000. Each frame is $1 less, so take away 5 × $1: $24,995."}, {"ex": 1, "q": "The pediatric clinic needs 250 bandages a week and the central clinic needs 600 a week. How many bandages should the two clinics order for 8 weeks?", "a": "6,800", "w": ["2,000", "4,800", "6,200"], "e": "Together they need 250 + 600 = 850 a week. 850 × 8 = 6,800."}, {"ex": 2, "q": "Estimate 5,172 × 4 by rounding 5,172 down to 5,000. What is 5,000 × 4?", "a": "20,000", "w": ["2,000", "200,000", "21,000"], "e": "5 × 4 = 20, so 5 thousands × 4 = 20,000."}, {"ex": 2, "q": "Estimate 5,172 × 4 by rounding 5,172 up to 5,200. What is 5,200 × 4?", "a": "20,800", "w": ["2,080", "20,400", "20,200"], "e": "52 hundreds × 4 = 208 hundreds = 20,800."}, {"ex": 2, "q": "5,172 × 4 = ?", "a": "20,688", "w": ["20,628", "20,788", "20,608"], "e": "2 ones × 4 = 8; 7 tens × 4 = 28 tens (carry 2 hundreds); 1 hundred × 4 + 2 hundreds = 6 hundreds; 5 thousands × 4 = 20 thousands. Answer: 20,688."}, {"ex": 2, "q": "In 5,172 × 4, what is 7 tens × 4?", "a": "28 tens (280)", "w": ["2 tens (20)", "28 hundreds (2,800)", "11 tens (110)"], "e": "7 × 4 = 28, so 7 tens × 4 = 28 tens, which is 280. That means 2 hundreds are carried and 8 tens stay."}, {"ex": 2, "q": "The exact answer to 5,172 × 4 is 20,688. Two estimates were 20,000 and 20,800. Which estimate is closer?", "a": "20,800, because it is only 112 away", "w": ["20,000, because it is a rounder number", "20,000, because it is lower than the answer", "They are the same distance away"], "e": "20,688 − 20,000 = 688, but 20,800 − 20,688 = 112. The smaller gap means 20,800 is closer."}, {"ex": 2, "q": "Dion estimated 3,521 × 3 to be 12,000. What number did he replace 3,521 with?", "a": "4,000", "w": ["3,000", "3,500", "4,500"], "e": "12,000 ÷ 3 = 4,000, so he rounded 3,521 up to 4,000."}, {"ex": 2, "q": "Mei estimated 3,521 × 3 to be 9,900. What number did she replace 3,521 with?", "a": "3,300", "w": ["3,000", "3,500", "3,330"], "e": "9,900 ÷ 3 = 3,300, so she used 3,300."}, {"ex": 2, "q": "The exact product of 3,521 and 3 is 10,563. Dion's estimate was 12,000 and Mei's was 9,900. Whose estimate is closer?", "a": "Mei, because 9,900 is 663 away", "w": ["Dion, because 12,000 is a rounder number", "Dion, because his estimate is higher than the answer", "They are equally close"], "e": "12,000 − 10,563 = 1,437 but 10,563 − 9,900 = 663. Mei's gap is smaller."}, {"ex": 2, "q": "3,521 × 3 = ?", "a": "10,563", "w": ["10,463", "10,553", "10,623"], "e": "1 × 3 = 3; 2 tens × 3 = 6 tens; 5 hundreds × 3 = 15 hundreds; 3 thousands × 3 = 9 thousands + 1 thousand carried = 10 thousands. Total 10,563."}, {"ex": 2, "q": "Which estimate shows that 9,183 × 3 is greater than 25,000?", "a": "9,000 × 3 = 27,000, which is greater than 25,000", "w": ["9,000 × 3 = 27,000, which is less than 25,000", "9,000 × 3 = 2,700, which is less than 25,000", "10,000 × 3 = 30,000, so the answer is exactly 30,000"], "e": "9,183 is more than 9,000, so the answer is more than 27,000. That is greater than 25,000. (Exact: 27,549.)"}, {"ex": 2, "q": "The product of 4,962 and 8 is closest to which multiple of 10,000?", "a": "40,000", "w": ["30,000", "50,000", "400,000"], "e": "4,962 is about 5,000 and 5,000 × 8 = 40,000. The exact answer 39,696 is closest to 40,000."}, {"ex": 2, "q": "4,962 × 8 = ?", "a": "39,696", "w": ["39,796", "38,696", "39,676"], "e": "2 × 8 = 16; 6 tens × 8 = 48 tens; 9 hundreds × 8 = 72 hundreds; 4 thousands × 8 = 32 thousands. Adding with carrying gives 39,696."}, {"ex": 2, "q": "Is 7 × 986 = 6,902 reasonable?", "a": "Yes, because 7 × 1,000 = 7,000 is close to 6,902", "w": ["No, because 7 × 1,000 = 7,000 is much bigger than 6,902", "No, because 7 × 986 should be about 700", "Yes, because any answer in the thousands is reasonable"], "e": "986 is close to 1,000, and 7 × 1,000 = 7,000. 6,902 is just under that, so it is reasonable."}, {"ex": 2, "q": "Is 71,081 × 8 = 57,448 reasonable?", "a": "No, because 70,000 × 8 = 560,000, so 57,448 is far too small", "w": ["Yes, because 70,000 × 8 = 560,000 is close to 57,448", "No, because 70,000 × 8 = 56,000 is smaller than 57,448", "Yes, because the answer has 5 digits like 71,081"], "e": "71,081 is about 70,000 and 7 × 8 = 56, so 70,000 × 8 = 560,000. 57,448 is about 10 times too small (exact: 568,648)."}, {"ex": 2, "q": "Which is the best estimate for 8,292 × 3?", "a": "24,000", "w": ["2,400", "240,000", "21,000"], "e": "Round 8,292 to 8,000. 8,000 × 3 = 24,000."}, {"ex": 2, "q": "8,292 × 3 = ?", "a": "24,876", "w": ["24,786", "24,976", "23,876"], "e": "2 × 3 = 6; 9 tens × 3 = 27 tens; 2 hundreds × 3 = 6 hundreds + 2 carried; 8 thousands × 3 = 24 thousands. Total 24,876."}, {"ex": 2, "q": "6,710 × 8 = ?", "a": "53,680", "w": ["52,680", "53,580", "54,680"], "e": "671 tens × 8 = 5,368 tens = 53,680. (Estimate: 7,000 × 8 = 56,000.)"}, {"ex": 2, "q": "6,114 × 7 = ?", "a": "42,798", "w": ["42,698", "42,788", "43,798"], "e": "4 × 7 = 28; 1 ten × 7 = 7 tens; 1 hundred × 7 = 7 hundreds; 6 thousands × 7 = 42 thousands. With carrying: 42,798."}, {"ex": 2, "q": "11,771 × 6 = ?", "a": "70,626", "w": ["70,426", "71,626", "69,626"], "e": "Estimate: 12,000 × 6 = 72,000. Exactly: 11,771 × 6 = 70,626."}, {"ex": 2, "q": "A backhoe costs $12,199 and an excavator costs $165,599. A company buys 4 backhoes and 1 excavator. What is the total cost?", "a": "$214,395", "w": ["$177,798", "$214,195", "$214,495"], "e": "4 × $12,199 = $48,796. Then $48,796 + $165,599 = $214,395."}, {"ex": 2, "q": "Challenge: 1,089 × 4 = ?", "a": "4,356", "w": ["4,256", "4,346", "4,456"], "e": "9 × 4 = 36; 8 tens × 4 = 32 tens; 0 hundreds + 3 carried; 1 thousand × 4 = 4 thousands. Answer: 4,356."}, {"ex": 2, "q": "Challenge: 1,089 × 9 = ?", "a": "9,801", "w": ["9,081", "9,891", "9,711"], "e": "1,089 × 9 = 9,801. Pattern: 1,089 × 9 is 1,089 written backwards!"}, {"ex": 2, "q": "Challenge: S, T, O and P are different digits. STOP × 4 = POTS. What is the number POTS?", "a": "8,712", "w": ["2,178", "7,812", "8,172"], "e": "STOP = 2,178 (S=2, T=1, O=7, P=8) and 2,178 × 4 = 8,712. So POTS = 8,712."}, {"ex": 2, "q": "Challenge: 1,089 × 5 = ?", "a": "5,445", "w": ["5,345", "5,545", "5,435"], "e": "9 × 5 = 45; 8 tens × 5 = 40 tens; 0 hundreds + 4 carried; 1 thousand × 5 = 5 thousands. Answer: 5,445."}];

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
const $ = id => document.getElementById(id);
let order, idx, correct, results;

function begin(list){
  order = shuffle(list);
  idx = 0; correct = 0; results = [];
  $('start').classList.add('hide'); $('end').classList.add('hide'); $('quiz').classList.remove('hide');
  show();
}

function show(){
  const item = order[idx];
  $('count').textContent = 'Question ' + (idx+1) + ' of ' + order.length;
  $('score').textContent = 'Score: ' + correct;
  $('prog').style.width = (idx/order.length*100) + '%';
  $('tag').textContent = 'Exercise ' + item.ex;
  $('q').textContent = item.q;
  $('fb').className = 'fb'; $('fb').textContent = '';
  $('next').classList.add('hide');
  const box = $('opts'); box.innerHTML = '';
  const choices = shuffle([item.a, ...item.w]);
  choices.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<b>' + 'ABCD'[i] + '</b><span></span>';
    b.querySelector('span').textContent = c;
    b.onclick = () => pick(b, c, item);
    box.appendChild(b);
  });
}

function pick(btn, choice, item){
  const ok = choice === item.a;
  [...document.querySelectorAll('.opt')].forEach(b=>{
    b.disabled = true;
    if (b.querySelector('span').textContent === item.a) b.classList.add('ok');
  });
  if (!ok) btn.classList.add('bad');
  if (ok) correct++;
  results.push({item, choice, ok});
  const fb = $('fb');
  fb.className = 'fb ' + (ok ? 'ok' : 'bad');
  fb.textContent = (ok ? 'Correct! ' : 'Not quite. The answer is ' + item.a + '. ') + item.e;
  $('score').textContent = 'Score: ' + correct;
  const n = $('next'); n.classList.remove('hide');
  n.textContent = idx === order.length-1 ? 'See results' : 'Next question';
}

$('next').onclick = () => {
  idx++;
  if (idx >= order.length) finish(); else show();
};

function finish(){
  $('quiz').classList.add('hide'); $('end').classList.remove('hide');
  $('final').textContent = correct + ' / ' + order.length;
  const by = ex => { const r = results.filter(x=>x.item.ex===ex); return r.filter(x=>x.ok).length + ' / ' + r.length; };
  $('e1').textContent = by(1); $('e2').textContent = by(2);
  const missed = results.filter(r=>!r.ok);
  $('wrongOnly').classList.toggle('hide', missed.length===0);
  const rev = $('rev'); rev.innerHTML = '';
  if (missed.length){
    const h = document.createElement('h3'); h.textContent = 'Questions to review'; rev.appendChild(h);
    missed.forEach(r=>{
      const d = document.createElement('details');
      const s = document.createElement('summary'); s.textContent = r.item.q;
      const p = document.createElement('p');
      p.textContent = 'Your answer: ' + r.choice + '. Correct answer: ' + r.item.a + '. ' + r.item.e;
      d.appendChild(s); d.appendChild(p); rev.appendChild(d);
    });
  }
}

$('go').onclick = () => begin(DATA);
$('again').onclick = () => begin(DATA);
$('wrongOnly').onclick = () => begin(results.filter(r=>!r.ok).map(r=>r.item));
</script>
</body>
</html>

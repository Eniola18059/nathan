<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nathan's Number Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --moss:#3D5A40; --moss-dark:#2A3F2C; --sand:#EFE6D0; --paper:#FAF6EC;
    --ink:#242A20; --trail:#C1440E; --trail-dark:#9A3409; --ok:#3D7A4A; --bad:#B83B2E;
    --line: rgba(36,42,32,0.12);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit}
  html{scroll-padding-top: env(safe-area-inset-top,0px);}
  body{
    margin:0; min-height:100%; background:var(--sand); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; justify-content:center; padding:32px 16px 48px;
  }
  .wrap{width:100%; max-width:560px;}
  header{margin-bottom:22px; text-align:left;}
  .kicker{font-size:15px; color:var(--moss); font-weight:600;}
  h1{
    font-family:'Fraunces',serif; font-weight:700; font-size:clamp(28px,6vw,38px);
    margin:2px 0 6px; color:var(--moss-dark); line-height:1.05;
  }
  .sub{color:#5B6156; font-size:15px; max-width:44ch;}

  .track{position:relative; height:10px; background:var(--line); border-radius:6px; margin:22px 0 8px; overflow:hidden;}
  .track-fill{height:100%; background:var(--trail); width:0%; transition:width .4s ease;}
  .progress-row{display:flex; justify-content:space-between; font-size:13px; color:#6B7163; font-weight:600;}

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:28px 26px; margin-top:20px; box-shadow:0 1px 0 var(--line);
  }
  .tag{display:inline-block; font-size:12.5px; font-weight:600; color:var(--moss); background:rgba(61,90,64,0.1); padding:4px 10px; border-radius:20px; margin-bottom:14px;}
  .question{font-family:'Fraunces',serif; font-size:clamp(20px,4.6vw,25px); line-height:1.35; margin:0 0 20px; color:var(--ink);}

  .options{display:grid; gap:10px;}
  .opt{
    text-align:left; font-family:inherit; font-size:16px; font-weight:600; color:var(--ink);
    background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:13px 16px;
    cursor:pointer; transition:border-color .15s, background .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--moss);}
  .opt:focus-visible{outline:3px solid var(--moss); outline-offset:2px;}
  .opt.correct{background:rgba(61,122,74,0.12); border-color:var(--ok); color:var(--moss-dark);}
  .opt.wrong{background:rgba(184,59,46,0.1); border-color:var(--bad); color:var(--bad);}
  .opt:disabled{cursor:default;}

  .feedback{min-height:24px; margin-top:16px; font-weight:600; font-size:15px;}
  .feedback.ok{color:var(--ok);}
  .feedback.bad{color:var(--bad);}

  .next{
    margin-top:18px; font-family:inherit; font-weight:700; font-size:15px; color:#fff;
    background:var(--trail); border:none; border-radius:9px; padding:12px 22px;
    cursor:pointer; visibility:hidden;
  }
  .next:hover{background:var(--trail-dark);}
  .next:focus-visible{outline:3px solid var(--moss-dark); outline-offset:2px;}

  .end h2{font-family:'Fraunces',serif; font-size:30px; color:var(--moss-dark); margin:0 0 8px;}
  .score-big{font-size:52px; font-weight:700; font-family:'Fraunces',serif; color:var(--trail);}
  .restart{margin-top:18px;}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sand:#20241C; --paper:#2A2F23; --ink:#EDE9DD; --line: rgba(237,233,221,0.14);
      --moss:#8FB89A; --moss-dark:#C8E0CD; --trail:#E07A3E; --trail-dark:#C1440E;
      --ok:#8FCB9C; --bad:#E58C7F;
    }
  }
  :root[data-theme="dark"]{
    --sand:#20241C; --paper:#2A2F23; --ink:#EDE9DD; --line: rgba(237,233,221,0.14);
    --moss:#8FB89A; --moss-dark:#C8E0CD; --trail:#E07A3E; --trail-dark:#C1440E;
    --ok:#8FCB9C; --bad:#E58C7F;
  }
  .opt{background:var(--paper);}
  @media (prefers-color-scheme: dark){ .opt{background:#333827;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Nathan's math practice</div>
    <h1>The Number Trail</h1>
    <div class="sub">100 questions on numbers &amp; operations — place value, addition, subtraction, times tables, multiplication, division, and mental math.</div>
  </header>

  <div class="progress-row"><span id="pos">Question 1 of 100</span><span id="scoreLabel">Score: 0</span></div>
  <div class="track"><div class="track-fill" id="fill"></div></div>

  <div class="card" id="card"></div>
</div>

<script>
// ---------- helpers ----------
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function uniqueDistractors(correct,gen,count){
  const set=new Set([correct]);
  let tries=0;
  while(set.size<count+1 && tries<50){set.add(gen()); tries++;}
  return [...set];
}
function makeQ(tag,text,correct,gen){
  const opts=shuffle(uniqueDistractors(correct,gen,3).map(String));
  return {tag,text,answer:String(correct),options:opts};
}

// ---------- category generators ----------
function qPlaceValue(){
  const n=ri(1000,9999);
  const digits=String(n).split('').map(Number);
  const places=['ones','tens','hundreds','thousands'];
  const idx=ri(0,3);
  const place=places[idx];
  const val=digits[3-idx]*Math.pow(10,idx);
  if(Math.random()<0.5){
    return makeQ('Place value',`In the number ${n}, what is the value of the digit in the ${place} place?`,val,
      ()=>ri(0,9)*Math.pow(10,ri(0,3)));
  }
  const other=ri(1000,9999);
  const bigger = n>other ? n : other;
  return makeQ('Comparing numbers',`Which number is greater: ${n} or ${other}?`,bigger,
    ()=> Math.random()<0.5? n : other);
}
function qAddition(){
  const a=ri(100,9999), b=ri(100,9999);
  const sum=a+b;
  return makeQ('Addition',`${a} + ${b} = ?`,sum,()=>sum+ri(-20,20)*(ri(0,1)?1:10));
}
function qSubtraction(){
  let a=ri(200,9999), b=ri(100,a-1);
  const diff=a-b;
  return makeQ('Subtraction',`${a} − ${b} = ?`,diff,()=>diff+ri(-20,20)*(ri(0,1)?1:10));
}
function qTimesTable(){
  const a=ri(6,9), b=ri(2,12);
  const prod=a*b;
  return makeQ('Times tables',`${a} × ${b} = ?`,prod,()=>prod+ri(-2,2)*a);
}
function qMultiDigitMult(){
  const a=ri(11,99), b=ri(2,9);
  const prod=a*b;
  return makeQ('Multiplication',`${a} × ${b} = ?`,prod,()=>prod+ri(-1,1)*b*ri(1,3));
}
function qDivision(){
  const clean = Math.random()<0.6;
  const b=ri(2,9);
  if(clean){
    const q=ri(3,30); const a=b*q;
    return makeQ('Division',`${a} ÷ ${b} = ?`,q,()=>q+ri(-2,2));
  } else {
    const q=ri(3,20); const r=ri(1,b-1); const a=b*q+r;
    return makeQ('Division with remainder',`${a} ÷ ${b} = ? (give the remainder)`,r,()=>ri(1,b-1));
  }
}
function qMentalMath(){
  const type=ri(0,2);
  if(type===0){
    const n=ri(10,900); const step=[10,100][ri(0,1)];
    return makeQ('Mental math',`What is ${n} + ${step}?`,n+step,()=>n+step+ri(-5,5));
  } else if(type===1){
    const n=ri(200,999); const round=Math.round(n/100)*100;
    return makeQ('Rounding',`Round ${n} to the nearest hundred.`,round,()=>round+ri(-2,2)*100);
  } else {
    const start=ri(2,50); const step=ri(2,9);
    const seq=[start,start+step,start+2*step,start+3*step];
    const next=start+4*step;
    return makeQ('Number patterns',`What comes next? ${seq.join(', ')}, ___`,next,()=>next+ri(-3,3)*step);
  }
}

const gens=[qPlaceValue,qAddition,qSubtraction,qTimesTable,qMultiDigitMult,qDivision,qMentalMath];

function buildQuestions(total){
  const out=[];
  let i=0;
  while(out.length<total){
    out.push(gens[i % gens.length]());
    i++;
  }
  return out;
}

const TOTAL=100;
let questions=buildQuestions(TOTAL);
let current=0, score=0, answered=false;

const card=document.getElementById('card');
const fill=document.getElementById('fill');
const pos=document.getElementById('pos');
const scoreLabel=document.getElementById('scoreLabel');

function render(){
  fill.style.width=(current/TOTAL*100)+'%';
  pos.textContent=`Question ${Math.min(current+1,TOTAL)} of ${TOTAL}`;
  scoreLabel.textContent=`Score: ${score}`;

  if(current>=TOTAL){
    card.innerHTML=`
      <div class="end">
        <h2>Trail complete, Nathan!</h2>
        <div class="score-big">${score} / ${TOTAL}</div>
        <p class="sub" style="margin-top:8px;">${score>=90?"Outstanding work — you know your numbers cold.":score>=70?"Great job! A little more practice and you'll be unstoppable.":"Nice effort — replay the trail to sharpen the tricky spots."}</p>
        <button class="next restart" style="visibility:visible" onclick="restart()">Walk the trail again</button>
      </div>`;
    return;
  }

  const q=questions[current];
  answered=false;
  card.innerHTML=`
    <span class="tag">${q.tag}</span>
    <p class="question">${q.text}</p>
    <div class="options" id="opts"></div>
    <div class="feedback" id="fb"></div>
    <button class="next" id="nextBtn" onclick="nextQ()">Next</button>
  `;
  const optsEl=document.getElementById('opts');
  q.options.forEach(opt=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=opt;
    b.onclick=()=>select(b,opt,q.answer);
    optsEl.appendChild(b);
  });
}

function select(btn,chosen,correctAns){
  if(answered) return;
  answered=true;
  const fb=document.getElementById('fb');
  const allBtns=document.querySelectorAll('.opt');
  allBtns.forEach(b=>{
    b.disabled=true;
    if(b.textContent===correctAns) b.classList.add('correct');
  });
  if(chosen===correctAns){
    score++;
    fb.textContent='Correct!';
    fb.className='feedback ok';
  } else {
    btn.classList.add('wrong');
    fb.textContent=`Not quite — the answer is ${correctAns}.`;
    fb.className='feedback bad';
  }
  document.getElementById('nextBtn').style.visibility='visible';
  scoreLabel.textContent=`Score: ${score}`;
}

function nextQ(){ current++; render(); }
function restart(){ questions=buildQuestions(TOTAL); current=0; score=0; render(); }

render();
</script>
</body>
</html>

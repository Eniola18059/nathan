<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 1 Word Problems Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12403a;--bg:#d6f2e3;--card:#fff;--sun:#ffcf4a;--pink:#ff7aa8;--ok:#1a9a5f;--okbg:#d9f7e6;--no:#d6455d;--nobg:#ffe1e7;--muted:#3f6a62}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px 12px;font-family:Nunito,system-ui,sans-serif;font-weight:700;color:var(--ink);background:var(--bg) radial-gradient(circle at 12% 88%,#bfe8d2 0 90px,transparent 91px),radial-gradient(circle at 92% 10%,#bfe8d2 0 70px,transparent 71px)}
h1,h2,.fat{font-family:"Baloo 2",Nunito,system-ui,sans-serif;font-weight:800;margin:0}
main{max-width:640px;margin:0 auto}
.card{background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:22px;box-shadow:0 8px 0 var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid #3b7ddd;outline-offset:3px}
.btn{background:var(--sun);border:4px solid var(--ink);border-radius:18px;padding:12px 28px;font-size:1.3rem;font-weight:800;box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--card)}
.hidden{display:none!important}
#start,#res{text-align:center}
#start h1{font-size:2.5rem;line-height:1.05;margin:8px 0 10px}
#start p{font-size:1.2rem;color:var(--muted);margin:0 0 20px}
.big{font-size:4rem;line-height:1}
.top{display:flex;justify-content:space-between;font-size:1.15rem;margin-bottom:6px}
.track{position:relative;height:16px;margin:26px 10px 16px;background:#bfe8d2;border:3px solid var(--ink);border-radius:99px}
.track i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:99px;width:0;transition:width .35s}
.frog{position:absolute;top:-26px;font-size:1.8rem;transform:translateX(-50%);transition:left .35s}
.tag{display:inline-block;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:1px 10px;font-size:.95rem;margin-bottom:10px}
.qrow{display:flex;gap:10px;align-items:flex-start}
#q{font-size:1.5rem;line-height:1.35;margin:0 0 12px;font-weight:800;flex:1}
#say{background:var(--card);border:3px solid var(--ink);border-radius:50%;width:48px;height:48px;font-size:1.4rem;flex:none}
#vis{font-size:1.6rem;line-height:1.5;background:#f2fbf6;border:3px dashed #8fcfb0;border-radius:16px;padding:8px 12px;margin-bottom:16px;word-break:break-all}
#vis div+div{margin-top:2px}
#opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{background:var(--card);border:4px solid var(--ink);border-radius:18px;padding:14px 0;font-size:2.2rem;font-family:"Baloo 2",Nunito,sans-serif;font-weight:800;box-shadow:0 5px 0 var(--ink)}
.opt:hover:not(:disabled){background:var(--sun)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--ok);box-shadow:0 5px 0 var(--ok)}
.opt.wrong{background:var(--nobg);border-color:var(--no);box-shadow:0 5px 0 var(--no)}
#fb{min-height:70px;margin:16px 0 6px;font-size:1.25rem}
#fb b{display:block;font-size:1.4rem}
.ok-t{color:var(--ok)}.no-t{color:var(--no)}
.stars{font-size:3rem;letter-spacing:6px}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0;text-align:left}
.sec div{border:3px solid var(--ink);border-radius:14px;padding:6px 12px;display:flex;justify-content:space-between;gap:8px}
.miss{text-align:left;margin:12px 0;padding-left:20px}
.miss li{margin-bottom:10px}
.acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
@media(max-width:440px){#q{font-size:1.25rem}#vis{font-size:1.3rem}.opt{font-size:1.9rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="start" class="card">
  <div class="big" aria-hidden="true">🐸</div>
  <h1>Hop Into Word Problems!</h1>
  <p>100 story questions. Add and take away. Help the frog hop all the way across!</p>
  <button class="btn" id="go">Start</button>
</section>

<section id="quiz" class="card hidden" aria-live="polite">
  <div class="top"><span id="cnt"></span><span id="sc"></span></div>
  <div class="track" role="progressbar" aria-label="Progress"><i id="pg"></i><span class="frog" id="frog" aria-hidden="true">🐸</span></div>
  <span class="tag" id="tag"></span>
  <div class="qrow"><h2 id="q"></h2><button id="say" aria-label="Read the question aloud">🔊</button></div>
  <div id="vis" aria-hidden="true"></div>
  <div id="opts"></div>
  <div id="fb"></div>
  <button class="btn hidden" id="next">Next</button>
</section>

<section id="res" class="card hidden">
  <div class="stars" id="rs" aria-hidden="true"></div>
  <div class="big fat" id="rn"></div>
  <h2 id="rm" style="margin-top:8px"></h2>
  <div class="sec" id="rsec"></div>
  <div id="rmiss"></div>
  <div class="acts"><button class="btn" id="again">Play again</button><button class="btn alt hidden" id="retry">Retry missed</button></div>
</section>
</main>

<script>
const SECS=["Add up to 10","Take away within 10","Add up to 20","Take away within 20","Mix it up"];
const NM=["Ava","Ben","Zoe","Sam","Mia","Leo","Ian","Ruby","Noah","Lily"];
const IT=[["apples","🍎"],["stars","⭐"],["balloons","🎈"],["cookies","🍪"],["birds","🐦"],["fish","🐟"],["toy cars","🚗"],["books","📚"],["flowers","🌼"],["ducks","🦆"],["kites","🪁"],["shells","🐚"]];
// Fixed seed so the 100 questions are the same every time
let seed=2024;const rnd=()=>(seed=(seed*1664525+1013904223)%4294967296)/4294967296;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)),pk=a=>a[Math.floor(rnd()*a.length)];

function build(type,a,b,c){
  const [x,e]=pk(IT),n=pk(NM);let m=pk(NM);while(m===n)m=pk(NM);
  if(type==="add")return{q:pk([`${n} has ${a} ${x}. A friend gives ${n} ${b} more. How many ${x} does ${n} have now?`,`There are ${a} ${x} in a box and ${b} ${x} on the table. How many ${x} are there in all?`,`${n} sees ${a} ${x}. Then ${b} more ${x} come. How many ${x} are there now?`]),ans:a+b,eq:`${a} + ${b} = ${a+b}`,v:["add",a,b,e]};
  if(type==="sub")return{q:pk([`${n} has ${a} ${x}. ${n} gives ${b} away. How many ${x} are left?`,`There are ${a} ${x} on a shelf. ${b} ${x} are taken. How many ${x} are left?`,`${n} had ${a} ${x}. ${b} ${x} got lost. How many ${x} does ${n} have now?`]),ans:a-b,eq:`${a} − ${b} = ${a-b}`,v:["sub",a,b,e]};
  if(type==="cmp")return{q:`${n} has ${a} ${x}. ${m} has ${b} ${x}. How many more ${x} does ${n} have than ${m}?`,ans:a-b,eq:`${a} − ${b} = ${a-b}`,v:["cmp",a,b,e]};
  if(type==="need")return{q:`${n} has ${a} ${x}. ${n} wants ${b}. How many more ${x} does ${n} need?`,ans:b-a,eq:`${b} − ${a} = ${b-a}`,v:["row",a,0,e]};
  return{q:`${n} has ${a} ${x}, ${m} has ${b} ${x}, and Mom has ${c} ${x}. How many ${x} are there in all?`,ans:a+b+c,eq:`${a} + ${b} + ${c} = ${a+b+c}`,v:["add3",a,b,e,c]};
}
const Q=[],seen=new Set();
function gen(sec,count,type,fn){
  while(count>0){
    const [a,b,c]=fn(),k=type+a+"-"+b+"-"+c;
    if(seen.has(k))continue;seen.add(k);
    const o=build(type,a,b,c);o.sec=sec;Q.push(o);count--;
  }
}
gen(0,20,"add",()=>{const a=ri(1,8),b=ri(1,10-a);return a+b<3?[2,1]:[a,b]});
gen(1,20,"sub",()=>{const a=ri(3,10);return[a,ri(1,a-1)]});
gen(2,20,"add",()=>{const a=ri(4,12),b=ri(3,9);return a+b>10&&a+b<=20?[a,b]:[8,5]});
gen(3,20,"sub",()=>{const a=ri(11,20),b=ri(2,9);return a-b>=2?[a,b]:[15,6]});
gen(4,7,"cmp",()=>{const a=ri(6,18);return[a,ri(2,a-2)]});
gen(4,7,"need",()=>{const a=ri(3,14);return[a,ri(a+2,20)]});
gen(4,6,"add3",()=>{const a=ri(2,7),b=ri(2,7),c=ri(2,6);return[a,b,c]});

const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const row=(e,k,f)=>`<span${f?' style="opacity:.25"':""}>${e.repeat(k)}</span>`;
function vis(v){
  const [t,a,b,e,c]=v;
  if(t==="add")return`<div>${row(e,a)} ➕ ${row(e,b)}</div>`;
  if(t==="add3")return`<div>${row(e,a)} ➕ ${row(e,b)} ➕ ${row(e,c)}</div>`;
  if(t==="sub")return`<div>${row(e,a-b)}${row(e,b,1)}</div>`;
  if(t==="cmp")return`<div>${row(e,a)}</div><div>${row(e,b)}</div>`;
  return`<div>${row(e,a)}</div>`;
}
let order,idx,score,missed,secScore,locked;
function start(list){
  order=list;idx=0;score=0;missed=[];secScore=SECS.map(()=>0);
  $("start").classList.add("hidden");$("res").classList.add("hidden");$("quiz").classList.remove("hidden");show();
}
function show(){
  locked=false;const q=Q[order[idx]];
  $("cnt").textContent=`Question ${idx+1} of ${order.length}`;$("sc").textContent="⭐ "+score;
  const p=idx/order.length*100;$("pg").style.width=p+"%";$("frog").style.left=p+"%";
  $("tag").textContent=SECS[q.sec];$("q").textContent=q.q;$("vis").innerHTML=vis(q.v);
  $("fb").innerHTML="";$("next").classList.add("hidden");$("opts").innerHTML="";
  const w=shuffle([q.ans-3,q.ans-2,q.ans-1,q.ans+1,q.ans+2,q.ans+3].filter(n=>n>=0&&n<=20)).slice(0,2);
  shuffle([q.ans,...w]).forEach((o,i)=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o;
    b.setAttribute("aria-label","Answer "+(i+1)+": "+o);b.onclick=()=>pick(b,o);$("opts").appendChild(b);
  });
}
function pick(btn,val){
  if(locked)return;locked=true;const n=order[idx],q=Q[n],ok=val===q.ans;
  [...$("opts").children].forEach(b=>{b.disabled=true;if(+b.textContent===q.ans)b.classList.add("right")});
  if(ok){score++;secScore[q.sec]++;$("fb").innerHTML=`<b class="ok-t">Yes! Great hop! 🎉</b>${q.eq}`}
  else{btn.classList.add("wrong");missed.push(n);$("fb").innerHTML=`<b class="no-t">Oops! The answer is ${q.ans}.</b>${q.eq}`}
  $("sc").textContent="⭐ "+score;
  $("next").textContent=idx===order.length-1?"See my stars":"Next";
  $("next").classList.remove("hidden");$("next").focus();
}
function finish(){
  $("quiz").classList.add("hidden");$("res").classList.remove("hidden");
  const t=order.length,p=score/t,st=p>=.9?3:p>=.7?2:p>=.5?1:0;
  $("rs").textContent="★".repeat(st)+"☆".repeat(3-st);$("rn").textContent=score+" / "+t;
  $("rm").textContent=p>=.9?"Super frog! Amazing!":p>=.7?"Great job!":p>=.5?"Nice hopping! Keep going!":"Keep practising. You can do it!";
  $("rsec").innerHTML=t===100?SECS.map((s,i)=>`<div><span>${s}</span><span>${secScore[i]}/20</span></div>`).join(""):"";
  $("rmiss").innerHTML=missed.length?`<h2 style="font-size:1.4rem">Let's look again</h2><ul class="miss">${missed.map(n=>`<li>${Q[n].q}<br><b>${Q[n].eq}</b></li>`).join("")}</ul>`:"<p>You got every question right!</p>";
  $("retry").classList.toggle("hidden",!missed.length);
}
const all=()=>shuffle(Q.map((_,i)=>i));
$("go").onclick=()=>start(all());$("again").onclick=()=>start(all());$("retry").onclick=()=>start(shuffle(missed));
$("next").onclick=()=>{idx++;idx<order.length?show():finish()};
if(!("speechSynthesis" in window))$("say").classList.add("hidden");
$("say").onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($("q").textContent);u.rate=.85;speechSynthesis.speak(u)};
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden")||locked)return;
  if(e.key>="1"&&e.key<="3"){const b=$("opts").children[+e.key-1];b&&b.click()}
});
</script>
</body>
</html>

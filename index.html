<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 3 Math Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EAF7F0;
    --card: #FFFFFF;
    --navy: #1F2A44;
    --teal: #2E9E8E;
    --teal-dark: #248375;
    --sun: #FFC857;
    --leaf: #3FAE7A;
    --leaf-bg: #E4F6EC;
    --oops-bg: #FDE9E7;
    --coral-dark: #E85A45;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #10151F;
      --card: #1B2333;
      --navy: #EDEFF5;
      --leaf-bg: #16321F;
      --oops-bg: #3A1E1A;
    }
  }
  :root[data-theme="dark"]{
    --bg: #10151F;
    --card: #1B2333;
    --navy: #EDEFF5;
    --leaf-bg: #16321F;
    --oops-bg: #3A1E1A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'Nunito',sans-serif;
    color:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{ width:100%; max-width:520px; }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:clamp(1.5rem,5vw,2rem);
    text-align:center;
    margin:0 0 4px;
  }
  .sub{ text-align:center; margin:0 0 20px; opacity:.75; font-weight:600; font-size:.95rem;}
  .track{
    height:10px; background:rgba(0,0,0,.08); border-radius:999px; overflow:hidden; margin-bottom:24px;
  }
  .fill{ height:100%; background:var(--sun); width:0%; transition:width .35s ease; }
  .card{
    background:var(--card);
    border-radius:20px;
    padding:32px 28px;
    box-shadow:0 10px 30px rgba(15,30,60,.08);
  }
  .qnum{ font-weight:800; color:var(--teal-dark); font-size:.9rem; margin-bottom:10px;}
  .question{
    text-align:center;
    font-family:'Baloo 2',sans-serif; font-size:2rem; margin:14px 0 28px;
    letter-spacing:.5px;
  }
  .options{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  .opt{
    background:var(--bg);
    border:2px solid transparent;
    border-radius:14px;
    padding:16px 8px;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:1.25rem;
    cursor:pointer;
    color:var(--navy);
    transition:transform .12s ease, border-color .12s ease;
  }
  .opt:hover{ transform:translateY(-2px); }
  .opt:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }
  .opt.correct{ background:var(--leaf-bg); border-color:var(--leaf); }
  .opt.wrong{ background:var(--oops-bg); border-color:var(--coral-dark); }
  .opt[disabled]{ cursor:default; }
  .feedback{
    min-height:26px; text-align:center; font-weight:700; margin-top:16px; font-size:.95rem;
  }
  .feedback.good{ color:var(--leaf); }
  .feedback.bad{ color:var(--coral-dark); }
  .next-btn{
    display:block; margin:18px auto 0; background:var(--teal); color:#fff; border:none;
    padding:12px 28px; border-radius:999px; font-family:'Baloo 2',sans-serif; font-size:1rem;
    cursor:pointer; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .next-btn.show{ opacity:1; pointer-events:auto; }
  .result{ text-align:center; }
  .result .big{ font-family:'Baloo 2',sans-serif; font-size:3rem; color:var(--teal-dark); margin:8px 0; }
  .result p{ font-weight:600; }
  .restart{
    margin-top:18px; background:var(--navy); color:var(--card); border:none;
    padding:12px 30px; border-radius:999px; font-family:'Baloo 2',sans-serif; font-size:1rem; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Grade 3 Math Quiz</h1>
  <p class="sub">50 questions &middot; addition, subtraction, multiplication &amp; division</p>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="card" id="card"></div>
</div>

<script>
// expr shown to the student; correct = right answer; opts = 4 numbers (correct + 3 distractors)
const questions = [
  {expr:"45 + 32", correct:77, opts:[77,87,67,76]},
  {expr:"128 + 56", correct:184, opts:[184,174,194,183]},
  {expr:"214 + 179", correct:393, opts:[393,383,403,392]},
  {expr:"67 + 88", correct:155, opts:[155,145,165,154]},
  {expr:"302 + 145", correct:447, opts:[447,437,457,446]},
  {expr:"19 + 76", correct:95, opts:[95,85,105,94]},
  {expr:"456 + 233", correct:689, opts:[689,679,699,688]},
  {expr:"84 + 59", correct:143, opts:[143,133,153,142]},
  {expr:"615 + 278", correct:893, opts:[893,883,903,892]},
  {expr:"37 + 48", correct:85, opts:[85,75,95,84]},

  {expr:"90 - 34", correct:56, opts:[56,46,66,124]},
  {expr:"245 - 118", correct:127, opts:[127,117,137,363]},
  {expr:"500 - 267", correct:233, opts:[233,223,243,767]},
  {expr:"76 - 29", correct:47, opts:[47,37,57,105]},
  {expr:"342 - 156", correct:186, opts:[186,176,196,498]},
  {expr:"100 - 45", correct:55, opts:[55,45,65,145]},
  {expr:"623 - 389", correct:234, opts:[234,224,244,1012]},
  {expr:"84 - 37", correct:47, opts:[47,37,57,121]},
  {expr:"715 - 428", correct:287, opts:[287,277,297,1143]},
  {expr:"60 - 22", correct:38, opts:[38,28,48,82]},

  {expr:"4 \u00d7 6", correct:24, opts:[24,20,28,18]},
  {expr:"7 \u00d7 3", correct:21, opts:[21,18,24,14]},
  {expr:"5 \u00d7 9", correct:45, opts:[45,40,50,54]},
  {expr:"8 \u00d7 2", correct:16, opts:[16,14,18,10]},
  {expr:"6 \u00d7 6", correct:36, opts:[36,30,42,24]},
  {expr:"9 \u00d7 4", correct:36, opts:[36,32,40,27]},
  {expr:"3 \u00d7 8", correct:24, opts:[24,21,27,16]},
  {expr:"7 \u00d7 7", correct:49, opts:[49,42,56,63]},
  {expr:"5 \u00d7 5", correct:25, opts:[25,20,30,15]},
  {expr:"10 \u00d7 6", correct:60, opts:[60,50,70,16]},
  {expr:"2 \u00d7 9", correct:18, opts:[18,16,20,11]},
  {expr:"8 \u00d7 8", correct:64, opts:[64,56,72,16]},
  {expr:"4 \u00d7 10", correct:40, opts:[40,14,44,36]},
  {expr:"6 \u00d7 3", correct:18, opts:[18,15,21,9]},
  {expr:"9 \u00d7 9", correct:81, opts:[81,72,90,18]},

  {expr:"24 \u00f7 6", correct:4, opts:[4,3,5,8]},
  {expr:"35 \u00f7 5", correct:7, opts:[7,6,8,5]},
  {expr:"18 \u00f7 3", correct:6, opts:[6,5,7,3]},
  {expr:"63 \u00f7 7", correct:9, opts:[9,8,10,7]},
  {expr:"40 \u00f7 8", correct:5, opts:[5,4,6,8]},
  {expr:"27 \u00f7 9", correct:3, opts:[3,2,4,9]},
  {expr:"16 \u00f7 4", correct:4, opts:[4,3,5,8]},
  {expr:"45 \u00f7 5", correct:9, opts:[9,8,10,5]},
  {expr:"54 \u00f7 6", correct:9, opts:[9,8,10,6]},
  {expr:"21 \u00f7 3", correct:7, opts:[7,6,8,3]},

  {expr:"12 + 8 \u00d7 3", correct:36, opts:[36,60,32,44]},
  {expr:"50 - 4 \u00d7 5", correct:30, opts:[30,230,26,34]},
  {expr:"6 \u00d7 7 + 9", correct:51, opts:[51,96,47,55]},
  {expr:"100 - 6 \u00d7 6", correct:64, opts:[64,564,58,70]},
  {expr:"3 \u00d7 3 + 10", correct:19, opts:[19,39,15,23]}
];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let order = [];
let current = 0;
let score = 0;

function renderQuestion(){
  const card = document.getElementById('card');
  const q = questions[order[current]];
  document.getElementById('fill').style.width = ((current)/questions.length*100)+'%';

  const opts = shuffle(q.opts);

  const optsHTML = opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('');

  card.innerHTML = `
    <div class="qnum">Question ${current+1} of ${questions.length}</div>
    <div class="question">${q.expr} = ?</div>
    <div class="options">${optsHTML}</div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">${current === questions.length-1 ? 'See results' : 'Next question'}</button>
  `;

  const buttons = card.querySelectorAll('.opt');
  buttons.forEach((btn,i)=>{
    btn.addEventListener('click', ()=>{
      buttons.forEach(b=>b.disabled = true);
      const chosen = opts[i];
      const isCorrect = chosen === q.correct;
      const fb = document.getElementById('feedback');
      if(isCorrect){
        btn.classList.add('correct');
        fb.textContent = "That's right! Nicely done.";
        fb.className = 'feedback good';
        score++;
      } else {
        btn.classList.add('wrong');
        fb.textContent = "Not quite — check your working.";
        fb.className = 'feedback bad';
        buttons.forEach((b,j)=>{
          if(opts[j] === q.correct) b.classList.add('correct');
        });
      }
      document.getElementById('nextBtn').classList.add('show');
    });
  });

  document.getElementById('nextBtn').addEventListener('click', ()=>{
    current++;
    if(current < questions.length){
      renderQuestion();
    } else {
      showResults();
    }
  });
}

function showResults(){
  document.getElementById('fill').style.width = '100%';
  const card = document.getElementById('card');
  const pct = Math.round((score/questions.length)*100);
  let msg;
  if(pct === 100) msg = "Perfect score! You're a math star.";
  else if(pct >= 80) msg = "Great work — you really know your stuff.";
  else if(pct >= 50) msg = "Good effort — a bit more practice and you'll have it down.";
  else msg = "Keep practicing — try again to build your confidence.";

  card.innerHTML = `
    <div class="result">
      <div class="qnum">Quiz complete</div>
      <div class="big">${score} / ${questions.length}</div>
      <p>${msg}</p>
      <button class="restart" id="restartBtn">Try again</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
}

function startQuiz(){
  order = shuffle(questions.map((_,i)=>i));
  current = 0;
  score = 0;
  renderQuestion();
}

startQuiz();
</script>
</body>
</html>

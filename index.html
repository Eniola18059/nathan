<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maths Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,#e0f2fe,#fef9c3);min-height:100vh;color:#1e293b;display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:680px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
h1{margin:0 0 6px;font-size:1.7rem;color:#0369a1}
.sub{color:#475569;margin-bottom:18px}
.btn{background:#0ea5e9;color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:1.05rem;font-weight:600;cursor:pointer}
.btn:hover{background:#0284c7}
.btn.alt{background:#f59e0b}.btn.alt:hover{background:#d97706}
.top{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px;color:#0369a1}
.bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:18px}
.bar>div{height:100%;background:#22c55e;transition:width .3s}
.q{font-size:1.5rem;line-height:1.5;margin-bottom:18px;font-weight:700;text-align:center}
.opt{display:block;width:100%;text-align:left;background:#f1f5f9;border:2px solid #e2e8f0;border-radius:12px;padding:12px 16px;margin-bottom:10px;font-size:1.15rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:#0ea5e9;background:#e0f2fe}
.opt.right{background:#dcfce7;border-color:#22c55e}
.opt.wrong{background:#fee2e2;border-color:#ef4444}
.fb{margin:12px 0;padding:12px 14px;border-radius:12px;background:#fef9c3;display:none}
.big{font-size:3rem;text-align:center}
.score{font-size:2.2rem;text-align:center;font-weight:700;color:#0369a1}
.rev{max-height:300px;overflow:auto;margin-top:14px;font-size:.95rem}
.rev div{padding:8px 0;border-bottom:1px solid #e2e8f0}
.center{text-align:center}
</style>
</head>
<body>
<div class="app"><div class="card" id="c"></div></div>
<script>
// [question, correct answer, [3 wrong answers], explanation]
const Q=[
["245 + 128 = ?","373",["363","383","117"],"245 + 128 = 373"],
["512 − 187 = ?","325",["335","699","425"],"512 − 187 = 325"],
["6 × 8 = ?","48",["14","42","56"],"6 × 8 = 48"],
["36 ÷ 4 = ?","9",["8","32","12"],"4 × 9 = 36, so 36 ÷ 4 = 9"],
["7 × 9 = ?","63",["54","56","16"],"7 × 9 = 63"],
["150 − 45 = ?","105",["195","115","95"],"150 − 45 = 105"],
["28 − 15 = ?","13",["43","12","14"],"28 − 15 = 13"],
["72 ÷ 8 = ?","9",["8","64","10"],"8 × 9 = 72, so 72 ÷ 8 = 9"],
["45 + 38 = ?","83",["73","93","7"],"45 + 38 = 83"],
["5 × 20 = ?","100",["25","80","120"],"5 × 2 = 10, so 5 × 20 = 100"],
["3 × 12 = ?","36",["15","24","39"],"3 × 10 = 30 and 3 × 2 = 6, so 30 + 6 = 36"],
["64 ÷ 8 = ?","8",["7","9","56"],"8 × 8 = 64, so 64 ÷ 8 = 8"],
["346 + 289 = ?","635",["625","545","735"],"346 + 289 = 635"],
["600 − 275 = ?","325",["425","375","875"],"600 − 275 = 325"],
["15 × 6 = ?","90",["21","80","75"],"10 × 6 = 60 and 5 × 6 = 30, so 60 + 30 = 90"],
["5 × 7 = ?","35",["12","30","42"],"5 × 7 = 35"],
["48 ÷ 6 = ?","8",["7","9","42"],"6 × 8 = 48, so 48 ÷ 6 = 8"],
["8 × 25 = ?","200",["33","160","225"],"8 × 25 = 200"],
["120 + 85 = ?","205",["195","215","35"],"120 + 85 = 205"],
["1000 − 450 = ?","550",["650","450","560"],"1000 − 450 = 550"],
["4 × 12 = ?","48",["16","36","44"],"4 × 12 = 48"],
["9 × 9 = ?","81",["72","18","90"],"9 × 9 = 81"],
["56 ÷ 7 = ?","8",["7","9","49"],"7 × 8 = 56, so 56 ÷ 7 = 8"],
["300 + 475 = ?","775",["675","765","875"],"300 + 475 = 775"],
["What is half of 18?","9",["36","8","6"],"Half of 18 is 18 ÷ 2 = 9"],
["What is one quarter (1/4) of 20?","5",["4","10","15"],"20 ÷ 4 = 5"],
["Which fraction is the greatest?","3/4",["1/4","2/4","1/2"],"All the parts are the same size, and 3 out of 4 is the most"],
["What is the value of the digit 7 in 372?","70",["7","700","17"],"7 is in the tens place, so it is worth 70"],
["What is the value of the digit 5 in 5,284?","5,000",["500","50","5"],"5 is in the thousands place, so it is worth 5,000"],
["Round 76 to the nearest ten.","80",["70","76","90"],"6 is 5 or more, so round up to 80"],
["Round 349 to the nearest hundred.","300",["400","350","340"],"4 tens is less than 5, so round down to 300"],
["Which number is the greatest?","4,502",["4,052","4,205","4,025"],"All have 4 thousands. 4,502 has 5 hundreds, the most"],
["7 × ? = 42","6",["5","7","35"],"7 × 6 = 42"],
["? ÷ 5 = 6","30",["11","25","35"],"5 × 6 = 30, so 30 ÷ 5 = 6"],
["18 + ? = 31","13",["12","14","49"],"31 − 18 = 13"],
["? − 24 = 50","74",["26","64","84"],"50 + 24 = 74"],
["Which of these is an even number?","148",["147","149","151"],"Even numbers end in 0, 2, 4, 6 or 8"],
["What comes next? 5, 10, 15, 20, ?","25",["30","24","35"],"The pattern adds 5 each time, so 20 + 5 = 25"],
["What comes next? 100, 90, 80, 70, ?","60",["50","65","75"],"The pattern subtracts 10 each time, so 70 − 10 = 60"],
["90 minutes = ?","1 hour 30 minutes",["1 hour 10 minutes","9 hours","2 hours"],"60 minutes = 1 hour, so 90 minutes = 1 hour 30 minutes"],
["How many centimetres (cm) are in 3 metres (m)?","300 cm",["30 cm","3000 cm","33 cm"],"1 m = 100 cm, so 3 m = 300 cm"],
["How many millilitres (ml) are in 2 litres?","2000 ml",["200 ml","20 ml","2200 ml"],"1 litre = 1000 ml, so 2 litres = 2000 ml"],
["How many minutes are in 2 hours?","120",["100","200","60"],"60 + 60 = 120"],
["What is the perimeter of a rectangle that is 9 m long and 5 m wide?","28 m",["14 m","45 m","24 m"],"9 + 5 + 9 + 5 = 28"],
["What is the perimeter of a square with sides of 6 cm?","24 cm",["12 cm","36 cm","18 cm"],"4 × 6 = 24"],
["3 × 5 + 4 = ?","19",["27","35","12"],"3 × 5 = 15, then 15 + 4 = 19"],
["2 × 8 − 6 = ?","10",["4","20","12"],"2 × 8 = 16, then 16 − 6 = 10"],
["0 × 9 = ?","0",["9","1","90"],"Anything times 0 is 0"],
["2 × 3 × 4 = ?","24",["9","14","12"],"2 × 3 = 6, then 6 × 4 = 24"],
["96 ÷ 4 = ?","24",["22","26","23"],"4 × 24 = 96, so 96 ÷ 4 = 24"]
];
const c=document.getElementById('c');
let list,i,score,answers,locked;
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
let best=null;try{best=localStorage.getItem('mq_best')}catch(e){}
function home(){
 c.innerHTML=`<div class="big">🧮</div><h1 class="center">Maths Quiz</h1>
 <p class="sub center">50 questions · pick the right answer · see the working after each one</p>
 ${best?`<p class="center">🏆 Best score: <b>${best}/50</b></p>`:''}
 <div class="center"><button class="btn" onclick="start()">Start Quiz</button></div>`;
}
function start(){
 list=shuffle(Q).map(q=>({q:q[0],a:q[1],o:shuffle([q[1],...q[2]]),e:q[3]}));
 i=0;score=0;answers=[];show();
}
function show(){
 const x=list[i];locked=false;
 c.innerHTML=`<div class="top"><span>Question ${i+1} of 50</span><span>⭐ ${score}</span></div>
 <div class="bar"><div style="width:${i/50*100}%"></div></div>
 <div class="q">${x.q}</div>
 ${x.o.map((o,k)=>`<button class="opt" onclick="pick(${k})">${o}</button>`).join('')}
 <div class="fb" id="fb"></div>
 <div class="center"><button class="btn" id="nx" style="display:none" onclick="next()">${i==49?'See Results':'Next →'}</button></div>`;
}
function pick(k){
 if(locked)return;locked=true;
 const x=list[i],ok=x.o[k]===x.a;
 if(ok)score++;
 answers.push({q:x.q,a:x.a,ok});
 document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(x.o[n]===x.a)b.classList.add('right');else if(n===k)b.classList.add('wrong')});
 const f=document.getElementById('fb');f.style.display='block';
 f.innerHTML=(ok?'🎉 <b>Correct!</b> ':'❌ <b>Not quite.</b> The answer is <b>'+x.a+'</b>. ')+'<br>'+x.e;
 document.getElementById('nx').style.display='inline-block';
}
function next(){i++;i<50?show():finish()}
function finish(){
 try{if(best===null||score>+best){best=score;localStorage.setItem('mq_best',score)}}catch(e){}
 const m=score>=45?'🏆 Maths superstar!':score>=35?'🌟 Great job!':score>=25?'👍 Good effort, keep practising!':'💪 Keep going, you will get better!';
 const wrong=answers.filter(a=>!a.ok);
 c.innerHTML=`<div class="big">🎊</div><div class="score">${score} / 50</div><p class="center"><b>${m}</b></p>
 ${wrong.length?`<p><b>Questions to review (${wrong.length}):</b></p><div class="rev">${wrong.map(w=>`<div>${w.q}<br><b>Answer: ${w.a}</b></div>`).join('')}</div>`:'<p class="center">Perfect score, nothing to review!</p>'}
 <div class="center" style="margin-top:16px"><button class="btn alt" onclick="start()">Play Again</button></div>`;
}
home();
</script>
</body>
</html>

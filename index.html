<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractions Mastery — A Course for Armstrong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F6FB;
    --paper-alt: #FFFFFF;
    --ink: #1B2A4A;
    --ink-soft: #57647F;
    --line: #DCE3F0;
    --line-strong: #B9C6E0;

    --accent: #3D6FE0;
    --accent-soft: rgba(61, 111, 224, 0.12);

    --c1: #3D6FE0;
    --c2: #0F9B8E;
    --c3: #E8A33D;
    --c4: #E2574C;
    --c5: #6C5CE7;
    --c6: #2A9D6F;
    --c7: #D9527A;
    --c8: #2F7FBF;
    --c9: #C77A1E;
    --c10: #7A5AF8;
    --cfinal: #1B2A4A;

    --success: #2F8F4E;
    --error: #C0503C;

    --radius: 16px;
    --shadow: 0 6px 20px rgba(27, 42, 74, 0.09);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #10182B;
      --paper-alt: #182240;
      --ink: #ECF0FB;
      --ink-soft: #A9B6D6;
      --line: #2A3658;
      --line-strong: #3C4C78;
      --accent-soft: rgba(120, 150, 240, 0.16);
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #10182B;
    --paper-alt: #182240;
    --ink: #ECF0FB;
    --ink-soft: #A9B6D6;
    --line: #2A3658;
    --line-strong: #3C4C78;
    --accent-soft: rgba(120, 150, 240, 0.16);
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .display { font-family: 'Sora', 'Trebuchet MS', sans-serif; font-weight: 700; line-height: 1.2; margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  p { line-height: 1.65; margin: 0 0 12px; }

  #app { max-width: 980px; margin: 0 auto; min-height: 100vh; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    background: var(--paper-alt); position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { font-size: 24px; }
  .brand-text { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16.5px; }
  .pill {
    font-weight: 700; font-size: 13px; color: var(--ink-soft);
    background: var(--accent-soft); border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 999px;
  }

  .layout { display: flex; gap: 0; align-items: flex-start; }

  .sidebar {
    width: 260px; min-width: 260px;
    padding: 20px 14px 40px;
    border-right: 1px solid var(--line);
    position: sticky; top: 65px;
    height: calc(100vh - 65px);
    overflow-y: auto;
  }
  @media (max-width: 800px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%; min-width: 0; height: auto; position: static;
      border-right: none; border-bottom: 1px solid var(--line);
      display: flex; overflow-x: auto; gap: 8px; padding: 14px 16px;
    }
    .sidebar .nav-item { min-width: 200px; }
  }

  .sidebar-heading { font-size: 12px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin: 6px 8px 10px; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px; border-radius: 10px;
    margin-bottom: 4px;
    border: 1.5px solid transparent;
    background: none;
    width: 100%; text-align: left;
    color: var(--ink);
  }
  .nav-item:hover { background: var(--accent-soft); }
  .nav-item.active { background: var(--paper-alt); border-color: var(--nav-color, var(--accent)); box-shadow: var(--shadow); }
  .nav-dot {
    width: 28px; height: 28px; min-width: 28px; border-radius: 8px;
    background: var(--nav-color, var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff;
  }
  .nav-dot.done { background: var(--success); }
  .nav-label { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  .nav-sub { font-size: 11px; color: var(--ink-soft); font-weight: 600; }

  .main { flex: 1; min-width: 0; padding: 28px 30px 70px; }
  @media (max-width: 640px) { .main { padding: 22px 16px 60px; } }

  /* -------- WELCOME -------- */

  .welcome-hero { padding: 10px 0 20px; }
  .welcome-hero .wave { font-size: 42px; margin-bottom: 8px; display: inline-block; }
  .welcome-hero h1 { font-size: 30px; max-width: 18ch; }
  .welcome-hero p { color: var(--ink-soft); font-size: 16px; max-width: 56ch; margin-top: 12px; }

  .chapter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 22px 0 26px; }
  @media (min-width: 640px) { .chapter-grid { grid-template-columns: repeat(3, 1fr); } }
  .chapter-card {
    background: var(--paper-alt); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; border-left: 5px solid var(--card-color);
  }
  .chapter-card .cc-num { font-size: 11.5px; font-weight: 800; color: var(--ink-soft); }
  .chapter-card .cc-title { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 14px; margin-top: 4px; line-height: 1.3; }

  /* -------- LESSON CONTENT -------- */

  .chapter-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .chapter-badge {
    width: 46px; height: 46px; min-width: 46px; border-radius: 12px;
    background: var(--stage-color); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px;
  }
  .chapter-head h2 { font-size: 22px; }
  .chapter-tag { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }

  .lesson-body { margin: 22px 0 10px; font-size: 15.5px; }
  .lesson-body h3 { font-size: 16.5px; margin: 22px 0 10px; color: var(--stage-color); }

  .def-box {
    background: var(--accent-soft);
    border-left: 4px solid var(--stage-color);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 14px 0;
    font-size: 15px;
  }
  .def-box .def-label { font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--stage-color); margin-bottom: 6px; display: block; }

  .visual-row { display: flex; flex-wrap: wrap; gap: 22px; align-items: center; margin: 18px 0; }
  .visual-item { text-align: center; }
  .visual-item .vi-label { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; margin-top: 8px; }

  .frac-pie {
    width: 92px; height: 92px; border-radius: 50%;
    background: conic-gradient(var(--clr) 0% var(--pct), var(--line-strong) var(--pct) 100%);
    border: 3px solid var(--paper-alt);
    box-shadow: 0 0 0 1.5px var(--line-strong);
  }

  .frac-bar-row { display: flex; gap: 3px; }
  .bar-seg {
    width: 30px; height: 40px; border-radius: 5px;
    background: var(--paper);
    border: 1.5px solid var(--line-strong);
  }
  .bar-seg.filled { background: var(--clr); border-color: var(--clr); }

  .frac-disp {
    display: inline-flex; flex-direction: column; align-items: center;
    line-height: 1.15; vertical-align: middle; font-weight: 700; margin: 0 3px;
  }
  .frac-disp .fnum { border-bottom: 2px solid currentColor; padding: 0 5px 2px; }
  .frac-disp .fden { padding: 2px 5px 0; }
  .frac-inline { font-size: 1em; }

  .example-box {
    background: var(--paper-alt);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin: 16px 0;
    box-shadow: var(--shadow);
  }
  .example-box .ex-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 14.5px; margin-bottom: 10px; color: var(--stage-color); }
  .example-box .ex-step { display: flex; gap: 10px; margin-bottom: 8px; font-size: 14.5px; align-items: flex-start; }
  .example-box .ex-step .es-num {
    width: 22px; height: 22px; min-width: 22px; border-radius: 50%;
    background: var(--stage-color); color: #fff; font-size: 11.5px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .example-box .ex-answer {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line-strong);
    font-weight: 700; font-size: 14.5px;
  }

  .vocab-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; }
  .vocab-chip { background: var(--paper-alt); border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }

  .practice-cta {
    background: var(--stage-color); color: #fff;
    border: none; border-radius: 12px; padding: 15px 22px;
    font-weight: 800; font-size: 16px; font-family: 'Sora', sans-serif;
    display: inline-flex; align-items: center; gap: 8px; margin-top: 12px;
  }
  .link-btn {
    background: none; border: none; color: var(--stage-color);
    font-weight: 700; font-size: 14.5px; text-decoration: underline; text-underline-offset: 3px;
    padding: 0;
  }

  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--stage-color); color: #fff; border: none; border-radius: 12px;
    padding: 14px 22px; font-weight: 800; font-size: 15.5px; font-family: 'Sora', sans-serif;
    box-shadow: var(--shadow);
  }
  .btn-secondary {
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; color: var(--ink); border: 1.5px solid var(--line-strong);
    border-radius: 12px; padding: 12px 20px; font-weight: 700; font-size: 14.5px;
  }

  /* -------- PRACTICE / QUIZ ENGINE -------- */

  .progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .progress-track { flex: 1; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--stage-color); border-radius: 999px; transition: width 0.25s ease; }
  .progress-label { font-size: 12.5px; font-weight: 800; color: var(--ink-soft); white-space: nowrap; }

  .question-card {
    background: var(--paper-alt); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px 20px;
  }
  .question-text { font-size: 17.5px; font-weight: 700; font-family: 'Sora', sans-serif; line-height: 1.45; margin-bottom: 18px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    text-align: left; background: var(--paper); border: 1.5px solid var(--line-strong);
    border-radius: 12px; padding: 13px 14px; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; gap: 10px; color: var(--ink);
  }
  .option .opt-letter {
    width: 26px; height: 26px; min-width: 26px; border-radius: 8px; background: var(--paper-alt);
    border: 1.5px solid var(--line-strong); display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 800;
  }
  .option:hover { border-color: var(--stage-color); }
  .option[disabled] { cursor: default; }
  .option.correct { background: rgba(47, 143, 78, 0.13); border-color: var(--success); }
  .option.correct .opt-letter { background: var(--success); border-color: var(--success); color: #fff; }
  .option.incorrect { background: rgba(192, 80, 60, 0.12); border-color: var(--error); animation: shake 0.35s ease; }
  .option.incorrect .opt-letter { background: var(--error); border-color: var(--error); color: #fff; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @media (prefers-reduced-motion: reduce) { .option.incorrect { animation: none; } }

  .explain-box {
    margin-top: 16px; padding: 14px 15px; border-radius: 12px; background: var(--paper);
    border: 1px dashed var(--line-strong); font-size: 14.5px; color: var(--ink-soft); line-height: 1.55;
  }
  .explain-box strong { color: var(--ink); }
  .next-row { margin-top: 18px; }

  .chapter-result {
    text-align: center; padding: 30px 10px 10px;
  }
  .result-stamp {
    width: 96px; height: 96px; border-radius: 50%; background: var(--stage-color);
    display: flex; align-items: center; justify-content: center; font-size: 38px; color: #fff;
    margin: 0 auto 16px; box-shadow: var(--shadow);
  }
  .result-title { font-size: 20px; font-family: 'Sora', sans-serif; font-weight: 700; margin-bottom: 6px; }
  .result-score { font-size: 14.5px; color: var(--ink-soft); font-weight: 700; margin-bottom: 22px; }

  .final-score-card {
    background: var(--paper-alt); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 26px 22px; text-align: center; margin-bottom: 24px;
  }
  .final-score-num { font-family: 'Sora', sans-serif; font-size: 50px; font-weight: 800; }
  .final-score-den { font-size: 18px; color: var(--ink-soft); font-weight: 700; }
  .final-score-pct {
    display: inline-block; margin-top: 10px; padding: 6px 14px; border-radius: 999px;
    font-weight: 800; font-size: 14px; background: var(--cfinal); color: #fff;
  }

  .review-item {
    background: var(--paper-alt); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 15px; margin-bottom: 10px;
  }
  .review-item .rq { font-weight: 700; font-size: 14.5px; margin-bottom: 6px; }
  .review-item .ra { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .review-item .ra b { color: var(--success); }
  .review-item .rtag { font-size: 11.5px; font-weight: 800; color: var(--ink-soft); margin-top: 8px; display: block; }

  .footnote { text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-top: 30px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {

  // ---------- HELPERS ----------

  function esc(str) { var d = document.createElement("div"); d.textContent = str; return d.innerHTML; }
  function letter(i) { return ["A", "B", "C", "D"][i]; }

  function fracDisp(num, den) {
    return '<span class="frac-disp"><span class="fnum">' + num + '</span><span class="fden">' + den + '</span></span>';
  }

  function fracPie(num, den, color) {
    var pct = (num / den * 100).toFixed(1);
    return '<div class="visual-item"><div class="frac-pie" style="--pct:' + pct + '%; --clr:' + color + '"></div>' +
      '<div class="vi-label">' + num + ' / ' + den + '</div></div>';
  }

  function fracBar(num, den, color) {
    var segs = "";
    for (var i = 0; i < den; i++) {
      segs += '<div class="bar-seg' + (i < num ? ' filled' : '') + '" style="--clr:' + color + '"></div>';
    }
    return '<div class="visual-item"><div class="frac-bar-row">' + segs + '</div><div class="vi-label">' + num + ' / ' + den + '</div></div>';
  }

  function defBox(label, html) {
    return '<div class="def-box"><span class="def-label">' + esc(label) + '</span>' + html + '</div>';
  }

  function exampleBox(title, steps, answer) {
    var stepsHtml = steps.map(function (s, i) {
      return '<div class="ex-step"><span class="es-num">' + (i + 1) + '</span><span>' + s + '</span></div>';
    }).join("");
    return '<div class="example-box"><div class="ex-title">' + esc(title) + '</div>' + stepsHtml +
      '<div class="ex-answer">Answer: ' + answer + '</div></div>';
  }

  function vocabList(words) {
    return '<div class="vocab-list">' + words.map(function (w) { return '<span class="vocab-chip">' + esc(w) + '</span>'; }).join("") + '</div>';
  }

  // ---------- COURSE DATA ----------

  var CHAPTERS = [
    {
      key: "basics", num: 1, title: "What Is a Fraction?", color: "var(--c1)",
      lesson: function () {
        return defBox("Definition",
          "<p style='margin:0'>A <strong>fraction</strong> shows a part of a whole that has been divided into equal parts. It is written as " + fracDisp("numerator", "denominator") + ", where the <strong>numerator</strong> (top number) tells you how many equal parts you have, and the <strong>denominator</strong> (bottom number) tells you how many equal parts the whole is divided into.</p>") +
          vocabList(["Numerator", "Denominator", "Whole", "Equal parts"]) +
          '<h3>Seeing it visually</h3>' +
          '<p>Here are three fractions shown as both a pie and a bar. The colored part is the fraction; the rest is what\'s left of the whole.</p>' +
          '<div class="visual-row">' + fracPie(1, 2, "var(--c1)") + fracBar(1, 2, "var(--c1)") + '</div>' +
          '<div class="visual-row">' + fracPie(3, 4, "var(--c1)") + fracBar(3, 4, "var(--c1)") + '</div>' +
          '<div class="visual-row">' + fracPie(2, 3, "var(--c1)") + fracBar(2, 3, "var(--c1)") + '</div>' +
          '<h3>Worked example</h3>' +
          exampleBox("A pizza is cut into 8 equal slices. You eat 3 slices. What fraction of the pizza did you eat?", [
            "The whole pizza is divided into 8 equal slices, so the denominator is 8.",
            "You ate 3 of those slices, so the numerator is 3."
          ], fracDisp(3, 8) + " of the pizza");
      },
      practice: [
        { q: "In the fraction 5/8, what is the denominator?", opts: ["5", "8", "3", "13"], correct: 1, explain: "The denominator is the bottom number, telling you how many equal parts the whole is split into." },
        { q: "A cake is cut into 6 equal pieces. Ese eats 2 pieces. What fraction of the cake did Ese eat?", opts: ["2/6", "6/2", "4/6", "2/4"], correct: 0, explain: "2 pieces eaten out of 6 equal pieces total is written as 2/6." },
        { q: "Which of these represents \"3 out of 5 equal parts\"?", opts: ["5/3", "3/5", "3/3", "5/5"], correct: 1, explain: "\"3 out of 5\" means numerator 3, denominator 5, so 3/5." },
        { q: "In the fraction 7/9, what is the numerator?", opts: ["9", "7", "2", "16"], correct: 1, explain: "The numerator is the top number — here, 7." },
        { q: "A fraction always represents ___.", opts: ["A whole number", "A part of a whole divided into equal parts", "Only numbers bigger than 1", "A type of decimal"], correct: 1, explain: "Fractions describe part of a whole that's been split into equal parts." }
      ]
    },
    {
      key: "types", num: 2, title: "Proper, Improper & Mixed Numbers", color: "var(--c2)",
      lesson: function () {
        return defBox("Three types of fractions",
          "<p style='margin:0 0 8px'><strong>Proper fraction:</strong> numerator is smaller than the denominator, so the value is less than 1. Example: " + fracDisp(3, 4) + "</p>" +
          "<p style='margin:0 0 8px'><strong>Improper fraction:</strong> numerator is equal to or larger than the denominator, so the value is 1 or more. Example: " + fracDisp(7, 4) + "</p>" +
          "<p style='margin:0'><strong>Mixed number:</strong> a whole number written together with a proper fraction. Example: 1 " + fracDisp(3, 4) + "</p>") +
          '<div class="visual-row">' + fracPie(3, 4, "var(--c2)") + fracPie(7, 4 > 4 ? 4 : 4, "var(--c2)") + '</div>' +
          '<h3>Converting an improper fraction to a mixed number</h3>' +
          '<p>Divide the numerator by the denominator. The whole-number answer becomes the whole number part; the remainder becomes the new numerator, kept over the same denominator.</p>' +
          exampleBox("Convert 7/4 to a mixed number.", [
            "Divide: 7 ÷ 4 = 1, with a remainder of 3.",
            "The whole number part is 1.",
            "The remainder, 3, becomes the new numerator, kept over the same denominator, 4."
          ], "1 " + fracDisp(3, 4)) +
          '<h3>Converting a mixed number to an improper fraction</h3>' +
          '<p>Multiply the whole number by the denominator, then add the numerator. Keep the same denominator.</p>' +
          exampleBox("Convert 2 1/3 to an improper fraction.", [
            "Multiply the whole number by the denominator: 2 × 3 = 6.",
            "Add the numerator: 6 + 1 = 7.",
            "Keep the same denominator, 3."
          ], fracDisp(7, 3));
      },
      practice: [
        { q: "Which of these is a proper fraction?", opts: ["5/4", "3/3", "2/7", "9/8"], correct: 2, explain: "2/7 has a numerator smaller than its denominator, so it's a proper fraction (less than 1)." },
        { q: "Which of these is an improper fraction?", opts: ["3/5", "2/9", "11/4", "4/9"], correct: 2, explain: "11/4 has a numerator larger than its denominator, so it's improper (worth more than 1)." },
        { q: "Convert 9/4 to a mixed number.", opts: ["2 1/4", "1 2/4", "2 1/2", "4 1/9"], correct: 0, explain: "9 ÷ 4 = 2 remainder 1, so it's 2 1/4." },
        { q: "Convert 3 2/5 to an improper fraction.", opts: ["17/5", "15/5", "11/5", "13/5"], correct: 0, explain: "3 × 5 = 15, plus 2 = 17, kept over 5, gives 17/5." },
        { q: "Which mixed number equals 13/5?", opts: ["2 3/5", "3 2/5", "2 2/5", "1 3/5"], correct: 0, explain: "13 ÷ 5 = 2 remainder 3, so it's 2 3/5." },
        { q: "What type of fraction has a numerator smaller than its denominator?", opts: ["Improper", "Proper", "Mixed", "Equivalent"], correct: 1, explain: "That describes a proper fraction — its value is less than 1." }
      ]
    },
    {
      key: "equivalent", num: 3, title: "Equivalent Fractions & Simplifying", color: "var(--c3)",
      lesson: function () {
        return defBox("Equivalent fractions",
          "<p style='margin:0'>Equivalent fractions look different but represent the exact same value. You can create one by multiplying — or find a simpler one by dividing — the numerator and denominator by the <strong>same number</strong>.</p>") +
          '<div class="visual-row">' + fracPie(1, 2, "var(--c3)") + fracPie(2, 4, "var(--c3)") + fracPie(3, 6, "var(--c3)") + '</div>' +

    answered: false,
    quizResults: [], // for current quiz run
    completed: {} // key -> {correct, total}
  };

  // ---------- SIDEBAR ----------

  function renderSidebar() {
    var items = CHAPTERS.map(function (c) {
      var done = state.completed[c.key];
      var isActive = state.chapterKey === c.key && state.view !== "welcome" && state.view !== "final-quiz" && state.view !== "final-result";
      return '<button class="nav-item' + (isActive ? ' active' : '') + '" data-nav="chapter:' + c.key + '" style="--nav-color:' + c.color + '">' +
        '<span class="nav-dot' + (done ? ' done' : '') + '" style="' + (done ? '' : '--stage-color-unused:1') + '">' + (done ? "✓" : c.num) + '</span>' +
        '<span><span class="nav-label">' + esc(c.title) + '</span><br><span class="nav-sub">' + (done ? done.correct + "/" + done.total + " correct" : "Not started") + '</span></span>' +
        '</button>';
    }).join("");

    var allDone = CHAPTERS.every(function (c) { return state.completed[c.key]; });
    var finalDone = state.completed["final"];
    var finalActive = state.view === "final-quiz" || state.view === "final-result";

    return '<div class="sidebar">' +
      '<div class="sidebar-heading">Chapters</div>' +
      items +
      '<div class="sidebar-heading" style="margin-top:16px;">Wrap-up</div>' +
      '<button class="nav-item' + (finalActive ? ' active' : '') + '" data-nav="final" style="--nav-color:var(--cfinal)">' +
      '<span class="nav-dot' + (finalDone ? ' done' : '') + '">' + (finalDone ? "✓" : "★") + '</span>' +
      '<span><span class="nav-label">Final Review</span><br><span class="nav-sub">' + (finalDone ? finalDone.correct + "/" + finalDone.total + " correct" : (allDone ? "Ready" : "Finish all chapters first")) + '</span></span>' +
      '</button>' +
      '</div>';
  }

  function attachSidebarEvents() {
    document.querySelectorAll("[data-nav]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var nav = btn.getAttribute("data-nav");
        if (nav === "final") {
          goToFinal();
        } else {
          var key = nav.split(":")[1];
          goToChapterLesson(key);
        }
      });
    });
  }

  // ---------- TOPBAR ----------

  function topbarHtml() {
    var doneCount = Object.keys(state.completed).filter(function (k) { return k !== "final"; }).length;
    return '<div class="topbar">' +
      '<div class="brand"><span class="brand-mark">➗</span><span class="brand-text">Fractions Mastery — Armstrong\'s Course</span></div>' +
      '<span class="pill">' + doneCount + ' / ' + CHAPTERS.length + ' chapters done</span>' +
      '</div>';
  }

  // ---------- RENDER: WELCOME ----------

  function renderWelcome() {
    var cards = CHAPTERS.map(function (c) {
      return '<div class="chapter-card" style="--card-color:' + c.color + '">' +
        '<div class="cc-num">Chapter ' + c.num + '</div>' +
        '<div class="cc-title">' + esc(c.title) + '</div>' +
        '</div>';
    }).join("");

    document.getElementById("app").innerHTML =
      topbarHtml() +
      '<div class="layout">' + renderSidebar() +
      '<div class="main">' +
        '<div class="welcome-hero">' +
          '<span class="wave">👋</span>' +
          '<h1>Welcome, Armstrong — let\'s master fractions</h1>' +
          '<p>This course walks through fractions from the ground up: what they are, how to compare and simplify them, and how to add, subtract, multiply, and divide them — finishing with real-world problems and decimals and percentages. Each chapter has a clear explanation with visuals and worked examples, followed by a short practice set with instant feedback. Work through them in order, and by the final review, nothing here should feel unfamiliar.</p>' +
        '</div>' +
        '<div class="chapter-grid">' + cards + '</div>' +
        '<button class="btn-primary" id="start-btn">Start Chapter 1</button>' +
      '</div></div>';

    attachSidebarEvents();
    document.getElementById("start-btn").addEventListener("click", function () { goToChapterLesson(CHAPTERS[0].key); });
    window.scrollTo(0, 0);
  }

  // ---------- RENDER: CHAPTER LESSON ----------

  function goToChapterLesson(key) {
    state.chapterKey = key;
    state.view = "chapter-lesson";
    renderChapterLesson();
  }

  function renderChapterLesson() {
    var c = chapterByKey(state.chapterKey);
    document.getElementById("app").innerHTML =
      topbarHtml() +
      '<div class="layout">' + renderSidebar() +
      '<div class="main">' +
        '<div class="chapter-head">' +
          '<div class="chapter-badge" style="--stage-color:' + c.color + '">' + c.num + '</div>' +
          '<div><h2>' + esc(c.title) + '</h2><div class="chapter-tag">Chapter ' + c.num + ' of ' + CHAPTERS.length + '</div></div>' +
        '</div>' +
        '<div class="lesson-body" style="--stage-color:' + c.color + '">' + c.lesson() + '</div>' +
        '<button class="practice-cta" id="practice-btn" style="--stage-color:' + c.color + '">Start practice (' + c.practice.length + ' questions)</button>' +
      '</div></div>';

    attachSidebarEvents();
    document.getElementById("practice-btn").addEventListener("click", function () {
      state.qIndex = 0;
      state.quizResults = [];
      state.view = "chapter-quiz";
      renderQuizQuestion();
    });
    window.scrollTo(0, 0);
  }

  // ---------- SHARED QUIZ ENGINE ----------

  function currentQuizSet() {
    if (state.view === "final-quiz" || state.view === "final-result") return FINAL_REVIEW;
    return chapterByKey(state.chapterKey).practice;
  }

  function currentColor() {
    if (state.view === "final-quiz" || state.view === "final-result") return "var(--cfinal)";
    return chapterByKey(state.chapterKey).color;
  }

  function renderQuizQuestion() {
    var set = currentQuizSet();
    var q = set[state.qIndex];
    var color = currentColor();
    state.answered = false;

    var optionsHtml = q.opts.map(function (opt, idx) {
      return '<button class="option" data-idx="' + idx + '">' +
        '<span class="opt-letter">' + letter(idx) + '</span><span>' + esc(opt) + '</span>' +
        '</button>';
    }).join("");

    var titleLabel = (state.view === "final-quiz") ? "Final Review" : chapterByKey(state.chapterKey).title;

    document.getElementById("app").innerHTML =
      topbarHtml() +
      '<div class="layout">' + renderSidebar() +
      '<div class="main">' +
        '<div class="chapter-head"><div><h2 style="font-size:18px;">' + esc(titleLabel) + ' — Practice</h2></div></div>' +
        '<div class="progress-row" style="--stage-color:' + color + '">' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + (state.qIndex / set.length * 100) + '%"></div></div>' +
          '<span class="progress-label">Q' + (state.qIndex + 1) + ' / ' + set.length + '</span>' +
        '</div>' +
        '<div class="question-card" style="--stage-color:' + color + '">' +
          '<div class="question-text">' + esc(q.q) + '</div>' +
          '<div class="options" id="options-wrap">' + optionsHtml + '</div>' +
          '<div id="explain-slot"></div>' +
          '<div class="next-row" id="next-slot"></div>' +
        '</div>' +
      '</div></div>';

    attachSidebarEvents();

    document.querySelectorAll("#options-wrap .option").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (state.answered) return;
        handleAnswer(parseInt(btn.getAttribute("data-idx"), 10));
      });
    });
    window.scrollTo(0, 0);
  }

  function handleAnswer(idx) {
    var set = currentQuizSet();
    var q = set[state.qIndex];
    state.answered = true;
    var isCorrect = idx === q.correct;
    state.quizResults.push({ qIndex: state.qIndex, correct: isCorrect });

    document.querySelectorAll("#options-wrap .option").forEach(function (btn, i) {
      btn.setAttribute("disabled", "true");
      if (i === q.correct) btn.classList.add("correct");
      if (i === idx && !isCorrect) btn.classList.add("incorrect");
    });

    document.getElementById("explain-slot").innerHTML =
      '<div class="explain-box"><strong>' + (isCorrect ? "That's right. " : "Not quite. ") + '</strong>' + esc(q.explain) + '</div>';

    var isLast = state.qIndex === set.length - 1;
    document.getElementById("next-slot").innerHTML =
      '<button class="btn-primary" id="next-btn" style="--stage-color:' + currentColor() + '">' + (isLast ? "See results" : "Next question") + '</button>';

    document.getElementById("next-btn").addEventListener("click", function () {
      if (isLast) {
        finishQuiz();
      } else {
        state.qIndex += 1;
        renderQuizQuestion();
      }
    });
  }

  function finishQuiz() {
    var set = currentQuizSet();
    var correctCount = state.quizResults.filter(function (r) { return r.correct; }).length;
    if (state.view === "final-quiz") {
      state.completed["final"] = { correct: correctCount, total: set.length };
      state.view = "final-result";
      renderFinalResult();
    } else {
      state.completed[state.chapterKey] = { correct: correctCount, total: set.length };
      state.view = "chapter-result";
      renderChapterResult();
    }
  }

  function renderChapterResult() {
    var c = chapterByKey(state.chapterKey);
    var res = state.completed[state.chapterKey];
    var idx = CHAPTERS.findIndex(function (ch) { return ch.key === c.key; });
    var isLastChapter = idx === CHAPTERS.length - 1;
    var allDone = CHAPTERS.every(function (ch) { return state.completed[ch.key]; });

    var message;
    if (res.correct === res.total) message = "Perfect score! This chapter is fully understood.";
    else if (res.correct >= res.total - 1) message = "Excellent work — almost every question landed.";
    else if (res.correct >= Math.ceil(res.total * 0.6)) message = "Good progress. Reviewing the lesson once more would help lock it in.";
    else message = "This one needs another read-through — go back over the lesson before moving on.";

    document.getElementById("app").innerHTML =
      topbarHtml() +
      '<div class="layout">' + renderSidebar() +
      '<div class="main">' +
        '<div class="chapter-result">' +
          '<div class="result-stamp" style="--stage-color:' + c.color + '">' + res.correct + '/' + res.total + '</div>' +
          '<div class="result-title">' + esc(c.title) + ' complete</div>' +
          '<div class="result-score">' + message + '</div>' +
          '<div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">' +
            '<button class="btn-secondary" id="review-lesson-btn">Review this lesson again</button>' +
            (isLastChapter ?
              (allDone ? '<button class="btn-primary" id="next-action-btn" style="--stage-color:' + c.color + '">Go to the Final Review</button>' : '<span></span>') :
              '<button class="btn-primary" id="next-action-btn" style="--stage-color:' + c.color + '">Continue to next chapter</button>') +
          '</div>' +
        '</div>' +
      '</div></div>';

    attachSidebarEvents();
    document.getElementById("review-lesson-btn").addEventListener("click", function () { goToChapterLesson(c.key); });
    var nextBtn = document.getElementById("next-action-btn");
    if (nextBtn) {
      nextBtn.addEventListener("click", function () {
        if (isLastChapter) {
          goToFinal();
        } else {
          goToChapterLesson(CHAPTERS[idx + 1].key);
        }
      });
    }
    window.scrollTo(0, 0);
  }

  // ---------- FINAL REVIEW ----------

  function goToFinal() {
    var allDone = CHAPTERS.every(function (c) { return state.completed[c.key]; });
    if (!allDone) {
      alert("Finish all 10 chapters first, then the Final Review will pull everything together.");
      return;
    }
    state.view = "final-quiz";
    state.qIndex = 0;
    state.quizResults = [];
    renderQuizQuestion();
  }

  var finalReviewOpen = false;

  function renderFinalResult() {
    var res = state.completed["final"];
    var pct = Math.round((res.correct / res.total) * 100);

    var missed = state.quizResults.filter(function (r) { return !r.correct; }).map(function (r) { return FINAL_REVIEW[r.qIndex]; });

    var reviewHtml = "";
    if (missed.length === 0) {
      reviewHtml = '<p style="text-align:center; color:var(--ink-soft);">No missed questions — every answer was correct. Fractions: fully mastered.</p>';
    } else {
      reviewHtml = missed.map(function (m) {
        var ch = chapterByKey(m.chapter);
        return '<div class="review-item">' +
          '<div class="rq">' + esc(m.q) + '</div>' +
          '<div class="ra">Correct answer: <b>' + esc(m.opts[m.correct]) + '</b> — ' + esc(m.explain) + '</div>' +
          '<span class="rtag">From: ' + esc(ch.title) + ' — <button class="link-btn" data-review-chapter="' + ch.key + '">review this chapter</button></span>' +
          '</div>';
      }).join("");
    }

    var certificateReady = res.correct === res.total;

    document.getElementById("app").innerHTML =
      topbarHtml() +
      '<div class="layout">' + renderSidebar() +
      '<div class="main">' +
        '<div class="welcome-hero" style="padding-bottom:6px;">' +
          '<h1 style="font-size:26px;">Armstrong\'s Final Review is complete</h1>' +
        '</div>' +
        '<div class="final-score-card">' +
          '<span class="final-score-num">' + res.correct + '</span><span class="final-score-den"> / ' + res.total + '</span>' +
          '<div><span class="final-score-pct">' + pct + '% correct</span></div>' +
          (certificateReady ? '<p style="margin-top:16px; color:var(--ink-soft);">🏆 Every question answered correctly — fractions are fully mastered, no lingering questions left.</p>' : '<p style="margin-top:16px; color:var(--ink-soft);">Review the missed questions below, then revisit the linked chapters until everything feels solid.</p>') +
        '</div>' +
        '<div class="review-toggle" style="text-align:center; margin-bottom:16px;"><button class="link-btn" id="toggle-review-btn">' + (finalReviewOpen ? "Hide the review" : "Show the review (" + missed.length + " missed)") + '</button></div>' +
        '<div id="review-slot">' + (finalReviewOpen ? reviewHtml : "") + '</div>' +
        '<button class="btn-secondary" id="restart-btn" style="margin-top:14px;">Retake the Final Review</button>' +
      '</div></div>';

    attachSidebarEvents();
    document.getElementById("toggle-review-btn").addEventListener("click", function () { finalReviewOpen = !finalReviewOpen; renderFinalResult(); });
    document.getElementById("restart-btn").addEventListener("click", function () { goToFinal(); });
    document.querySelectorAll("[data-review-chapter]").forEach(function (btn) {
      btn.addEventListener("click", function () { goToChapterLesson(btn.getAttribute("data-review-chapter")); });
    });
    window.scrollTo(0, 0);
  }

  renderWelcome();
})();
</script>
</body>
</html>

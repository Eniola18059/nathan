<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Problem Whiz – Grade 4</title>
<style>
:root{--bg:#eef3ff;--card:#fff;--ink:#1f2a44;--muted:#5a6684;--brand:#4f6df5;--brand2:#7c4dff;--ok:#1f9d63;--okbg:#e5f7ee;--bad:#d64545;--badbg:#fdeaea;--line:#dfe5f5}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:20px;padding:20px 22px;margin-bottom:18px}
header h1{margin:0 0 4px;font-size:1.5rem}
header p{margin:0;opacity:.9;font-size:.95rem}
.card{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 4px 16px rgba(31,42,68,.08)}
.hidden{display:none}
.start h2{margin-top:0}
.start p{color:var(--muted);font-size:1.05rem;line-height:1.7}
.btn{background:var(--brand);color:#fff;border:0;border-radius:14px;padding:14px 26px;font-size:1.05rem;font-weight:600;cursor:pointer}
.btn:hover{background:#3d5be0}.btn:active{transform:scale(.97)}
.top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);margin-bottom:8px;font-weight:600}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar>div{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));width:0;transition:width .3s}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px;background:#eceffd;color:var(--brand);margin-bottom:12px}
.q{font-size:1.35rem;font-weight:600;line-height:1.55;margin:0 0 20px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1.15rem;color:var(--ink);cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--brand);background:#f6f8ff}
.opt .l{flex:0 0 30px;height:30px;border-radius:50%;background:#eceffd;color:var(--brand);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:1.05rem;line-height:1.6}
.fb.ok{background:var(--okbg);color:#0f5a38}.fb.no{background:var(--badbg);color:#8a2424}
.next{margin-top:16px;text-align:right}
.result{text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--brand);margin:6px 0}
.stars{font-size:2rem;letter-spacing:6px}
.review{text-align:left;margin-top:22px}
.ri{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:.95rem}
.ri .a{color:var(--ok);font-weight:700}.ri .y{color:var(--bad);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧮 Word Problem Whiz</h1>
    <p>Grade 4 · Multiply and Divide · 50 Questions</p>
  </header>

  <div class="card start" id="start">
    <h2>Ready?</h2>
    <p>Read each problem. Pick the right answer.<br><b>Multiply</b> when you have equal groups.<br><b>Divide</b> when you share equally.</p>
    <button class="btn" id="startBtn">Start</button>
  </div>

  <div class="card hidden" id="quiz">
    <div class="top"><span id="count"></span><span id="scoreLive"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <span class="tag" id="sec"></span>
    <p class="q" id="q"></p>
    <div class="opts" id="opts"></div>
    <div id="fb"></div>
    <div class="next hidden" id="nextWrap"><button class="btn" id="nextBtn">Next →</button></div>
  </div>

  <div class="card result hidden" id="result">
    <div class="stars" id="stars"></div>
    <div class="score" id="finalScore"></div>
    <p id="msg"></p>
    <button class="btn" id="again">Try Again</button>
    <div class="review hidden" id="review"></div>
  </div>
</div>

<script>
// a = correct answer, w = wrong answers (common mistakes), e = short explanation
var Q=[
// ---------- HOTEL ----------
{s:"🏨 Hotel",q:"A hotel has 6 floors. Each floor has 10 rooms. How many rooms are there?",a:"60",w:["16","66","600"],e:"6 × 10 = 60"},
{s:"🏨 Hotel",q:"Each room has 2 beds. There are 20 rooms. How many beds are there?",a:"40",w:["22","10","400"],e:"20 × 2 = 40"},
{s:"🏨 Hotel",q:"24 guests share 6 rooms equally. How many guests are in each room?",a:"4",w:["18","30","144"],e:"24 ÷ 6 = 4"},
{s:"🏨 Hotel",q:"A room costs $100 for 1 night. How much does it cost for 3 nights?",a:"$300",w:["$103","$33","$3,000"],e:"100 × 3 = 300"},
{s:"🏨 Hotel",q:"A hotel has 18 suites on 6 floors. Each floor has the same number of suites. How many suites are on each floor?",a:"3",w:["12","24","108"],e:"18 ÷ 6 = 3"},
{s:"🏨 Hotel",q:"Each suite has 3 beds. How many beds are in 5 suites?",a:"15",w:["8","18","150"],e:"3 × 5 = 15"},
{s:"🏨 Hotel",q:"30 towels are shared equally by 5 rooms. How many towels does each room get?",a:"6",w:["25","35","150"],e:"30 ÷ 5 = 6"},
{s:"🏨 Hotel",q:"4 housekeepers each clean 8 rooms. How many rooms are cleaned in all?",a:"32",w:["12","4","48"],e:"4 × 8 = 32"},
{s:"🏨 Hotel",q:"7 guests each pay $20. How much money is that in all?",a:"$140",w:["$27","$13","$1,400"],e:"7 × 20 = 140"},
{s:"🏨 Hotel",q:"The hotel has 36 chairs. 4 chairs go at each table. How many tables are there?",a:"9",w:["32","40","144"],e:"36 ÷ 4 = 9"},

// ---------- PRINTING ----------
{s:"🖨️ Printing",q:"A company has 5 printing machines. Each machine costs $200. How much do all the machines cost?",a:"$1,000",w:["$205","$100","$10,000"],e:"5 × 200 = 1,000"},
{s:"🖨️ Printing",q:"A machine prints 10 pages in 1 minute. How many pages does it print in 5 minutes?",a:"50",w:["15","2","500"],e:"10 × 5 = 50"},
{s:"🖨️ Printing",q:"6 machines print 60 pages together. Each machine prints the same number. How many pages does each machine print?",a:"10",w:["54","66","360"],e:"60 ÷ 6 = 10"},
{s:"🖨️ Printing",q:"Each pack has 100 sheets of paper. How many sheets are in 4 packs?",a:"400",w:["104","25","40"],e:"100 × 4 = 400"},
{s:"🖨️ Printing",q:"There are 3 repair teams. Each team has 4 workers. How many workers are there?",a:"12",w:["7","34","1"],e:"3 × 4 = 12"},
{s:"🖨️ Printing",q:"20 customers are shared equally among 5 sales people. How many customers does each sales person get?",a:"4",w:["15","25","100"],e:"20 ÷ 5 = 4"},
{s:"🖨️ Printing",q:"A printer uses 2 ink cartridges every week. How many cartridges does it use in 6 weeks?",a:"12",w:["8","3","26"],e:"2 × 6 = 12"},
{s:"🖨️ Printing",q:"48 pages are put in piles of 6. How many piles are there?",a:"8",w:["42","54","288"],e:"48 ÷ 6 = 8"},
{s:"🖨️ Printing",q:"Each book has 9 pages. How many pages are in 7 books?",a:"63",w:["16","56","72"],e:"9 × 7 = 63"},
{s:"🖨️ Printing",q:"There are 3 orders. Each order has x pages. There are 30 pages in all, so 3 × x = 30. What is x?",a:"10",w:["27","33","90"],e:"30 ÷ 3 = 10"},

// ---------- CAR FACTORY ----------
{s:"🚗 Car Factory",q:"A factory has 8 assembly lines. Each line has 5 workers. How many workers are there?",a:"40",w:["13","45","400"],e:"8 × 5 = 40"},
{s:"🚗 Car Factory",q:"The factory makes 40 cars. 8 lines make the same number of cars. How many cars does each line make?",a:"5",w:["32","48","320"],e:"40 ÷ 8 = 5"},
{s:"🚗 Car Factory",q:"One line makes 6 cars in a day. How many cars does it make in 2 days?",a:"12",w:["8","3","24"],e:"6 × 2 = 12"},
{s:"🚗 Car Factory",q:"A worker earns $80 each day. How much does the worker earn in 5 days?",a:"$400",w:["$85","$16","$4,000"],e:"80 × 5 = 400"},
{s:"🚗 Car Factory",q:"A supervisor earns $30 each hour. How much does the supervisor earn in 4 hours?",a:"$120",w:["$34","$7","$1,200"],e:"30 × 4 = 120"},
{s:"🚗 Car Factory",q:"A line makes 12 cars in 6 hours at the same speed. How many cars does it make in 1 hour?",a:"2",w:["6","18","72"],e:"12 ÷ 6 = 2"},
{s:"🚗 Car Factory",q:"Each of the 8 lines has 2 supervisors. How many supervisors are there?",a:"16",w:["10","4","6"],e:"8 × 2 = 16"},
{s:"🚗 Car Factory",q:"36 workers are put into 4 equal groups. How many workers are in each group?",a:"9",w:["32","40","144"],e:"36 ÷ 4 = 9"},
{s:"🚗 Car Factory",q:"A truck carries 4 cars. How many cars can 7 trucks carry?",a:"28",w:["11","24","32"],e:"4 × 7 = 28"},
{s:"🚗 Car Factory",q:"8 lines make 48 cars. Each line makes x cars, so 8 × x = 48. What is x?",a:"6",w:["40","56","384"],e:"48 ÷ 8 = 6"},

// ---------- SCHOOL ----------
{s:"🏫 School",q:"A school has 12 classes. Each class has 10 students. How many students are there?",a:"120",w:["22","102","1,200"],e:"12 × 10 = 120"},
{s:"🏫 School",q:"30 students are shared equally into 5 groups. How many students are in each group?",a:"6",w:["25","35","150"],e:"30 ÷ 5 = 6"},
{s:"🏫 School",q:"Each class has 2 teachers. There are 12 classes. How many teachers are there?",a:"24",w:["14","6","36"],e:"12 × 2 = 24"},
{s:"🏫 School",q:"25 students go on a trip. There is 1 teacher for every 5 students. How many teachers go?",a:"5",w:["20","30","125"],e:"25 ÷ 5 = 5"},
{s:"🏫 School",q:"5 classes go on a trip. Each class has 20 students. How many students go?",a:"100",w:["25","15","1,000"],e:"5 × 20 = 100"},
{s:"🏫 School",q:"35 students sit in 7 equal rows. How many students are in each row?",a:"5",w:["28","42","245"],e:"35 ÷ 7 = 5"},
{s:"🏫 School",q:"Each student has 4 pencils. There are 9 students. How many pencils are there?",a:"36",w:["13","5","32"],e:"4 × 9 = 36"},
{s:"🏫 School",q:"18 books are shared equally on 3 shelves. How many books are on each shelf?",a:"6",w:["15","21","54"],e:"18 ÷ 3 = 6"},
{s:"🏫 School",q:"A school has 12 classes. 4 classes are outside. How many classes are inside?",a:"8",w:["16","48","3"],e:"12 − 4 = 8"},
{s:"🏫 School",q:"3 classes have 60 students in all. Each class has x students, so 3 × x = 60. What is x?",a:"20",w:["57","63","180"],e:"60 ÷ 3 = 20"},

// ---------- MIXED ----------
{s:"🧁 Bakery",q:"A baker makes 4 trays of muffins. Each tray has 6 muffins. How many muffins is that?",a:"24",w:["10","2","64"],e:"4 × 6 = 24"},
{s:"🧁 Bakery",q:"24 muffins are put in boxes of 6. How many boxes are needed?",a:"4",w:["18","30","144"],e:"24 ÷ 6 = 4"},
{s:"🌽 Farm",q:"A farmer plants 5 rows of corn. Each row has 8 plants. How many plants are there?",a:"40",w:["13","35","400"],e:"5 × 8 = 40"},
{s:"🌽 Farm",q:"A farmer has 20 eggs. He puts 4 eggs in each carton. How many cartons does he fill?",a:"5",w:["16","24","80"],e:"20 ÷ 4 = 5"},
{s:"🦁 Zoo",q:"A zoo ticket costs $5. 8 children go to the zoo. How much do the tickets cost?",a:"$40",w:["$13","$3","$45"],e:"5 × 8 = 40"},
{s:"🦁 Zoo",q:"27 monkeys sit in 3 trees. Each tree has the same number of monkeys. How many monkeys are in each tree?",a:"9",w:["24","30","81"],e:"27 ÷ 3 = 9"},
{s:"📚 Library",q:"A library has 4 shelves. Each shelf has 15 books. How many books are there?",a:"60",w:["19","11","600"],e:"4 × 15 = 60"},
{s:"🍎 Sharing",q:"17 apples are shared equally among 5 children. How many apples does each child get, and how many are left over?",a:"3 each, 2 left over",w:["3 each, 3 left over","4 each, 2 left over","2 each, 7 left over"],e:"17 ÷ 5 = 3 with 2 left over"},
{s:"🔮 Marbles",q:"Sam has 3 bags. Each bag has 10 marbles. How many marbles does Sam have?",a:"30",w:["13","7","300"],e:"3 × 10 = 30"},
{s:"✏️ Shop",q:"Mia buys 4 packs of pencils and gets 48 pencils. Each pack has x pencils, so 4 × x = 48. What is x?",a:"12",w:["44","52","192"],e:"48 ÷ 4 = 12"}
];

var $=function(id){return document.getElementById(id)};
var idx=0,score=0,missed=[],locked=false;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["start","quiz","result"].forEach(function(x){$(x).classList.toggle("hidden",x!==id)})}
function start(){idx=0;score=0;missed=[];show("quiz");render()}

function render(){
  var q=Q[idx];locked=false;
  $("count").textContent="Question "+(idx+1)+" of "+Q.length;
  $("scoreLive").textContent="⭐ "+score;
  $("prog").style.width=(idx/Q.length*100)+"%";
  $("sec").textContent=q.s;
  $("q").textContent=q.q;
  $("fb").innerHTML="";$("nextWrap").classList.add("hidden");
  $("nextBtn").textContent=idx===Q.length-1?"See Results →":"Next →";
  var box=$("opts");box.innerHTML="";
  shuffle([q.a].concat(q.w)).forEach(function(text,i){
    var b=document.createElement("button");b.className="opt";
    b.innerHTML='<span class="l">'+"ABCD"[i]+'</span><span></span>';
    b.lastChild.textContent=text;
    b.onclick=function(){pick(b,text)};
    box.appendChild(b);
  });
  window.scrollTo({top:0,behavior:"smooth"});
}

function pick(btn,text){
  if(locked)return;locked=true;
  var q=Q[idx],ok=text===q.a;
  Array.prototype.forEach.call($("opts").children,function(b){
    b.disabled=true;
    if(b.lastChild.textContent===q.a)b.classList.add("right");
  });
  if(ok){score++;$("scoreLive").textContent="⭐ "+score}
  else{btn.classList.add("wrong");missed.push({q:q,you:text})}
  $("fb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Correct! 🎉":"Not quite.")+'</b> '+q.e+'</div>';
  $("nextWrap").classList.remove("hidden");
}

function next(){idx++;if(idx>=Q.length)finish();else render()}

function finish(){
  show("result");
  var pct=score/Q.length;
  $("stars").textContent=pct>=.9?"⭐⭐⭐":pct>=.7?"⭐⭐":pct>=.5?"⭐":"💪";
  $("finalScore").textContent=score+" / "+Q.length;
  $("msg").textContent=pct>=.9?"Outstanding!":pct>=.7?"Great work! Look at the ones you missed.":pct>=.5?"Good try. Practise the ones you missed.":"Keep practising. You can do it!";
  var r=$("review");
  if(missed.length){
    r.classList.remove("hidden");
    r.innerHTML="<h3>Review ("+missed.length+")</h3>"+missed.map(function(m){
      return '<div class="ri"><div>'+esc(m.q.q)+'</div><div class="y">Your answer: '+esc(m.you)+'</div><div class="a">Correct answer: '+esc(m.q.a)+' ('+esc(m.q.e)+')</div></div>';
    }).join("");
  }else r.classList.add("hidden");
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

$("startBtn").onclick=start;$("nextBtn").onclick=next;$("again").onclick=start;
</script>
</body>
</html>

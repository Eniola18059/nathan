<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opposite Owl Quiz</title>
<style>
  :root{
    --bg1:#fff3d6; --bg2:#ffd9e8; --ink:#33265c; --purple:#7c5cff; --purple-d:#5a3fd6;
    --good:#2ecc71; --good-d:#1e9a52; --bad:#ff6b6b; --bad-d:#c94444; --sun:#ffb703; --sun-d:#c98a00;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    display:flex;align-items:center;justify-content:center;padding:14px;min-height:100vh;
  }
  .blob{position:fixed;border-radius:50%;opacity:.35;z-index:0;pointer-events:none}
  .b1{width:220px;height:220px;background:#a5d8ff;left:-60px;top:-50px}
  .b2{width:180px;height:180px;background:#b2f2bb;right:-40px;bottom:60px}
  .b3{width:120px;height:120px;background:#ffec99;left:10%;bottom:-40px}
  .wrap{position:relative;z-index:1;width:100%;max-width:560px}
  .card{background:#fff;border-radius:28px;padding:22px 20px;text-align:center;
    box-shadow:0 12px 0 rgba(90,63,214,.15),0 22px 46px rgba(0,0,0,.14)}
  h1{margin:0 0 6px;font-size:2.1rem;line-height:1.1}
  .sub{margin:0 0 16px;font-size:1.1rem;opacity:.8}
  .owl{font-size:5rem;line-height:1;margin:4px 0 8px;animation:bob 2.2s infinite ease-in-out}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
  button{font-family:inherit;border:0;cursor:pointer}
  .big{background:var(--sun);color:#3a2a00;font-size:1.7rem;font-weight:800;padding:14px 40px;border-radius:50px;
    box-shadow:0 7px 0 var(--sun-d);transition:transform .08s,box-shadow .08s}
  .big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sun-d)}
  .small{margin-top:14px;font-size:.95rem;opacity:.7}
  .example{background:#f4f0ff;border-radius:18px;padding:10px 14px;margin:0 0 16px;font-size:1.15rem;font-weight:700}

  .hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:800}
  .pill{background:#f1ecff;border-radius:50px;padding:6px 14px;white-space:nowrap}
  .bar{height:16px;background:#f1ecff;border-radius:50px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#74c0fc,#7c5cff);border-radius:50px;transition:width .4s}

  .ask{font-size:1.15rem;font-weight:700;opacity:.8;margin:0}
  .wordbox{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 4px}
  .word{font-size:3.4rem;font-weight:900;letter-spacing:1px;color:var(--purple-d)}
  .say{background:#f1ecff;width:46px;height:46px;border-radius:50%;font-size:1.4rem}
  .say:active{transform:scale(.92)}
  .hint{font-size:1.05rem;min-height:26px;opacity:.75;margin:0 0 4px}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .opt{background:var(--purple);color:#fff;font-size:1.9rem;font-weight:800;padding:18px 6px;border-radius:22px;
    box-shadow:0 7px 0 var(--purple-d);transition:transform .08s,box-shadow .08s,background .2s;word-break:break-word}
  .opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--purple-d)}
  .opt.right{background:var(--good);box-shadow:0 7px 0 var(--good-d)}
  .opt.wrong{background:var(--bad);box-shadow:0 7px 0 var(--bad-d);animation:shake .4s}
  .opt:disabled{cursor:default}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  .fb{min-height:40px;margin-top:12px;font-size:1.35rem;font-weight:800}
  .next{margin-top:6px;font-size:1.4rem;padding:10px 34px}

  .stars{font-size:2.8rem;margin:6px 0}
  .score{font-size:1.3rem;font-weight:800;margin:4px 0 12px}
  .missed{text-align:left;background:#fff6f6;border-radius:18px;padding:10px 16px;margin:0 0 16px;font-size:1.1rem}
  .missed h3{margin:0 0 6px;font-size:1.1rem}
  .missed div{padding:2px 0}
  .hidden{display:none!important}
  canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
  @media (max-width:380px){.word{font-size:2.7rem}.opt{font-size:1.6rem}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="confetti"></canvas>

<div class="wrap">

  <div class="card" id="start">
    <div class="owl">🦉</div>
    <h1>Opposite Owl Quiz</h1>
    <p class="sub">Opposites are words that mean the very different thing.</p>
    <div class="example">Hot ↔ Cold &nbsp;•&nbsp; Up ↔ Down</div>
    <button class="big" id="startBtn">▶ Start</button>
    <p class="small" id="best"></p>
  </div>

  <div class="card hidden" id="play">
    <div class="hud">
      <span class="pill" id="qNum">1 / 50</span>
      <span class="pill" id="scoreNow">⭐ 0</span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <p class="ask">What is the opposite of…</p>
    <div class="wordbox">
      <span class="word" id="word"></span>
      <button class="say" id="say" title="Hear the word">🔊</button>
    </div>
    <p class="hint" id="hint"></p>
    <div class="opts" id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="big next hidden" id="next">Next ➜</button>
  </div>

  <div class="card hidden" id="end">
    <div class="owl">🎉</div>
    <h1 id="endTitle">Great work!</h1>
    <div class="stars" id="endStars"></div>
    <div class="score" id="endScore"></div>
    <div class="missed hidden" id="missed"></div>
    <button class="big" id="again">↻ Play Again</button>
  </div>

</div>

<script>
(function(){
  // Each item: word, correct opposite, and three plausible wrong choices
  // (synonyms of the word, or related words that are NOT opposites).
  var BANK = [
    {w:'hot',    a:'cold',     x:['warm','sunny','spicy']},
    {w:'big',    a:'small',    x:['huge','tall','wide']},
    {w:'up',     a:'down',     x:['over','high','top']},
    {w:'happy',  a:'sad',      x:['glad','angry','sleepy']},
    {w:'day',    a:'night',    x:['morning','sun','noon']},
    {w:'fast',   a:'slow',     x:['quick','late','run']},
    {w:'open',   a:'shut',     x:['wide','start','free']},
    {w:'in',     a:'out',      x:['inside','on','at']},
    {w:'lost',   a:'found',    x:['gone','hidden','missing']},
    {w:'hard',   a:'soft',     x:['rough','heavy','solid']},
    {w:'wet',    a:'dry',      x:['cold','damp','rainy']},
    {w:'full',   a:'empty',    x:['heavy','half','big']},
    {w:'tall',   a:'short',    x:['long','big','high']},
    {w:'on',     a:'off',      x:['in','up','over']},
    {w:'yes',    a:'no',       x:['maybe','okay','yeah']},
    {w:'stop',   a:'start',    x:['wait','end','pause']},
    {w:'good',   a:'bad',      x:['great','nice','fine']},
    {w:'boy',    a:'girl',     x:['man','child','kid']},
    {w:'hello',  a:'goodbye',  x:['hi','please','sorry']},
    {w:'left',   a:'right',    x:['back','front','down']},
    {w:'front',  a:'back',     x:['side','top','middle']},
    {w:'top',    a:'bottom',   x:['side','middle','up']},
    {w:'dark',   a:'bright',   x:['dim','black','night']},
    {w:'heavy',  a:'light',    x:['big','strong','thick']},
    {w:'clean',  a:'dirty',    x:['neat','wet','shiny']},
    {w:'hungry', a:'full',     x:['thirsty','sleepy','angry']},
    {w:'awake',  a:'asleep',   x:['tired','alert','up']},
    {w:'laugh',  a:'cry',      x:['smile','giggle','shout']},
    {w:'love',   a:'hate',     x:['like','hug','kiss']},
    {w:'come',   a:'go',       x:['arrive','bring','run']},
    {w:'push',   a:'pull',     x:['shove','hit','move']},
    {w:'buy',    a:'sell',     x:['shop','pay','spend']},
    {w:'early',  a:'late',     x:['soon','quick','fast']},
    {w:'near',   a:'far',      x:['close','next','by']},
    {w:'sweet',  a:'sour',     x:['sugary','nice','soft']},
    {w:'thick',  a:'thin',     x:['fat','wide','heavy']},
    {w:'wide',   a:'narrow',   x:['big','long','open']},
    {w:'rich',   a:'poor',     x:['happy','fancy','lucky']},
    {w:'strong', a:'weak',     x:['big','tough','fast']},
    {w:'brave',  a:'scared',   x:['strong','bold','kind']},
    {w:'smooth', a:'rough',    x:['shiny','flat','slippery']},
    {w:'loud',   a:'quiet',    x:['noisy','big','fast']},
    {w:'deep',   a:'shallow',  x:['low','wet','dark']},
    {w:'same',   a:'different',x:['alike','equal','twin']},
    {w:'true',   a:'false',    x:['real','right','correct']},
    {w:'above',  a:'below',    x:['over','high','up']},
    {w:'first',  a:'last',     x:['early','one','top']},
    {w:'give',   a:'take',     x:['share','send','hand']},
    {w:'win',    a:'lose',     x:['play','score','race']},
    {w:'young',  a:'old',      x:['little','small','baby']}
  ];
  var HINTS = {left:'Think of directions ➡️', true:'Think: is it real or not?', first:'Think of a line or a race'};

  var $ = function(id){return document.getElementById(id)};
  function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
  function shuffle(arr){
    var a=arr.slice();
    for (var i=a.length-1;i>0;i--){var j=rand(0,i),t=a[i];a[i]=a[j];a[j]=t}
    return a;
  }
  function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
  function show(id){['start','play','end'].forEach(function(x){$(x).classList.toggle('hidden',x!==id)})}

  var order=[], idx=0, score=0, missed=[], answered=false;

  // ---- sounds ----
  var ac=null;
  function tone(f,d,t,delay){
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(delay||0);
      o.type=t||'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.22,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);
      o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d+.05);
    }catch(e){}
  }
  function yay(){tone(523,.14,'triangle',0);tone(659,.14,'triangle',.12);tone(784,.22,'triangle',.24)}
  function oops(){tone(210,.28,'square',0)}

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text); u.rate=.8; u.pitch=1.1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function showBest(){
    var b=store('opp50Best');
    $('best').textContent = b ? 'Best score: '+b+' / '+BANK.length+' ⭐' : '';
  }

  function begin(){
    order=shuffle(BANK.map(function(_,i){return i}));
    idx=0;score=0;missed=[];
    show('play');
    render();
  }

  function render(){
    answered=false;
    var q=BANK[order[idx]];
    $('qNum').textContent=(idx+1)+' / '+BANK.length;
    $('scoreNow').textContent='⭐ '+score;
    $('bar').style.width=(idx/BANK.length*100)+'%';
    $('word').textContent=q.w;
    $('hint').textContent=HINTS[q.w]||'';
    $('fb').textContent='';
    $('next').classList.add('hidden');
    var box=$('opts'); box.innerHTML='';
    shuffle([q.a].concat(q.x)).forEach(function(opt){
      var b=document.createElement('button');
      b.className='opt'; b.textContent=opt;
      b.addEventListener('click',function(){pick(b,opt,q)});
      box.appendChild(b);
    });
  }

  function pick(btn,val,q){
    if(answered) return;
    answered=true;
    var all=$('opts').children;
    Array.prototype.forEach.call(all,function(b){
      b.disabled=true;
      if(b.textContent===q.a) b.classList.add('right');
    });
    if(val===q.a){
      score++; yay();
      $('fb').textContent=['Great job! 🎉','You got it! 🌟','Super! 👏','Yes! 🦉'][rand(0,3)];
    } else {
      btn.classList.add('wrong'); oops();
      missed.push(q);
      $('fb').textContent='The opposite of "'+q.w+'" is "'+q.a+'".';
    }
    $('scoreNow').textContent='⭐ '+score;
    $('bar').style.width=((idx+1)/BANK.length*100)+'%';
    $('next').textContent = idx===BANK.length-1 ? 'See my score ➜' : 'Next ➜';
    $('next').classList.remove('hidden');
  }

  function next(){
    idx++;
    if(idx>=BANK.length) return finish();
    render();
  }

  function finish(){
    show('end');
    var n=BANK.length, pct=score/n;
    var r = pct>=.9?3 : pct>=.6?2 : 1;
    var s=''; for(var i=0;i<3;i++) s+= i<r?'⭐':'☆';
    $('endStars').textContent=s;
    $('endTitle').textContent = pct>=.9?'Wow! Opposite Champion!' : pct>=.6?'Great work!' : 'Good try! Keep going!';
    $('endScore').textContent='You got '+score+' out of '+n+' right.';
    var m=$('missed');
    if(missed.length){
      m.classList.remove('hidden');
      m.innerHTML='<h3>Words to practise:</h3>'+missed.map(function(q){return '<div><b>'+q.w+'</b> ↔ '+q.a+'</div>'}).join('');
    } else m.classList.add('hidden');
    var prev=parseInt(store('opp50Best')||'0',10);
    if(score>prev) store('opp50Best',String(score));
    showBest();
    if(pct>=.6){burst();yay();}
  }

  // ---- confetti ----
  var cv=$('confetti'),cx=cv.getContext('2d'),bits=[],anim=null;
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  addEventListener('resize',size);size();
  function burst(){
    var cols=['#ffb703','#ff6b6b','#2ecc71','#7c5cff','#4dd0e1','#f783ac'];
    for(var i=0;i<140;i++) bits.push({x:cv.width/2,y:cv.height/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-2,
      s:rand(6,11),c:cols[rand(0,cols.length-1)],r:Math.random()*6,l:160});
    if(!anim) loop();
  }
  function loop(){
    cx.clearRect(0,0,cv.width,cv.height);
    bits=bits.filter(function(p){return p.l>0});
    bits.forEach(function(p){
      p.vy+=.28;p.x+=p.vx;p.y+=p.vy;p.r+=.2;p.l--;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();
    });
    if(bits.length) anim=requestAnimationFrame(loop); else {anim=null;cx.clearRect(0,0,cv.width,cv.height)}
  }

  $('startBtn').addEventListener('click',begin);
  $('again').addEventListener('click',begin);
  $('next').addEventListener('click',next);
  $('say').addEventListener('click',function(){speak($('word').textContent)});
  showBest();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chemistry Quiz – 50 Questions</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2430;--mut:#667085;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#d9e0ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#182131;--tx:#e8edf5;--mut:#9aa6b8;--bd:#2a364a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{margin:0 0 4px;font-size:1.6rem}p{color:var(--mut);margin:4px 0 14px}
button{font:inherit;cursor:pointer;color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);text-align:left}
.t:hover{border-color:var(--pri)}.all{grid-column:1/-1;background:var(--pri);color:#fff;border:0;text-align:center;font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem}
h2{font-size:1.2rem;margin:6px 0 14px}
.o{display:block;width:100%;margin:8px 0;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);text-align:left}
.o:hover:not(:disabled){border-color:var(--pri)}.o.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.o.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.nx{margin-top:10px;padding:12px 20px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:600}
.big{font-size:3rem;font-weight:700;margin:0}.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
</style></head><body><main><div id="app"></div></main>
<script>
const RAW=`#Physical Change
Which is a physical change?|Tearing a sheet of paper|Burning a match|Rusting a nail|Cooking an egg
Dew forming on grass is|condensation|sublimation|combustion|oxidation
Which is a physical property?|Density|Ability to burn|Ability to tarnish|Reaction with acid
Melting chocolate is a|physical change|chemical change|nuclear change|oxidation
Frost forming directly from water vapour is|deposition|sublimation|melting|boiling
#Chemical Change
Fireworks exploding show a|chemical change|physical change|evaporation|dissolving
Silver tarnishing is a|chemical change|physical change|melting|sublimation
Which is a chemical change?|Cooking an egg|Folding paper|Freezing juice|Grinding salt
Bubbles from an antacid tablet in water indicate|a chemical reaction|a physical change only|evaporation|melting
Which is NOT evidence of a chemical change?|Change in shape|Temperature change|Gas formation|New smell
#Periodic Table
Elements in the same group have similar|chemical properties|masses|colours|states
Metalloids are found|along the zigzag staircase|in group 1|far left|in group 18
Atomic number of hydrogen|1|2|0|8
Symbol for iron|Fe|Ir|I|F
Which element is a halogen?|Chlorine|Argon|Calcium|Sodium
Across a period, left to right, elements go from|metals to nonmetals|nonmetals to metals|gases to solids|heavy to light
#Precipitate
In an equation, a precipitate is written with|(s)|(aq)|(g)|(l)
Mixing BaCl₂ and Na₂SO₄ gives a white precipitate of|BaSO₄|NaCl|BaCl₂|Na₂SO₄
A precipitate settles at the bottom because it is an|insoluble solid|gas|dissolved ion|solvent
Cu²⁺ with hydroxide gives a precipitate that is|blue|white|yellow|black
To collect a precipitate you would use|filter paper and funnel|a magnet|a thermometer|a stopwatch
#Oxidation
In 2Mg + O₂ → 2MgO, magnesium is|oxidized|reduced|a catalyst|a solvent
In a redox reaction, oxidation and reduction occur|together|separately|never|only in water
Oxidation number of Na in NaCl|+1|-1|0|+2
Rusting is fastest in|salt water|dry air|a vacuum|oil-coated iron
A cut apple turning brown is|oxidation|evaporation|condensation|filtration
Galvanizing protects iron using|zinc|sugar|water|salt
#Compounds
Formula for carbon monoxide|CO|CO₂|C₂O|O₂C
Hydrogen peroxide|H₂O₂|H₂O|HO|H₃O
NaCl is held together by|ionic bonds|covalent bonds|metallic bonds|no bonds
Which is a molecule of an element?|O₂|H₂O|CO₂|NaCl
A subscript in a formula shows the|number of atoms|charge|colour|state
Which is a compound?|Sugar|Silver|Sulfur|Silicon
#Mixtures
Sand and sugar can be separated by|dissolving the sugar, then filtering|a magnet|chromatography only|they can't
Which is a suspension?|Muddy water|Salt water|Air|Sugar water
Distillation separates liquids by their|boiling points|colour|magnetism|particle size
Orange juice with pulp is a|heterogeneous mixture|pure substance|compound|element
A mixture's composition|can vary|is fixed|is a formula|is always 1:1
#Atoms
Who proposed the nuclear model of the atom?|Rutherford|Dalton|Thomson|Mendeleev
Electrons are found in|energy levels (shells)|the nucleus|protons|neutrons
Number of neutrons in carbon-14|8|6|14|12
Atoms are mostly|empty space|solid matter|neutrons|protons
An atom that gains an electron becomes a|negative ion|positive ion|isotope|neutron
Valence electrons are in the|outermost shell|nucleus|first shell only|inner shells
#Solubility
Which dissolves in water?|Table salt|Sand|Cooking oil|Candle wax
Solubility is often measured in|g per 100 mL water|metres|volts|newtons
A supersaturated solution holds|more solute than normal|no solute|less solute|only solvent
Crushing sugar speeds dissolving because of|greater surface area|lower temperature|less solvent|more mass
Which is a solution?|Sugar dissolved in water|Sand in water|Oil in water|Chalk in water
Higher pressure increases solubility of|gases|solids|metals|none of these`;
let Q=[],T=[],cur="";
RAW.split("\n").forEach(l=>{if(l[0]=="#"){cur=l.slice(1);T.push(cur)}else{const p=l.split("|");Q.push({t:cur,q:p[0],a:p[1],o:p.slice(1)})}});
const $=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let L,i,sc,res,done;
function home(){$.innerHTML=`<div class="card"><h1>🧪 Chemistry Quiz</h1><p>${Q.length} questions · pick a topic or take them all.</p><div class="grid"><button class="t all" onclick="start()">All ${Q.length} questions</button>${T.map(t=>`<button class="t" onclick="start('${t}')">${t}<br><small>${Q.filter(q=>q.t==t).length} Qs</small></button>`).join("")}</div></div>`}
function start(t){L=sh(t?Q.filter(q=>q.t==t):Q);i=0;sc=0;res={};show()}
function show(){const q=L[i];done=0;$.innerHTML=`<div class="card"><div class="meta"><span>${q.t}</span><span>Q ${i+1}/${L.length} · Score ${sc}</span></div><div class="bar"><i style="width:${i/L.length*100}%"></i></div><h2>${q.q}</h2><div id="os">${sh(q.o).map(o=>`<button class="o" data-v="${o}">${o}</button>`).join("")}</div><div id="nx"></div></div>`;
document.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(b))}
function pick(b){if(done)return;done=1;const q=L[i],r=res[q.t]=res[q.t]||[0,0];r[1]++;
const ok=b.dataset.v==q.a;if(ok){sc++;r[0]++}
document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.dataset.v==q.a)x.classList.add("ok");else if(x==b)x.classList.add("bad")});
document.getElementById("nx").innerHTML=`<button class="nx" onclick="nxt()">${i+1<L.length?"Next →":"See results"}</button>`}
function nxt(){i++;i<L.length?show():end()}
function end(){const p=Math.round(sc/L.length*100);$.innerHTML=`<div class="card"><h1>Results</h1><p class="big">${sc}/${L.length}</p><p>${p}% — ${p>=80?"Excellent! 🎉":p>=60?"Good work! Keep practising.":"Review the topics below and try again."}</p>${Object.keys(res).map(t=>`<div class="row"><span>${t}</span><b>${res[t][0]}/${res[t][1]}</b></div>`).join("")}<button class="nx" onclick="home()">Back to topics</button></div>`}
home();
</script></body></html>

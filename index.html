<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar System Quiz – Chapter 1</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0f1240;--card:#ffffff;--tx:#1b1f4b;--ac:#ff9f1c;--ok:#2ec4b6;--no:#ef476f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1d2160;--tx:#f2f3ff}}
:root[data-theme="dark"]{--card:#1d2160;--tx:#f2f3ff}
*{box-sizing:inherit}
body{margin:0;font-family:"Trebuchet MS",Verdana,sans-serif;background:radial-gradient(circle at 20% 10%,#3a2f8f,var(--bg));color:var(--tx);min-height:100vh;display:flex;justify-content:center;padding:16px}
.card{background:var(--card);border-radius:20px;padding:24px;max-width:640px;width:100%;align-self:flex-start;box-shadow:0 10px 40px #0006}
h1{margin:0 0 8px;font-size:1.8rem}
.big{font-size:3rem;text-align:center}
p{line-height:1.5}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;background:var(--ac);color:#1b1f4b;font-weight:bold;font-size:1.05rem}
.opt{display:block;width:100%;text-align:left;margin:10px 0;background:#eef0ff;color:#1b1f4b;border:3px solid transparent}
.opt.ok{background:var(--ok);color:#fff}.opt.no{background:var(--no);color:#fff}
.bar{height:12px;background:#8883;border-radius:9px;overflow:hidden;margin:8px 0 16px}
.bar div{height:100%;background:var(--ok);transition:width .3s}
.top{display:flex;justify-content:space-between;font-weight:bold}
.fb{min-height:1.5em;font-weight:bold;margin:8px 0}
.rev{font-size:.95rem;border-left:4px solid var(--no);padding-left:10px;margin:10px 0}
.hide{display:none}
</style></head>
<body><div class="card" id="app"></div>
<script>
// Format: question | correct answer | wrong | wrong | wrong
const D=[

"What force holds objects in orbit?|Gravity|Wind|Heat|Magnetism",
"How many stars are in our solar system?|One|Two|Five|Eight",
"What is the name of the star in our solar system?|The sun|Mercury|Pluto|Jupiter",

"An orbit is what shape?|Oval|Square|Triangle|Straight line",

"About how long ago did our solar system form?|Over four billion years ago|Four hundred years ago|Four thousand years ago|Four million years ago",
"What kind of materials could survive the heat near the sun?|Rocky materials|Icy materials|Gases|Water",
"The four planets closest to the sun are made up mainly of what?|Rock and metal|Ice and gas|Water and methane|Hydrogen and helium",
"What does a terrestrial planet have?|A solid surface|No surface|Rings|A blue-green color",
"How many terrestrial planets are in our solar system?|Four|Two|Six|Eight",
"Which is the smallest terrestrial planet?|Mercury|Venus|Earth|Mars",
"Which planet is closest to the sun?|Mercury|Venus|Earth|Neptune",
"About how far is Mercury from the sun?|35,600,000 miles|67 million miles|A billion miles|3,560 miles",
"Mercury is only slightly larger than what?|Earth's moon|Earth|Mars|Jupiter",
"How often does Mercury orbit the sun?|Once every eighty-eight days|Once a day|Once a week|Once every year",
"Which word describes Mercury's surface?|Very hot|Very icy|Covered in oceans|Covered in rings",
"Which planet is the hottest?|Venus|Mercury|Mars|Neptune",
"Why is Venus so hot?|It has a very dense atmosphere|It is closest to the sun|It has many moons|It has rings",
"What happens to sunlight on Venus after it reflects off the surface?|The thick atmosphere reflects it back down|It escapes into space|It turns into ice|It disappears",
"About how far is Venus from the sun?|Almost 67 million miles|35.6 million miles|A billion miles|93 miles",
"Venus is about the same size as which planet?|Earth|Mercury|Jupiter|Saturn",
"Which features does Venus have?|Mountains and volcanoes|Rings and ice|Only oceans|Only gas",
"What may Venus have had long ago?|A shallow ocean|Rings|A second sun|Many moons",
"What does the Mariner 10 photo show?|Clouds swirling above Venus's surface|Mars's canyons|Saturn's rings|Pluto's mountains",
"Which planet is third from the sun?|Earth|Venus|Mars|Mercury",
"Which is the only planet known to support life?|Earth|Mars|Venus|Jupiter",
"Which three things make life possible on Earth?|Temperature, water, and the mix of gases|Rings, moons, and craters|Wind, ice, and methane|Volcanoes, canyons, and dust",
"Earth is the only planet with how many moons?|Just one|None|Two|Seventy-nine",
"Which two planets do not have moons?|Mercury and Venus|Earth and Mars|Jupiter and Saturn|Uranus and Neptune",
"The five planets after Earth's neighbors mostly have how many moons?|Two or more|None|Exactly one|Exactly ten",
"Which planet is fourth from the sun?|Mars|Earth|Venus|Jupiter",
"About how big is Mars compared to Earth?|About half the size|Twice the size|The same size|Eleven times the size",
"What is Mars's atmosphere like?|Thin|Very dense|Full of methane clouds|Thicker than Venus's",
"What is the average temperature on Mars?|-81°F|81°F|500°F|1,200°F",
"Which features dot the surface of Mars?|Mountains, craters, canyons, and volcanoes|Only oceans|Only rings|Only clouds",
"Is there evidence that life exists on Mars now?|No|Yes, many cities|Yes, in oceans|Yes, on the rings",
"Why do scientists think Mars may have supported life once?|There is evidence of water|It has rings|It is very hot|It has seventy-nine moons",
"Which planet is called the red planet?|Mars|Venus|Mercury|Neptune",
"Why does Mars look reddish?|Large amounts of iron in the soil|Red gas in the air|Its ocean is red|The sun paints it",
"The other four planets are classified as what?|Ice giants or gas giants|Terrestrial planets|Dwarf planets|Asteroids",
"What do ice giants and gas giants NOT have?|A definite surface|Gases|Size|Cores",
"What are the giant planets mostly made of?|Gases|Solid rock|Metal|Sand",
"What part of a giant planet is solid?|The small core at the center|The whole planet|The outer surface|The atmosphere",
"Which is the largest planet in our solar system?|Jupiter|Saturn|Earth|Neptune",
"How many moons does Jupiter have that we know of?|Seventy-nine|Two|Fifty|One",
"What is Jupiter's Great Red Spot?|A huge storm|A volcano|A crater|An ocean",
"About how long has the Great Red Spot been going?|Hundreds of years|A few days|One year|Ten minutes",
"Which gases mostly make up Jupiter's atmosphere?|Hydrogen and helium|Methane and water|Oxygen and iron|Carbon and dust",
"Jupiter's gases are the same elements that make up what?|The sun|Earth's soil|Saturn's rings|Mars's surface",
"How wide is Jupiter compared to Earth?|Eleven times the width|Half the width|The same width|Two times the width",
"About how far is Saturn from the sun?|Nearly a billion miles|35,600,000 miles|67 million miles|Ten thousand miles",
"What kind of planet is Saturn?|A gas giant|An ice giant|A terrestrial planet|A dwarf planet",
"Saturn is made up mainly of what?|Hydrogen and helium|Iron and rock|Water and methane|Ice only",
"What is Saturn most famous for?|Its rings|Its Great Red Spot|Its blue-green color|Its tilt",
"About how many moons does Saturn have?|Over fifty|Exactly one|Zero|Exactly five",
"What might some of Saturn's moons be able to do?|Support life|Explode|Make rings|Change into planets",
"What are Saturn's rings made of?|Chunks of rock and ice|Solid gold|Clouds only|Gases only",
"What kind of planet is Uranus?|An ice giant|A gas giant|A terrestrial planet|A dwarf planet",
"Uranus is made mostly of what?|Water, methane gas, and other materials|Rock and metal|Only hydrogen|Solid ice cubes",
"What gives Uranus its blue-green color?|Methane|Iron|Sunlight|Ocean water",
"How fast can Uranus's winds reach?|Up to 560 miles per hour|Up to 5 miles per hour|Up to 1,200 miles per hour|They have no wind",
"Like Saturn, Uranus has what?|Rings|A Great Red Spot|A solid surface|Seventy-nine moons",
"What makes Uranus unique?|It tilts almost completely on its side|It is the hottest planet|It has no atmosphere|It is closest to the sun",
"Which spacecraft took the picture of Uranus in the chapter?|Voyager 2|Messenger|Mariner 10|New Horizons",
"Which planet is the farthest from the sun?|Neptune|Uranus|Saturn|Pluto",
"What kind of planet is Neptune?|An ice giant|A gas giant|A terrestrial planet|A moon",
"How fast can Neptune's winds reach?|Up to 1,200 miles per hour|Up to 560 miles per hour|Up to 12 miles per hour|Up to 79 miles per hour",
"Why are there no rocky features on Neptune's surface?|It does not have a solid surface|It is too small|It is too close to the sun|It is covered in sand",
"Neptune's structure is similar to which planet?|Uranus|Mercury|Earth|Mars",
"What do some scientists think may be under Neptune's clouds?|A hot ocean|A city|A volcano field|A second sun",
"Which words describe Neptune?|Dark, windy, and cold|Bright, calm, and warm|Small, rocky, and hot|Red and dusty",
"What is a dwarf planet?|An object with some, but not all, characteristics of regular planets|A very small star|Another word for a moon|A comet without a tail",
"Which is an example of a dwarf planet?|Pluto|Mars|Saturn|Earth",
"How many dwarf planets have scientists identified and named?|Five|One|Eight|Twenty",
"Where are the dwarf planets located?|Farther from the sun than Neptune|Between Earth and Mars|Closer than Mercury|Inside the sun",
"What do asteroids, meteors, and comets all orbit?|The sun|The Earth|Jupiter|Pluto",
"How big can asteroids, meteors, and comets be?|From small particles to hundreds of miles across|Only as big as a marble|Bigger than the sun|Exactly the size of Earth",
"What do comets contain?|Ice and dust|Only rock|Only metal|Only gas",
"When does a comet form its tail?|When it is close to the sun|When it is far from the sun|When it hits Earth|When it stops moving",
"What is a comet's tail made of?|Gas and other material|Solid rock|Water only|Metal",
"What did New Horizons photograph?|Pluto's icy mountains|Saturn's rings|Mars's canyons|Venus's clouds",
"Which instrument-carrying spacecraft imaged Mercury's surface?|Messenger|Voyager 2|Mariner 10|New Horizons",
"Which planet is second from the sun?|Venus|Earth|Mars|Mercury",
"Which two planets are ice giants?|Uranus and Neptune|Jupiter and Saturn|Earth and Mars|Mercury and Venus",
"Which two planets are gas giants?|Jupiter and Saturn|Uranus and Neptune|Mars and Venus|Earth and Mercury",
"Which two planets in the chapter are described as having rings?|Saturn and Uranus|Mars and Venus|Earth and Mercury|Jupiter and Mars",
"Venus is farther from the sun than Mercury. Why is Venus hotter?|Its dense atmosphere traps heat|It is bigger than Jupiter|It has more moons|It has no atmosphere",
"Which planet has the fastest winds mentioned in the chapter?|Neptune|Uranus|Mars|Earth",
"Which planet has the Great Red Spot?|Jupiter|Mars|Saturn|Venus",
"In the vocabulary box, what does the abbreviation n. stand for?|Noun|Number|Name|Near",
"How many planets are ice giants or gas giants?|Four|Two|Six|Eight"
];
const $=s=>document.getElementById(s),app=$("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let Q,i,score,wrong,done;
function start(){
  app.innerHTML=`<div class="big">🪐🚀☀️</div><h1>Solar System Quiz</h1><p>Chapter 1 · Grade 4 · ${D.length} questions.<br>Pick the best answer. You will see right away if you got it!</p><button onclick="go()">Start Quiz</button>`;
}
function go(){
  Q=sh(D).map(s=>{const p=s.split("|");return{q:p[0],a:p[1],o:sh(p.slice(1))}});
  i=0;score=0;wrong=[];show();
}
function show(){
  const q=Q[i];done=false;
  app.innerHTML=`<div class="top"><span>Question ${i+1} of ${Q.length}</span><span>⭐ ${score}</span></div>
  <div class="bar"><div style="width:${i/Q.length*100}%"></div></div>
  <h2 style="margin-top:0">${q.q}</h2>
  ${q.o.map((t,k)=>`<button class="opt" onclick="pick(${k})">${t}</button>`).join("")}
  <div class="fb" id="fb"></div><button id="nx" class="hide" onclick="next()">${i==Q.length-1?"See Results":"Next ➜"}</button>`;
}
function pick(k){
  if(done)return;done=true;
  const q=Q[i],b=document.querySelectorAll(".opt");
  b.forEach((el,n)=>{if(q.o[n]==q.a)el.classList.add("ok");});
  if(q.o[k]==q.a){score++;$("fb").textContent="✅ Correct! Great job!"}
  else{b[k].classList.add("no");wrong.push(q);$("fb").textContent="❌ Not quite. The answer is: "+q.a}
  $("nx").classList.remove("hide");
}
function next(){i++;i<Q.length?show():end()}
function end(){
  const p=Math.round(score/Q.length*100);
  const m=p>=90?"Superstar astronaut! 🌟":p>=70?"Great work, space explorer! 🚀":p>=50?"Good try! Read the chapter and try again. 📖":"Keep practicing, you can do it! 💪";
  app.innerHTML=`<div class="big">🏆</div><h1>${score} / ${Q.length} (${p}%)</h1><p>${m}</p>
  ${wrong.length?`<h3>Questions to review (${wrong.length})</h3>`+wrong.map(q=>`<div class="rev">${q.q}<br><b>${q.a}</b></div>`).join(""):""}
  <button onclick="go()">Play Again</button>`;
}
start();
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Explorer Passport — Grade 4 Review Expedition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EFF6EF;
    --paper-alt: #FFFFFF;
    --ink: #16302B;
    --ink-soft: #4A6B62;
    --line: #CFE0D6;
    --line-strong: #9FC2B0;

    --c-plants: #3F8F5D;
    --c-animals: #D98A22;
    --c-forces: #C0503C;
    --c-soil: #8A5A38;
    --c-rocks: #5C7280;
    --c-habitats: #2A8F82;
    --c-light: #6957D6;
    --c-machines: #3D6C9E;
    --c-matter: #CF5164;
    --c-body: #B98A1A;

    --success: #2F8F4E;
    --error: #C0503C;

    --radius: 16px;
    --shadow: 0 6px 20px rgba(22, 48, 43, 0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0F221E;
      --paper-alt: #16302B;
      --ink: #E9F3EE;
      --ink-soft: #A9C7BC;
      --line: #29473F;
      --line-strong: #3B6357;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #0F221E;
    --paper-alt: #16302B;
    --ink: #E9F3EE;
    --ink-soft: #A9C7BC;
    --line: #29473F;
    --line-strong: #3B6357;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: 'Baloo 2', 'Trebuchet MS', sans-serif;
    font-weight: 700;
    line-height: 1.15;
    margin: 0;
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 64px;
    min-height: 100vh;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-mark {
    font-size: 28px;
    display: inline-block;
  }

  .brand-text {
    font-family: 'Baloo 2', 'Trebuchet MS', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--ink);
  }

  .pill {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink-soft);
    background: var(--paper-alt);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 999px;
  }

  /* ---------- START SCREEN ---------- */

  .hero {
    text-align: left;
    padding: 8px 4px 26px;
  }

  .hero h1 {
    font-size: 34px;
    color: var(--ink);
    max-width: 15ch;
  }

  .hero .compass {
    font-size: 46px;
    display: inline-block;
    margin-bottom: 10px;
    animation: spin-in 0.7s ease-out;
  }

  @keyframes spin-in {
    from { transform: rotate(-40deg) scale(0.6); opacity: 0; }
    to { transform: rotate(0deg) scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .compass { animation: none; }
  }

  .hero p {
    color: var(--ink-soft);
    font-size: 16.5px;
    line-height: 1.55;
    max-width: 48ch;
    margin-top: 12px;
  }

  .name-card {
    background: var(--paper-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    margin: 22px 0 30px;
  }

  .name-card label {
    display: block;
    font-weight: 700;
    font-size: 14.5px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .name-card input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--line-strong);
    background: var(--paper);
    color: var(--ink);
    font-size: 16px;
    font-family: inherit;
  }

  .name-card input:focus-visible {
    outline: 3px solid var(--c-habitats);
    outline-offset: 1px;
  }

  .trail-heading {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 6px 0 14px;
  }

  .trail {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 26px;
  }

  @media (min-width: 520px) {
    .trail { grid-template-columns: repeat(3, 1fr); }
  }

  .stop {
    background: var(--paper-alt);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-left: 5px solid var(--stop-color, var(--c-plants));
  }

  .stop .stop-icon { font-size: 22px; }
  .stop .stop-num {
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-soft);
  }
  .stop .stop-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    color: var(--ink);
    line-height: 1.25;
  }
  .stop .stop-grade {
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--c-habitats);
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 15px 22px;
    font-weight: 800;
    font-size: 16.5px;
    font-family: 'Baloo 2', sans-serif;
    width: 100%;
    box-shadow: 0 4px 14px rgba(42, 143, 130, 0.35);
    transition: transform 0.12s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0px); }
  .btn-primary:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--line-strong);
    border-radius: 12px;
    padding: 13px 20px;
    font-weight: 700;
    font-size: 15px;
    font-family: 'Nunito', sans-serif;
    width: 100%;
  }
  .btn-secondary:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }

  /* ---------- QUESTION SCREEN ---------- */

  .stage-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .stage-badge {
    width: 46px;
    height: 46px;
    min-width: 46px;
    border-radius: 12px;
    background: var(--stage-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .stage-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
  }

  .stage-sub {
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--stage-color);
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  .progress-label {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .question-card {
    background: var(--paper-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 20px;
  }

  .question-text {
    font-size: 19px;
    font-weight: 700;
    font-family: 'Baloo 2', sans-serif;
    line-height: 1.4;
    color: var(--ink);
    margin-bottom: 18px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    text-align: left;
    background: var(--paper);
    border: 1.5px solid var(--line-strong);
    border-radius: 12px;
    padding: 13px 14px;
    font-size: 15.5px;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .option .opt-letter {
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 8px;
    background: var(--paper-alt);
    border: 1.5px solid var(--line-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
  }

  .option:hover { border-color: var(--stage-color); }
  .option:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }

  .option.correct {
    background: rgba(47, 143, 78, 0.13);
    border-color: var(--success);
  }
  .option.correct .opt-letter {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }

  .option.incorrect {
    background: rgba(192, 80, 60, 0.12);
    border-color: var(--error);
    animation: shake 0.35s ease;
  }
  .option.incorrect .opt-letter {
    background: var(--error);
    border-color: var(--error);
    color: #fff;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .option.incorrect { animation: none; }
  }

  .option[disabled] { cursor: default; }

  .explain-box {
    margin-top: 16px;
    padding: 14px 15px;
    border-radius: 12px;
    background: var(--paper);
    border: 1px dashed var(--line-strong);
    font-size: 14.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .explain-box strong { color: var(--ink); }

  .next-row { margin-top: 18px; }

  /* ---------- STAGE COMPLETE ---------- */

  .stamp-wrap {
    text-align: center;
    padding: 30px 10px 10px;
  }

  .stamp {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: var(--stage-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    margin: 0 auto 18px;
    box-shadow: var(--shadow);
    animation: pop-in 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop-in {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp { animation: none; }
  }

  .stage-result-title {
    font-size: 21px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .stage-result-score {
    font-size: 15px;
    color: var(--ink-soft);
    font-weight: 700;
    margin-bottom: 24px;
  }

  /* ---------- FINAL PASSPORT ---------- */

  .final-score-card {
    background: var(--paper-alt);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 22px;
    text-align: center;
    margin-bottom: 24px;
  }

  .final-score-num {
    font-family: 'Baloo 2', sans-serif;
    font-size: 52px;
    font-weight: 800;
    color: var(--ink);
  }

  .final-score-den {
    font-size: 18px;
    color: var(--ink-soft);
    font-weight: 700;
  }

  .final-score-pct {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
    background: var(--c-habitats);
    color: #fff;
  }

  .badges-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin: 22px 0 26px;
  }
  @media (max-width: 420px) {
    .badges-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
  }

  .mini-badge {
    aspect-ratio: 1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    background: var(--badge-color);
  }
  .mini-badge.faded {
    background: var(--paper);
    border: 1.5px dashed var(--line-strong);
    opacity: 0.55;
    filter: grayscale(1);
  }

  .review-toggle {
    text-align: center;
    margin: 6px 0 18px;
  }
  .review-toggle button {
    background: none;
    border: none;
    color: var(--c-habitats);
    font-weight: 800;
    font-size: 14.5px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .review-item {
    background: var(--paper-alt);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 15px;
    margin-bottom: 10px;
  }
  .review-item .rq {
    font-weight: 700;
    font-size: 14.5px;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .review-item .ra {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .review-item .ra b { color: var(--success); }

  .stage-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 24px;
  }
  .stage-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--paper-alt);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .stage-row .sr-icon {
    width: 34px; height: 34px; min-width: 34px;
    border-radius: 9px;
    background: var(--row-color);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .stage-row .sr-title {
    font-weight: 700;
    font-size: 14px;
    flex: 1;
  }
  .stage-row .sr-score {
    font-weight: 800;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .footnote {
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 30px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {

  var STAGES = [
    {
      key: "plants", title: "Plant Growth & Structures", grade: "Grade 3 review", icon: "🌱", color: "var(--c-plants)",
      questions: [
        { q: "Which part of a plant absorbs water and nutrients from the soil?", opts: ["Leaf", "Root", "Stem", "Flower"], correct: 1, explain: "Roots grow down into the soil and take in water and nutrients the plant needs." },
        { q: "What is the main job of a plant's leaves?", opts: ["Absorb water from soil", "Make food using sunlight", "Hold the plant upright", "Produce seeds"], correct: 1, explain: "Leaves capture sunlight and use it to make the plant's food." },
        { q: "What do we call the process plants use to make food from sunlight, water, and air?", opts: ["Respiration", "Photosynthesis", "Pollination", "Germination"], correct: 1, explain: "Photosynthesis lets plants turn sunlight, water, and carbon dioxide into food." },
        { q: "Which part of the plant carries water from the roots to the rest of the plant?", opts: ["Stem", "Fruit", "Root hair", "Petal"], correct: 0, explain: "The stem acts like a pipeline, moving water upward through the plant." },
        { q: "What is the first stage of a seed developing into a plant called?", opts: ["Pollination", "Germination", "Photosynthesis", "Decomposition"], correct: 1, explain: "Germination is when a seed begins to sprout and grow." },
        { q: "What is the main job of a flower?", opts: ["Store food", "Produce seeds", "Absorb sunlight", "Take in water"], correct: 1, explain: "Flowers help plants reproduce by producing seeds." },
        { q: "Which of these is needed for a seed to germinate?", opts: ["Water", "Ice", "Salt", "Total darkness only"], correct: 0, explain: "Seeds need water (along with warmth and air) to begin sprouting." },
        { q: "What protects a developing seed?", opts: ["Petal", "Seed coat", "Stem", "Leaf"], correct: 1, explain: "The seed coat is a tough outer layer that protects the seed inside." },
        { q: "What do we call the stage in a plant's life when it produces flowers and fruit?", opts: ["Seedling stage", "Reproductive stage", "Root stage", "Dormant stage"], correct: 1, explain: "In the reproductive stage, a mature plant flowers and forms fruit or seeds." },
        { q: "Which condition would most likely stop a healthy plant from growing well?", opts: ["Regular watering", "Enough sunlight", "No sunlight at all", "Fresh air"], correct: 2, explain: "Without sunlight, a plant cannot make the food it needs through photosynthesis." }
      ]
    },
    {
      key: "animals", title: "Animal Growth & Life Cycles", grade: "Grade 3 review", icon: "🐣", color: "var(--c-animals)",
      questions: [
        { q: "What is it called when an animal changes shape completely during its life cycle, like a caterpillar becoming a butterfly?", opts: ["Germination", "Metamorphosis", "Hibernation", "Migration"], correct: 1, explain: "Metamorphosis is a big change in body shape as an animal grows up." },
        { q: "Which animal begins life as a tadpole?", opts: ["Frog", "Chicken", "Dog", "Butterfly"], correct: 0, explain: "Frogs hatch from eggs as tadpoles before growing legs and losing their tails." },
        { q: "A baby chicken is called a ___.", opts: ["Cub", "Chick", "Calf", "Kit"], correct: 1, explain: "A baby chicken is called a chick." },
        { q: "Which of these animals lays eggs?", opts: ["Dog", "Cat", "Bird", "Horse"], correct: 2, explain: "Birds lay eggs, and their babies hatch out of them." },
        { q: "What do we call an animal's process of resting through winter to save energy?", opts: ["Hibernation", "Migration", "Metamorphosis", "Camouflage"], correct: 0, explain: "During hibernation, an animal's body slows down so it can survive winter without much food." },
        { q: "Why do some animals migrate?", opts: ["To find food and better weather", "To grow wings", "To change color", "To lay eggs underground"], correct: 0, explain: "Animals often migrate to reach places with more food or milder weather." },
        { q: "What is a baby dog called?", opts: ["Kit", "Puppy", "Cub", "Fawn"], correct: 1, explain: "A baby dog is called a puppy." },
        { q: "All living things grow, change, and eventually...", opts: ["Fly", "Reproduce", "Turn into plants", "Stop needing food"], correct: 1, explain: "Growing, changing, and reproducing are all part of a living thing's life cycle." },
        { q: "Which stage comes right after the egg in a butterfly's life cycle?", opts: ["Adult butterfly", "Caterpillar (larva)", "Empty cocoon", "Pollination"], correct: 1, explain: "A butterfly egg hatches into a caterpillar, also called a larva." },
        { q: "What do baby animals need from their parents to grow up healthy?", opts: ["Food and protection", "Money", "School supplies", "Nothing at all"], correct: 0, explain: "Most baby animals depend on their parents for food, safety, and care." }
      ]
    },
    {
      key: "forces", title: "Forces & Movement", grade: "Grade 3 review", icon: "🏀", color: "var(--c-forces)",
      questions: [
        { q: "A push or a pull on an object is called a ___.", opts: ["Force", "Mass", "Energy", "Friction"], correct: 0, explain: "Any push or pull on an object is called a force." },
        { q: "What force pulls objects toward the Earth?", opts: ["Magnetism", "Gravity", "Friction", "Tension"], correct: 1, explain: "Gravity constantly pulls objects down toward Earth." },
        { q: "What is the force that slows down moving objects when two surfaces rub together?", opts: ["Gravity", "Friction", "Magnetism", "Air pressure"], correct: 1, explain: "Friction happens when surfaces rub together, slowing motion down." },
        { q: "Which of these would roll farther on a smooth floor than on a rough carpet?", opts: ["A ball", "A rock", "Both roll the same distance", "Neither rolls"], correct: 0, explain: "Smooth floors create less friction, so a ball can roll farther." },
        { q: "What kind of force can pull or push certain metal objects without touching them?", opts: ["Gravity", "Magnetic force", "Friction", "Air resistance"], correct: 1, explain: "Magnetic force can act on certain metals from a distance, without touching them." },
        { q: "A heavier object usually needs ___ force to move it than a lighter object.", opts: ["Less", "More", "No", "The exact same"], correct: 1, explain: "Heavier objects generally need a stronger push or pull to get moving." },
        { q: "Which everyday example shows gravity at work?", opts: ["A magnet picking up a paperclip", "An apple falling from a tree", "Ice melting on a table", "A balloon floating upward"], correct: 1, explain: "An apple falls because gravity pulls it toward the ground." },
        { q: "If there were no friction or gravity acting on it, a moving object would...", opts: ["Keep moving", "Stop immediately", "Disappear", "Turn around on its own"], correct: 0, explain: "Without any force to slow or stop it, a moving object keeps moving." },
        { q: "Which surface would create the most friction for a sliding box?", opts: ["Ice", "Wet tile", "Rough carpet", "Polished wood"], correct: 2, explain: "Rough surfaces like carpet create more friction than smooth ones." },
        { q: "Pushing a swing to make it go higher is an example of using ___.", opts: ["Gravity only", "A force", "Magnetism", "Friction only"], correct: 1, explain: "Pushing the swing is a force that makes it move higher." }
      ]
    },
    {
      key: "soil", title: "Soils in the Environment", grade: "Grade 3 review", icon: "🪱", color: "var(--c-soil)",
      questions: [
        { q: "Which of these is NOT a main component of soil?", opts: ["Sand", "Clay", "Plastic", "Humus"], correct: 2, explain: "Natural soil is made of sand, clay, silt, and humus — not plastic." },
        { q: "What is humus?", opts: ["Small rocks", "Decayed plant and animal material", "A type of sand", "Liquid water"], correct: 1, explain: "Humus is dark, decayed organic matter that makes soil rich in nutrients." },
        { q: "Which soil type holds water the longest?", opts: ["Sandy soil", "Clay soil", "Rocky soil", "Gravel"], correct: 1, explain: "Clay has very fine particles packed tightly, so it holds water longer than sand." },
        { q: "Why is soil important for plants?", opts: ["It provides nutrients and support for roots", "It blocks sunlight", "It makes seeds", "It replaces water completely"], correct: 0, explain: "Soil anchors roots in place and supplies the nutrients plants need to grow." },

  var TOTAL_QUESTIONS = STAGES.reduce(function (sum, s) { return sum + s.questions.length; }, 0);

  var state = {
    name: "",
    stageIndex: 0,
    questionIndex: 0,
    answered: false,
    selected: -1,
    results: [] // { stageIndex, questionIndex, correct }
  };

  function esc(str) {
    var d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  function letter(i) { return ["A", "B", "C", "D"][i]; }

  function overallCorrect() {
    return state.results.filter(function (r) { return r.correct; }).length;
  }

  function stageResults(stageIndex) {
    return state.results.filter(function (r) { return r.stageIndex === stageIndex; });
  }

  // ---------- RENDER: START ----------

  function renderStart() {
    var stops = STAGES.map(function (s, i) {
      return '<div class="stop" style="--stop-color:' + s.color + '">' +
        '<span class="stop-icon">' + s.icon + '</span>' +
        '<span class="stop-num">Stop ' + (i + 1) + '</span>' +
        '<span class="stop-title">' + esc(s.title) + '</span>' +
        '<span class="stop-grade">' + esc(s.grade) + '</span>' +
        '</div>';
    }).join("");

    document.getElementById("app").innerHTML =
      '<div class="topbar">' +
        '<div class="brand"><span class="brand-mark">🧭</span><span class="brand-text">Science Explorer Passport</span></div>' +
        '<span class="pill">' + TOTAL_QUESTIONS + ' questions</span>' +
      '</div>' +
      '<div class="hero">' +
        '<span class="compass">🧭</span>' +
        '<h1>A Grade 4 science expedition, starting with Grade 3 ground</h1>' +
        '<p>This trail checks what a student already knows from Grade 3 science, then previews a few Grade 4 topics. There are 10 stops with 10 questions each — every answer gets instant, friendly feedback.</p>' +
      '</div>' +
      '<div class="name-card">' +
        '<label for="explorer-name">Explorer\'s name (optional)</label>' +
        '<input id="explorer-name" type="text" maxlength="30" placeholder="Type a name to personalize the passport" value="' + esc(state.name) + '">' +
      '</div>' +
      '<div class="trail-heading">The trail ahead</div>' +
      '<div class="trail">' + stops + '</div>' +
      '<button class="btn-primary" id="start-btn">Begin the expedition</button>' +
      '<div class="footnote">Takes about 20–30 minutes for all 10 stops. Progress isn\'t saved if the page is closed.</div>';

    document.getElementById("start-btn").addEventListener("click", function () {
      var input = document.getElementById("explorer-name");
      state.name = input.value.trim();
      state.stageIndex = 0;
      state.questionIndex = 0;
      state.results = [];
      renderQuestion();
    });
  }

  // ---------- RENDER: QUESTION ----------

  function renderQuestion() {
    var stage = STAGES[state.stageIndex];
    var q = stage.questions[state.questionIndex];
    state.answered = false;
    state.selected = -1;

    var questionsDoneBefore = 0;
    for (var i = 0; i < state.stageIndex; i++) questionsDoneBefore += STAGES[i].questions.length;
    var overallDone = questionsDoneBefore + state.questionIndex;

    var optionsHtml = q.opts.map(function (opt, idx) {
      return '<button class="option" data-idx="' + idx + '">' +
        '<span class="opt-letter">' + letter(idx) + '</span>' +
        '<span>' + esc(opt) + '</span>' +
        '</button>';
    }).join("");

    document.getElementById("app").innerHTML =
      '<div class="topbar">' +
        '<div class="brand"><span class="brand-mark">🧭</span><span class="brand-text">Science Explorer Passport</span></div>' +
        '<span class="pill">' + (overallDone + 1) + ' of ' + TOTAL_QUESTIONS + '</span>' +
      '</div>' +
      '<div class="stage-header">' +
        '<div class="stage-badge" style="--stage-color:' + stage.color + '">' + stage.icon + '</div>' +
        '<div><div class="stage-title">' + esc(stage.title) + '</div><div class="stage-sub">' + esc(stage.grade) + '</div></div>' +
      '</div>' +
      '<div class="progress-row" style="--stage-color:' + stage.color + '">' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + ((state.questionIndex) / stage.questions.length * 100) + '%"></div></div>' +
        '<span class="progress-label">Q' + (state.questionIndex + 1) + ' / ' + stage.questions.length + '</span>' +
      '</div>' +
      '<div class="question-card" style="--stage-color:' + stage.color + '">' +
        '<div class="question-text">' + esc(q.q) + '</div>' +
        '<div class="options" id="options-wrap">' + optionsHtml + '</div>' +
        '<div id="explain-slot"></div>' +
        '<div class="next-row" id="next-slot"></div>' +
      '</div>';

    var buttons = document.querySelectorAll("#options-wrap .option");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (state.answered) return;
        var idx = parseInt(btn.getAttribute("data-idx"), 10);
        handleAnswer(idx);
      });
    });
  }

  function handleAnswer(idx) {
    var stage = STAGES[state.stageIndex];
    var q = stage.questions[state.questionIndex];
    state.answered = true;
    state.selected = idx;
    var isCorrect = idx === q.correct;

    state.results.push({ stageIndex: state.stageIndex, questionIndex: state.questionIndex, correct: isCorrect });

    var buttons = document.querySelectorAll("#options-wrap .option");
    buttons.forEach(function (btn, i) {
      btn.setAttribute("disabled", "true");
      if (i === q.correct) btn.classList.add("correct");
      if (i === idx && !isCorrect) btn.classList.add("incorrect");
    });

    document.getElementById("explain-slot").innerHTML =
      '<div class="explain-box"><strong>' + (isCorrect ? "That's right. " : "Not quite. ") + '</strong>' + esc(q.explain) + '</div>';

    var isLastInStage = state.questionIndex === stage.questions.length - 1;
    var isLastOverall = isLastInStage && state.stageIndex === STAGES.length - 1;

    document.getElementById("next-slot").innerHTML =
      '<button class="btn-primary" id="next-btn">' +
      (isLastOverall ? "See the final passport" : (isLastInStage ? "Finish this stop" : "Next question")) +
      '</button>';

    document.getElementById("next-btn").addEventListener("click", function () {
      if (isLastInStage) {
        renderStageComplete();
      } else {
        state.questionIndex += 1;
        renderQuestion();
      }
    });
  }

  // ---------- RENDER: STAGE COMPLETE ----------

  function renderStageComplete() {
    var stage = STAGES[state.stageIndex];
    var results = stageResults(state.stageIndex);
    var correctCount = results.filter(function (r) { return r.correct; }).length;
    var isLastStage = state.stageIndex === STAGES.length - 1;

    var message;
    if (correctCount >= 9) message = "Outstanding! That stop is fully mastered.";
    else if (correctCount >= 7) message = "Great work! A strong grasp of this topic.";
    else if (correctCount >= 5) message = "Good effort — a bit more review here will help.";
    else message = "This topic needs another look before Grade 4 moves on.";

    document.getElementById("app").innerHTML =
      '<div class="topbar">' +
        '<div class="brand"><span class="brand-mark">🧭</span><span class="brand-text">Science Explorer Passport</span></div>' +
      '</div>' +
      '<div class="stamp-wrap">' +
        '<div class="stamp" style="--stage-color:' + stage.color + '">' + stage.icon + '</div>' +
        '<div class="stage-result-title">' + esc(stage.title) + ' — stamped!</div>' +
        '<div class="stage-result-score">' + correctCount + ' out of ' + stage.questions.length + ' correct</div>' +
        '<p style="color:var(--ink-soft); max-width:38ch; margin: 0 auto 26px; line-height:1.5;">' + message + '</p>' +
        '<button class="btn-primary" id="continue-btn">' + (isLastStage ? "Open the final passport" : "Continue to the next stop") + '</button>' +
      '</div>';

    document.getElementById("continue-btn").addEventListener("click", function () {
      if (isLastStage) {
        renderFinal();
      } else {
        state.stageIndex += 1;
        state.questionIndex = 0;
        renderQuestion();
      }
    });
  }

  // ---------- RENDER: FINAL ----------

  var reviewOpen = false;

  function renderFinal() {
    var total = overallCorrect();
    var pct = Math.round((total / TOTAL_QUESTIONS) * 100);

    var badgesHtml = STAGES.map(function (s, i) {
      var res = stageResults(i);
      var correctCount = res.filter(function (r) { return r.correct; }).length;
      var earned = correctCount >= 7;
      return '<div class="mini-badge' + (earned ? '' : ' faded') + '" style="--badge-color:' + s.color + '" title="' + esc(s.title) + '">' + s.icon + '</div>';
    }).join("");

    var stageListHtml = STAGES.map(function (s, i) {
      var res = stageResults(i);
      var correctCount = res.filter(function (r) { return r.correct; }).length;
      return '<div class="stage-row" style="--row-color:' + s.color + '">' +
        '<div class="sr-icon">' + s.icon + '</div>' +
        '<div class="sr-title">' + esc(s.title) + '</div>' +
        '<div class="sr-score">' + correctCount + '/' + s.questions.length + '</div>' +
        '</div>';
    }).join("");

    var missed = [];
    state.results.forEach(function (r) {
      if (!r.correct) {
        var stage = STAGES[r.stageIndex];
        var q = stage.questions[r.questionIndex];
        missed.push({ stage: stage, q: q });
      }
    });

    var reviewHtml = "";
    if (missed.length === 0) {
      reviewHtml = '<p style="text-align:center; color:var(--ink-soft);">No missed questions to review — every answer was correct.</p>';
    } else {
      reviewHtml = missed.map(function (m) {
        return '<div class="review-item">' +
          '<div class="rq">' + m.stage.icon + ' ' + esc(m.q.q) + '</div>' +
          '<div class="ra">Correct answer: <b>' + esc(m.q.opts[m.q.correct]) + '</b> — ' + esc(m.q.explain) + '</div>' +
          '</div>';
      }).join("");
    }

    var greeting = state.name ? esc(state.name) + "'s" : "The explorer's";

    document.getElementById("app").innerHTML =
      '<div class="topbar">' +
        '<div class="brand"><span class="brand-mark">🧭</span><span class="brand-text">Science Explorer Passport</span></div>' +
      '</div>' +
      '<div class="hero" style="padding-bottom:10px;">' +
        '<h1 style="font-size:26px;">' + greeting + ' expedition is complete</h1>' +
      '</div>' +
      '<div class="final-score-card">' +
        '<span class="final-score-num">' + total + '</span><span class="final-score-den"> / ' + TOTAL_QUESTIONS + '</span>' +
        '<div><span class="final-score-pct">' + pct + '% correct</span></div>' +
      '</div>' +
      '<div class="trail-heading">Stamps collected</div>' +
      '<div class="badges-grid">' + badgesHtml + '</div>' +
      '<div class="trail-heading">Results by stop</div>' +
      '<div class="stage-list">' + stageListHtml + '</div>' +
      '<div class="review-toggle"><button id="review-btn">' + (reviewOpen ? "Hide the questions to review" : "Show the questions to review (" + missed.length + ")") + '</button></div>' +
      '<div id="review-slot">' + (reviewOpen ? reviewHtml : "") + '</div>' +
      '<button class="btn-secondary" id="restart-btn" style="margin-top:10px;">Start a new expedition</button>';

    document.getElementById("review-btn").addEventListener("click", function () {
      reviewOpen = !reviewOpen;
      renderFinal();
    });

    document.getElementById("restart-btn").addEventListener("click", function () {
      reviewOpen = false;
      state.stageIndex = 0;
      state.questionIndex = 0;
      state.results = [];
      renderStart();
    });
  }

  renderStart();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opposites Quiz – Grade 1</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4c2;--ink:#1d3557;--blue:#3a86ff;--coral:#ff6b6b;--green:#2bb673;--card:#fff;font-family:Fredoka,"Trebuchet MS","Comic Sans MS",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{padding:16px;display:flex;justify-content:center}
main{width:100%;max-width:560px}
h1{font-size:clamp(2rem,8vw,3rem);margin:8px 0;line-height:1.1;text-align:center}
.screen{display:none}.screen.on{display:block}
.pair{display:flex;border-radius:28px;overflow:hidden;box-shadow:0 6px 0 var(--ink);border:4px solid var(--ink);margin:18px 0}
.pair div{flex:1;padding:28px 8px;text-align:center;font-size:clamp(1.6rem,7vw,2.4rem);font-weight:700;color:#fff}
.pair .l{background:var(--blue)}.pair .r{background:var(--coral)}
p{font-size:1.2rem;text-align:center;margin:8px 0}
button{font:inherit;cursor:pointer;color:var(--ink)}
.big{display:block;width:100%;margin:12px 0;padding:16px;font-size:1.4rem;font-weight:700;background:var(--green);color:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
.big.alt{background:#fff;color:var(--ink)}
.big:active,.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--coral);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:1.1rem}
.bar{height:16px;background:#fff;border:3px solid var(--ink);border-radius:10px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
.q{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:20px 14px;text-align:center;box-shadow:0 6px 0 var(--ink);margin:14px 0}
.q small{font-size:1.1rem}
.q .w{font-size:clamp(2.6rem,13vw,4.2rem);font-weight:700;color:var(--blue);line-height:1.1;margin:6px 0}
.say{background:var(--bg);border:3px solid var(--ink);border-radius:999px;padding:6px 16px;font-size:1rem;font-weight:600}
.opt{display:block;width:100%;margin:10px 0;padding:16px;font-size:1.7rem;font-weight:700;background:#fff;border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink)}
.opt.ok{background:var(--green);color:#fff}
.opt.no{background:var(--coral);color:#fff}
#msg{min-height:2rem;font-size:1.3rem;font-weight:700;text-align:center}
.stars{font-size:3rem;text-align:center;letter-spacing:4px}
.score{font-size:3rem;font-weight:700;text-align:center;margin:0}
.rev{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;margin:12px 0;font-size:1.1rem}
.rev b{color:var(--coral)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>

<section id="start" class="screen on">
  <h1>Opposites Quiz</h1>
  <div class="pair"><div class="l">hot</div><div class="r">cold</div></div>
  <p>Pick the word that means the opposite!</p>
  <button class="big" data-n="10">Quick play: 10 words</button>
  <button class="big alt" data-n="25">25 words</button>
  <button class="big alt" data-n="100">All 100 words</button>
</section>

<section id="play" class="screen">
  <div class="top"><span id="cnt"></span><span id="sc"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div class="q">
    <small>What is the opposite of</small>
    <div class="w" id="word"></div>
    <button class="say" id="say" aria-label="Read the word aloud">🔊 Listen</button>
  </div>
  <div id="opts"></div>
  <div id="msg" aria-live="polite"></div>
</section>

<section id="end" class="screen">
  <h1 id="endt"></h1>
  <div class="stars" id="stars"></div>
  <p class="score" id="final"></p>
  <p id="endmsg"></p>
  <div id="review"></div>
  <button class="big" id="again">Play again</button>
</section>

</main>
<script>
const DATA=`hot:cold,big:small,up:down,melt:freeze,day:night,happy:sad,fast:slow,open:closed,hard:soft,full:empty,old:new,tall:short,wet:dry,clean:dirty,heavy:light,sunny:cloudy,front:back,top:bottom,friend:enemy,on:off,left:right,yes:no,good:bad,dig:bury,hide:seek,first:last,early:late,near:far,inside:outside,above:below,before:after,stop:go,push:pull,give:take,buy:sell,laugh:cry,sit:stand,sleep:wake,win:lose,boy:girl,man:woman,mother:father,brother:sister,king:queen,summer:winter,sun:moon,black:white,north:south,east:west,more:less,many:few,all:none,always:never,true:false,lost:found,easy:hard,rich:poor,strong:weak,loud:quiet,sweet:sour,fat:thin,deep:shallow,high:low,awake:asleep,smooth:rough,sharp:dull,tight:loose,healthy:sick,start:finish,arrive:leave,polite:rude,forward:backward,wide:narrow,float:sink,appear:disappear,build:break,tie:untie,lock:unlock,pass:fail,hello:goodbye,warm:cool,bumpy:flat,brave:scared,neat:messy,giant:tiny,wild:tame,same:different,cheap:expensive,smile:frown,careful:careless,ceiling:floor,hill:valley,land:sea,shout:whisper,pretty:ugly,add:subtract,plus:minus,odd:even,sunrise:sunset`;
const ALL=DATA.split(",").map(s=>{const[a,b]=s.split(":");return{w:a,a:b}});
const ANS=[...new Set(ALL.map(p=>p.a))];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let qs=[],i=0,score=0,wrong=[],locked=false,total=10;

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}

function begin(n){
  total=n;qs=shuffle(ALL).slice(0,n);i=0;score=0;wrong=[];show("play");next();
}
function next(){
  locked=false;$("msg").textContent="";
  const q=qs[i];
  $("cnt").textContent="Word "+(i+1)+" of "+total;
  $("sc").textContent="⭐ "+score;
  $("fill").style.width=(i/total*100)+"%";
  $("word").textContent=q.w;
  const d=shuffle(ANS.filter(x=>x!==q.a&&x!==q.w)).slice(0,2);
  const box=$("opts");box.innerHTML="";
  shuffle([q.a,...d]).forEach(t=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>pick(b,t,q);box.appendChild(b);
  });
}
function pick(btn,t,q){
  if(locked)return;locked=true;
  const good=t===q.a;
  if(good){score++;btn.classList.add("ok");$("msg").textContent=["Great job! 🎉","Super! 🌟","You got it! 👏","Yay! 🥳"][Math.floor(Math.random()*4)]}
  else{btn.classList.add("no");wrong.push(q);$("msg").textContent="Good try! The answer is "+q.a+".";
    [...$("opts").children].forEach(o=>{if(o.textContent===q.a)o.classList.add("ok")})}
  $("sc").textContent="⭐ "+score;
  setTimeout(()=>{i++;i<total?next():finish()},good?900:1800);
}
function finish(){
  const pct=score/total;
  $("endt").textContent=pct>=.9?"Amazing!":pct>=.6?"Well done!":"Keep practising!";
  $("stars").textContent="⭐".repeat(pct>=.9?3:pct>=.6?2:1);
  $("final").textContent=score+" / "+total;
  $("endmsg").textContent=wrong.length?"Let's look at the ones to remember:":"You got every word right!";
  $("review").innerHTML=wrong.map(q=>'<div class="rev">'+q.w+' → <b>'+q.a+'</b></div>').join("");
  show("end");
}
document.querySelectorAll("#start .big").forEach(b=>b.onclick=()=>begin(+b.dataset.n));
$("again").onclick=()=>show("start");
$("say").onclick=()=>{try{const u=new SpeechSynthesisUtterance($("word").textContent);u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}};
</script>
</body>
</html>

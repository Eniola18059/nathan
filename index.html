<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mental Math for Multiplication Quiz</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#667085;--brand:#4f46e5;--brand-d:#3730a3;--ok:#16a34a;--okbg:#e8f8ee;--bad:#dc2626;--badbg:#fdecec;--line:#e3e7f0}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
  .app{width:100%;max-width:640px}
  header{text-align:center;margin-bottom:16px}
  header h1{margin:0;font-size:1.45rem}
  header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
  .card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(30,40,80,.08)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
  .bar>div{height:100%;width:0;background:var(--brand);transition:width .3s}
  .meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:16px}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:#eef0ff;color:var(--brand-d);padding:3px 9px;border-radius:99px;margin-bottom:10px}
  .q{font-size:1.4rem;font-weight:700;line-height:1.4;margin:0 0 18px}
  .opts{display:grid;gap:10px}
  .opt{font:inherit;font-size:1.1rem;text-align:left;padding:14px 16px;border:2px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;display:flex;gap:12px;align-items:center;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--brand);background:#f7f7ff}
  .opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:700}
  .opt.ok{border-color:var(--ok);background:var(--okbg)}
  .opt.ok .l{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:var(--badbg)}
  .opt.bad .l{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .fb{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:.98rem;line-height:1.5;display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--okbg);color:#14532d}
  .fb.bad{background:var(--badbg);color:#7f1d1d}
  .btn{font:inherit;font-weight:700;border:0;background:var(--brand);color:#fff;padding:13px 22px;border-radius:12px;cursor:pointer;font-size:1rem}
  .btn:hover{background:var(--brand-d)}
  .btn.alt{background:#eef0ff;color:var(--brand-d)}
  .nav{margin-top:16px;display:none;text-align:right}
  .nav.show{display:block}
  .center{text-align:center}
  .big{font-size:3rem;font-weight:800;color:var(--brand);margin:6px 0}
  .review{text-align:left;margin-top:18px}
  .review h3{margin:0 0 8px;font-size:1rem}
  .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.95rem}
  .item b{color:var(--ok)}
  .item span{color:var(--bad)}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Mental Math for Multiplication</h1>
    <p>Chapter 4 &middot; Exercise 1 &middot; 50 questions</p>
  </header>
  <div class="card" id="card"></div>
</div>

<script>
const fmt = n => n.toLocaleString('en-US');

/* Q(tag, question, numeric answer, wrong options, explanation)
   The correct answer is computed from the expression, so it cannot be mistyped. */
function Q(tag, q, c, d, x){ return {tag, q, c, a: fmt(c), d, x}; }

const BANK = [
  /* ---------- Textbook Exercise 1 ---------- */
  Q('Book 1(a)', '12 × 3 = 30 + 6 = ?', 12*3, ['306','63','33'], '12 = 10 + 2. So 10 × 3 = 30 and 2 × 3 = 6. Add them: 30 + 6 = 36.'),
  Q('Book 1(b)', '12 hundreds × 3 = ? hundreds', 12*3, ['15','306','3,600'], '12 × 3 = 36, so 12 hundreds × 3 = 36 hundreds.'),
  Q('Book 1(b)', '12 hundreds × 3 = 36 hundreds = ?', 1200*3, ['360','36,000','3,060'], '36 hundreds means 36 × 100 = 3,600.'),
  Q('Book 1(c)', '12 thousands × 3 = ? thousands', 12*3, ['15','306','360'], '12 × 3 = 36, so 12 thousands × 3 = 36 thousands.'),
  Q('Book 1(c)', '12 thousands × 3 = 36 thousands = ?', 12000*3, ['3,600','360,000','30,600'], '36 thousands means 36 × 1,000 = 36,000.'),

  Q('Book 2(a)', '35 × 4 = ? + 20.  What number goes in the first box? (35 = 30 + 5)', 30*4, ['12','1,200','140'], '30 × 4 = 120, and 5 × 4 = 20. So 35 × 4 = 120 + 20.'),
  Q('Book 2(a)', '35 × 4 = 120 + 20 = ?', 35*4, ['32','120','1,400'], '120 + 20 = 140.'),
  Q('Book 2(b)', '350 × 4 = ?', 350*4, ['140','14,000','1,200'], '35 × 4 = 140. 350 is 10 times bigger than 35, so the answer is 1,400.'),
  Q('Book 2(c)', '3,500 × 4 = ?', 3500*4, ['1,400','140,000','12,000'], '35 × 4 = 140. 3,500 is 100 times bigger than 35, so the answer is 14,000.'),
  Q('Book 2(d)', '35,000 × 4 = ?', 35000*4, ['14,000','1,400,000','120,000'], '35 × 4 = 140. 35,000 is 1,000 times bigger than 35, so the answer is 140,000.'),

  Q('Book 3(a)', '100 × 7 = ?', 100*7, ['70','7,000','707'], '1 hundred × 7 = 7 hundreds = 700.'),
  Q('Book 3(a)', '99 × 7 = ?  (Hint: use 100 × 7)', 99*7, ['703','699','6,930'], '99 is 1 less than 100. 700 − 7 = 693 (take away one 7, not one 1).'),
  Q('Book 3(b)', '200 × 7 = ?', 200*7, ['140','14,000','1,207'], '2 hundreds × 7 = 14 hundreds = 1,400.'),
  Q('Book 3(b)', '199 × 7 = ?  (Hint: use 200 × 7)', 199*7, ['1,407','1,399','13,930'], '199 is 1 less than 200. 1,400 − 7 = 1,393.'),
  Q('Book 3(c)', '300 × 7 = ?', 300*7, ['210','21,000','2,107'], '3 hundreds × 7 = 21 hundreds = 2,100.'),
  Q('Book 3(c)', '299 × 7 = ?  (Hint: use 300 × 7)', 299*7, ['2,107','2,099','20,930'], '299 is 1 less than 300. 2,100 − 7 = 2,093.'),
  Q('Book 3(d)', '3,000 × 7 = ?', 3000*7, ['2,100','210,000','3,007'], '3 thousands × 7 = 21 thousands = 21,000.'),
  Q('Book 3(d)', '2,999 × 7 = ?  (Hint: use 3,000 × 7)', 2999*7, ['21,007','20,999','209,930'], '2,999 is 1 less than 3,000. 21,000 − 7 = 20,993.'),

  Q('Book 4(a)', '100 × 6 = ?', 100*6, ['60','6,000','106'], '1 hundred × 6 = 6 hundreds = 600.'),
  Q('Book 4(b)', '150 × 9 = ?', 150*9, ['135','13,500','1,450'], '15 × 9 = 135, then multiply by 10: 1,350.'),
  Q('Book 4(c)', '40,000 × 8 = ?', 40000*8, ['32,000','3,200,000','3,200'], '4 × 8 = 32. 4 ten-thousands × 8 = 32 ten-thousands = 320,000.'),
  Q('Book 4(d)', '1,300 × 5 = ?', 1300*5, ['650','65,000','5,300'], '1,000 × 5 = 5,000 and 300 × 5 = 1,500. 5,000 + 1,500 = 6,500.'),
  Q('Book 4(e)', '2,500 × 4 = ?', 2500*4, ['1,000','100,000','8,200'], '2,000 × 4 = 8,000 and 500 × 4 = 2,000. 8,000 + 2,000 = 10,000.'),
  Q('Book 4(f)', '910 × 2 = ?', 910*2, ['182','18,200','1,802'], '900 × 2 = 1,800 and 10 × 2 = 20. 1,800 + 20 = 1,820.'),
  Q('Book 4(g)', '15,000 × 3 = ?', 15000*3, ['4,500','450,000','30,500'], '10,000 × 3 = 30,000 and 5,000 × 3 = 15,000. 30,000 + 15,000 = 45,000.'),
  Q('Book 4(h)', '7,200 × 8 = ?', 7200*8, ['5,760','576,000','56,160'], '7,000 × 8 = 56,000 and 200 × 8 = 1,600. 56,000 + 1,600 = 57,600.'),
  Q('Book 4(i)', '5 × 42,000 = ?', 5*42000, ['21,000','2,100,000','201,000'], '5 × 40,000 = 200,000 and 5 × 2,000 = 10,000. 200,000 + 10,000 = 210,000.'),
  Q('Book 4(j)', '7 × 3,300 = ?', 7*3300, ['2,310','231,000','21,210'], '7 × 3,000 = 21,000 and 7 × 300 = 2,100. 21,000 + 2,100 = 23,100.'),
  Q('Book 4(k)', '98 × 6 = ?  (Hint: think 100 × 6)', 98*6, ['598','578','5,880'], '100 × 6 = 600. 98 is 2 less than 100, so take away 2 × 6 = 12. 600 − 12 = 588.'),
  Q('Book 4(l)', '5 × 399 = ?  (Hint: think 5 × 400)', 5*399, ['2,005','1,895','19,950'], '5 × 400 = 2,000. 399 is 1 less than 400, so take away 5. 2,000 − 5 = 1,995.'),
  Q('Book 4(m)', '3 × 599 = ?  (Hint: think 3 × 600)', 3*599, ['1,803','1,497','17,970'], '3 × 600 = 1,800. 599 is 1 less than 600, so take away 3. 1,800 − 3 = 1,797.'),
  Q('Book 4(n)', '6,999 × 4 = ?  (Hint: think 7,000 × 4)', 6999*4, ['28,004','27,096','279,960'], '7,000 × 4 = 28,000. 6,999 is 1 less than 7,000, so take away 4. 28,000 − 4 = 27,996.'),

  Q('Book 5', 'A 24-foot-wide greenhouse frame costs $4,999. A farm wants to buy 5 of them. What is the total cost in dollars?', 4999*5, ['25,005','24,005','249,950'], '5 × $5,000 = $25,000. Each frame is $1 less, so take away 5 × $1 = $5. $25,000 − $5 = $24,995.'),
  Q('Book 6', 'The pediatric clinic needs 250 bandages a week and the central clinic needs 600 bandages a week. How many bandages should the two clinics order for 8 weeks?', (250+600)*8, ['2,000','4,800','850'], 'Together they need 250 + 600 = 850 a week. 850 × 8 = 6,800.'),

  /* ---------- Extra practice (same skills) ---------- */
  Q('Extra', '14 × 3 = ?', 14*3, ['12','32','420'], '10 × 3 = 30 and 4 × 3 = 12. 30 + 12 = 42.'),
  Q('Extra', '120 × 4 = ?', 120*4, ['48','4,800','440'], '12 × 4 = 48. 120 is 10 times bigger than 12, so the answer is 480.'),
  Q('Extra', '13 thousands × 5 = ?', 13000*5, ['6,500','650,000','18,000'], '13 × 5 = 65, so 13 thousands × 5 = 65 thousands = 65,000.'),
  Q('Extra', '45 × 6 = ?', 45*6, ['240','2,700','260'], '40 × 6 = 240 and 5 × 6 = 30. 240 + 30 = 270.'),
  Q('Extra', '4,500 × 6 = ?', 4500*6, ['2,700','270,000','24,000'], '45 × 6 = 270. 4,500 is 100 times bigger than 45, so the answer is 27,000.'),
  Q('Extra', '98 × 5 = ?  (Hint: think 100 × 5)', 98*5, ['495','510','4,900'], '100 × 5 = 500. 98 is 2 less than 100, so take away 2 × 5 = 10. 500 − 10 = 490.'),
  Q('Extra', '199 × 4 = ?  (Hint: think 200 × 4)', 199*4, ['804','7,960','896'], '200 × 4 = 800. Take away one 4. 800 − 4 = 796.'),
  Q('Extra', '4,999 × 3 = ?', 4999*3, ['15,003','12,997','149,970'], '5,000 × 3 = 15,000. Take away 3 × 1 = 3. 15,000 − 3 = 14,997.'),
  Q('Extra', '600 × 8 = ?', 600*8, ['480','48,000','4,080'], '6 hundreds × 8 = 48 hundreds = 4,800.'),
  Q('Extra', '8 × 2,500 = ?', 8*2500, ['2,000','200,000','16,400'], '8 × 2,000 = 16,000 and 8 × 500 = 4,000. 16,000 + 4,000 = 20,000.'),
  Q('Extra', '6,000 × 7 = ?', 6000*7, ['4,200','420,000','36,000'], '6 × 7 = 42. 6 thousands × 7 = 42 thousands = 42,000.'),
  Q('Extra', '17 × 4 = ?', 17*4, ['58','48','680'], '10 × 4 = 40 and 7 × 4 = 28. 40 + 28 = 68.'),
  Q('Extra', 'A bakery bakes 300 loaves of bread every day. How many loaves does it bake in 7 days?', 300*7, ['210','21,000','2,400'], '3 hundreds × 7 = 21 hundreds = 2,100.'),
  Q('Extra', 'A cinema ticket costs $99. How much do 6 tickets cost in dollars?', 99*6, ['606','5,940','584'], '100 × 6 = 600. Each ticket is $1 less, so take away 6 × 1 = 6. 600 − 6 = 594.'),
  Q('Extra', 'A truck carries 3,500 kg of sand on each trip. How many kg does it carry in 4 trips?', 3500*4, ['1,400','140,000','12,000'], '35 × 4 = 140. 3,500 is 100 times bigger than 35, so the answer is 14,000.'),
  Q('Extra', '2,998 × 5 = ?  (Hint: think 3,000 × 5)', 2998*5, ['15,010','14,900','149,900'], '3,000 × 5 = 15,000. 2,998 is 2 less than 3,000, so take away 2 × 5 = 10. 15,000 − 10 = 14,990.')
];

/* ---------- Quiz engine ---------- */
const card = document.getElementById('card');
let order, idx, score, missed;
const L = ['A','B','C','D'];

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function start(){
  order = BANK.slice();            // textbook questions first, then extras (as in the workbook order)
  idx = 0; score = 0; missed = [];
  show();
}

function show(){
  const q = order[idx];
  const opts = shuffle([q.a, ...q.d]);
  card.innerHTML = `
    <div class="bar"><div style="width:${(idx/order.length)*100}%"></div></div>
    <div class="meta"><span>Question ${idx+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <span class="tag">${q.tag}</span>
    <p class="q">${q.q}</p>
    <div class="opts">
      ${opts.map((o,i)=>`<button class="opt" data-v="${o}"><span class="l">${L[i]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <div class="nav" id="nav"><button class="btn" id="next">${idx===order.length-1?'See results':'Next question'}</button></div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,q));
  document.getElementById('next').onclick=()=>{ idx++; idx<order.length?show():finish(); };
}

function pick(btn,q){
  const chosen = btn.dataset.v, right = chosen===q.a;
  card.querySelectorAll('.opt').forEach(b=>{
    b.disabled = true;
    if(b.dataset.v===q.a) b.classList.add('ok');
  });
  if(!right) btn.classList.add('bad');
  if(right) score++; else missed.push({q:q.q, yours:chosen, a:q.a, x:q.x});
  const fb = document.getElementById('fb');
  fb.className = 'fb show ' + (right?'ok':'bad');
  fb.innerHTML = (right?'<b>Correct!</b> ':'<b>Not quite.</b> The answer is '+q.a+'. ') + q.x;
  document.getElementById('nav').classList.add('show');
}

function finish(){
  const pct = Math.round(score/order.length*100);
  const msg = pct>=90?'Outstanding mental maths!':pct>=70?'Great work!':pct>=50?'Good effort. Keep practising!':'Keep going. Review the tricks below and try again.';
  card.innerHTML = `
    <div class="center">
      <div class="bar"><div style="width:100%"></div></div>
      <h2 style="margin:8px 0 0">Quiz complete</h2>
      <div class="big">${score} / ${order.length}</div>
      <p style="margin:0;color:var(--muted)">${pct}% &middot; ${msg}</p>
      <div class="row">
        <button class="btn" id="again">Try again</button>
        ${missed.length?'<button class="btn alt" id="retryMissed">Retry missed only</button>':''}
      </div>
    </div>
    ${missed.length?`<div class="review"><h3>Questions to review (${missed.length})</h3>
      ${missed.map(m=>`<div class="item"><div>${m.q}</div><div>You chose <span>${m.yours}</span> &middot; Correct: <b>${m.a}</b></div><div style="color:var(--muted);margin-top:4px">${m.x}</div></div>`).join('')}</div>`:''}`;
  document.getElementById('again').onclick = start;
  const r = document.getElementById('retryMissed');
  if(r) r.onclick = () => {
    const keep = new Set(missed.map(m=>m.q));
    order = BANK.filter(b=>keep.has(b.q)); idx=0; score=0; missed=[]; show();
  };
}

start();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numbers to One Million – Grade 4 Quiz</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#1d1b3a;--mute:#6b6a85;--pri:#5b3df5;--ok:#12a150;--okbg:#e3f7ea;--bad:#d63a3a;--badbg:#fde8e8;--line:#e2dff5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#1f1c3d;--ink:#f0eeff;--mute:#a8a5cc;--pri:#8c7bff;--ok:#4ade80;--okbg:#14352250;--bad:#ff7b7b;--badbg:#3d1c1c80;--line:#34305f}}
:root[data-theme="dark"]{--bg:#14122b;--card:#1f1c3d;--ink:#f0eeff;--mute:#a8a5cc;--pri:#8c7bff;--ok:#4ade80;--okbg:#14352250;--bad:#ff7b7b;--badbg:#3d1c1c80;--line:#34305f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.6rem;margin:8px 0 4px}h2{font-size:1.15rem;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
button{font:inherit;cursor:pointer;color:inherit}
.t{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left}
.t:hover{border-color:var(--pri)}.t b{display:block}.t span{color:var(--mute);font-size:.85rem}
.t.all{background:var(--pri);color:#fff;border-color:var(--pri)}.t.all span{color:#e6e1ff}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 16px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.tag{display:inline-block;background:var(--line);border-radius:99px;padding:2px 10px;font-size:.78rem;margin-bottom:10px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 16px}
.opts{display:grid;gap:10px}
.o{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:13px 14px;text-align:left;font-size:1.02rem}
.o:hover:not(:disabled){border-color:var(--pri)}
.o.ok{border-color:var(--ok);background:var(--okbg)}.o.bad{border-color:var(--bad);background:var(--badbg)}
.o:disabled{cursor:default}
.fb{margin-top:14px;font-weight:600}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;margin-top:14px}
.btn.ghost{background:transparent;color:var(--pri);border:2px solid var(--pri);margin-left:8px}
.score{font-size:3rem;font-weight:800;color:var(--pri);margin:0}
.miss{border-top:1px solid var(--line);padding:10px 0;font-size:.95rem}.miss small{color:var(--mute);display:block}
label{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--mute)}
.hide{display:none}
</style></head><body><main>
<div id="home">
<h1>🔢 Numbers to One Million</h1>
<p class="sub">Grade 4 · Dimensions Math 4A · Chapter 1 — 100 questions</p>
<div class="card"><h2>Choose a topic</h2><div class="topics" id="topics"></div>
<label><input type="checkbox" id="shuf"> Shuffle question order</label></div>
</div>
<div id="quiz" class="hide">
<div class="meta"><span id="qn"></span><span id="sc"></span></div>
<div class="bar"><i id="pb"></i></div>
<div class="card"><span class="tag" id="tg"></span><p class="q" id="qt"></p><div class="opts" id="op"></div><div class="fb" id="fb"></div>
<button class="btn hide" id="nx">Next →</button></div>
</div>
<div id="end" class="hide">
<div class="card" style="text-align:center"><p class="score" id="fs"></p><h2 id="fm"></h2>
<button class="btn" id="rm">Retry missed</button><button class="btn ghost" id="hm">Home</button></div>
<div class="card hide" id="mc"><h2>Review your misses</h2><div id="ml"></div></div>
</div>
</main>
<script>
const D={
"Place Value":[
["In 85,794, what is the digit in the ten thousands place?","8","5","7","4"],
["In 85,794, the digit 5 stands for…","5,000","500","50,000","50"],
["What is the value of the first digit 6 in 64,564?","60,000","6,000","600","600,000"],

["What is the value of the digit 3 in 384,802?","300,000","30,000","3,000","3"],
["In 494,428, the first digit 9 is in which place?","Ten thousands","Thousands","Hundred thousands","Hundreds"],
["What is the value of the digit in the hundred thousands place of 698,365?","600,000","60,000","6,000","900,000"],

["60,000 = ___ ten thousands","6","60","600","6,000"],

["200,000 = ___ ten thousands","20","2","200","2,000"],

"Expanded Form & Words":[
["80,000 + 7,000 + 100 + 40 + 3 = ?","87,143","87,134","80,743","78,143"],
["60,437 = 60,000 + ___ + 30 + 7","400","4,000","40","4"],
["14,092 = 10,000 + ___ + 92","4,000","400","40,000","4"],
["90,620 = 600 + ___ + 20","90,000","9,000","900","60,000"],

["62,500 = ___ + 2,000 + 60,000","500","50","5,000","5"],
["Write in numerals: forty-seven thousand, six hundred ninety-eight","47,698","47,968","40,798","47,689"],
["Write in numerals: eighty thousand, nine","80,009","80,090","8,009","80,900"],
["Write 20,640 in words.","Twenty thousand, six hundred forty","Two thousand, six hundred forty","Twenty thousand, sixty-four","Twenty thousand, six hundred four"],
["Write 55,008 in words.","Fifty-five thousand, eight","Fifty-five thousand, eighty","Fifty-five thousand, eight hundred","Five thousand, five hundred eight"],
["600,000 + 90,000 + 8,000 + 300 + 60 + 5 = ?","698,365","689,365","698,356","608,365"],
["Write 698,365 in words.","Six hundred ninety-eight thousand, three hundred sixty-five","Six hundred eighty-nine thousand, three hundred sixty-five","Sixty-nine thousand, eight hundred thirty-six","Six hundred ninety-eight thousand, three hundred fifty-six"],
["604,085 = ___ + 4,000 + 80 + 5","600,000","60,000","6,000","604,000"],
["Write in numerals: seven hundred twenty-three thousand, one","723,001","723,100","723,010","700,231"]],

["9 ten thousands + 24 tens = ?","90,240","92,400","9,240","90,024"],
["800 hundreds + 60 hundreds + 50 tens = ?","86,500","85,600","86,050","80,650"],
["640 tens + 20 thousands = ?","26,400","20,640","26,040","62,400"],
["92 ones + 4,800 tens = ?","48,092","48,920","4,892","49,200"],
["9,860 hundreds = ?","986,000","98,600","9,860","96,800"],
["8 ones + 12,000 tens = ?","120,008","12,008","120,080","128,000"],
["ten hundred thousands = ?","1,000,000","100,000","10,000","10,000,000"]],
"Number Patterns":[
["Count on by ten thousand: 97,376 → ?","107,376","98,376","97,476","187,376"],
["Count back by one hundred: 333,333 → ?","333,233","333,323","332,333","333,133"],
["Count on by one thousand: 208,997 → ?","209,997","208,998","218,997","209,097"],
["1,000 more than 62,584 is…","63,584","62,684","72,584","62,594"],
["10,000 less than 86,584 is…","76,584","85,584","86,484","86,574"],
["10 less than 26,009 is…","25,999","25,909","26,000","25,099"],
["81,096 − 100 = ?","80,996","81,086","80,096","71,096"],
["179,992 + 10 = ?","180,002","180,092","179,102","189,992"],
["99,999 + 100 = ?","100,099","100,000","99,199","109,999"],
["999,999 + 1 = ?","1,000,000","999,990","1,000,001","100,000"],
["Next number: 187,174; 188,173; 189,172; ?","190,171","190,173","191,171","189,173"],
["Next number: 51,146; 62,136; 73,126; ?","84,116","84,136","83,116","95,106"]],
"Comparing & Ordering":[
["82,262 ◯ 82,623","<",">","="],
["918,532 ◯ 981,352","<",">","="],
["672,365 ◯ 672,369","<",">","="],
["Which number is greater?","636,924","636,748","They are equal","Cannot tell"],
["Least to greatest: 45,800 · 56,500 · 65,500 · 36,500 · 56,600","36,500, 45,800, 56,500, 56,600, 65,500","36,500, 45,800, 56,600, 56,500, 65,500","65,500, 56,600, 56,500, 45,800, 36,500","45,800, 36,500, 56,500, 56,600, 65,500"],
["Least to greatest: 792,793 · 797,913 · 983,713 · 792,739 · 797,193","792,739, 792,793, 797,193, 797,913, 983,713","792,793, 792,739, 797,193, 797,913, 983,713","792,739, 792,793, 797,913, 797,193, 983,713","983,713, 797,913, 797,193, 792,793, 792,739"],
["Which number is greater than 55,000?","55,739","54,393","45,993","7,713"],
["Greatest 6-digit number using 2, 4, 9, 6, 8, 7 once each?","987,642","246,789","987,624","789,642"],
["Least 6-digit EVEN number using 2, 4, 9, 6, 8, 7 once each?","246,798","246,789","246,978","247,896"],
["Greatest 6-digit ODD number using 2, 4, 9, 6, 8, 7 once each?","986,427","987,642","986,247","986,724"],
["34,009 + 40 ◯ 8,000 + 4 + 20,000",">","<","="],
["90,000 + 60 + 4,200 ◯ 300 + 94,000 + 20","<",">","="],
["300 thousands + 70 hundreds ◯ 7,000 tens + 30 ten thousands","<",">","="],
["89,000 − 100 ◯ 9,000 × 9",">","<","="]],
"Rounding":[
["Round 66,630 to the nearest ten thousand.","70,000","60,000","67,000","66,000"],
["Round 75,000 to the nearest ten thousand.","80,000","70,000","75,000","90,000"],

["Round 10,025 to the nearest hundred.","10,000","10,100","10,030","10,020"],

["Round 16,501 to the nearest ten thousand.","20,000","10,000","17,000","16,000"],
["Round 24,499 to the nearest ten thousand.","20,000","30,000","24,000","25,000"],
["Round 26,460 to the nearest thousand.","26,000","27,000","26,500","30,000"],
["Round 36,070 to the nearest hundred.","36,100","36,000","36,070","36,200"],

["Round 350,000 to the nearest hundred thousand.","400,000","300,000","350,000","500,000"],
["Round 950,749 to the nearest hundred thousand.","1,000,000","900,000","950,000","951,000"],
["Round 950,749 to the nearest ten thousand.","950,000","960,000","951,000","1,000,000"],
["Round 950,749 to the nearest thousand.","951,000","950,000","950,700","950,500"],
["Round 950,749 to the nearest hundred.","950,700","950,800","951,000","950,750"],
["Round 142,984 to the nearest hundred.","143,000","142,900","142,000","143,100"]],
"Mental Math":[
["35,000 + 9,000 = ?","44,000","4,400","440,000","34,000"],
["89 hundreds − 24 hundreds = ?","65 hundreds","55 hundreds","650 hundreds","113 hundreds"],

["150,000 ÷ 5 = ?","30,000","3,000","300,000","145,000"]],

["A house costs 6 times as much as a car. The car costs $40,000. How much is the house?","$240,000","$46,000","$24,000","$2,400,000"],
["A number is 32,000 less than the quotient of 560,000 ÷ 7. What is the number?","48,000","80,000","208,000","528,000"],
["What is the least whole number that rounds to 230,000 to the nearest ten thousand?","225,000","220,000","229,999","230,000"],
["What is the greatest whole number that rounds to 230,000 to the nearest ten thousand?","234,999","235,000","239,999","230,000"],
["Mystery 5-digit number: all digits different; thousands digit is 7 more than the tens digit; hundreds digit = thousands digit + ones digit; digits add to 24.","67,902","84,723","24,789","76,902"],
["Mystery 6-digit number: only two digits are the same; tens digit is 9 more than thousands digit; it is odd; ones digit is 5 more than hundred thousands digit; digits add to 34.","450,799","450,797","540,799","450,979"],
["Clues: digit sum is more than 20; more than 2,000 tens; fewer than 450 hundreds. Which number?","40,674","38,041","26,903","15,987"],
["5,000 nails in five boxes. Boxes 1+2 = 2,700; 2+3 = 2,000; 3+4 = 1,800; 4+5 = 1,700. How many nails are in box 5?","500","600","1,200","1,300"],
["Four blocks in a row: red is right of blue but not beside it; green is not next to blue; yellow is next to red. Order from left to right?","Blue, Yellow, Red, Green","Blue, Red, Yellow, Green","Blue, Green, Red, Yellow","Yellow, Blue, Red, Green"],
["Least number that rounds to 500,000 to the nearest thousand, ten thousand AND hundred thousand?","499,500","450,000","495,000","499,000"]]
};
const $=id=>document.getElementById(id);
const all=[];Object.entries(D).forEach(([t,a])=>a.forEach(r=>all.push({t,q:r[0],a:r[1],o:r.slice(1)})));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let L=[],i=0,s=0,miss=[];
const show=id=>["home","quiz","end"].forEach(x=>$(x).classList.toggle("hide",x!==id));
function mk(label,sub,cls,fn){const b=document.createElement("button");b.className="t "+cls;b.innerHTML="<b></b><span></span>";b.firstChild.textContent=label;b.lastChild.textContent=sub;b.onclick=fn;$("topics").appendChild(b)}
mk("All topics","100 questions","all",()=>start(all));
Object.keys(D).forEach(t=>mk(t,D[t].length+" questions","",()=>start(all.filter(x=>x.t===t))));
function start(list){L=$("shuf").checked?sh(list):list.slice();i=0;s=0;miss=[];show("quiz");render()}
function render(){const x=L[i];$("qn").textContent="Question "+(i+1)+" of "+L.length;$("sc").textContent="Score: "+s;$("pb").style.width=(i/L.length*100)+"%";
$("tg").textContent=x.t;$("qt").textContent=x.q;$("fb").textContent="";$("nx").classList.add("hide");
$("nx").textContent=i===L.length-1?"See results":"Next →";const op=$("op");op.innerHTML="";
sh(x.o).forEach(v=>{const b=document.createElement("button");b.className="o";b.textContent=v;b.onclick=()=>pick(b,v);op.appendChild(b)})}
function pick(b,v){const x=L[i],ok=v===x.a;[...$("op").children].forEach(c=>{c.disabled=true;if(c.textContent===x.a)c.classList.add("ok")});
if(ok){s++;$("fb").textContent="✅ Correct!"}else{b.classList.add("bad");miss.push(x);$("fb").textContent="❌ The answer is "+x.a}
$("sc").textContent="Score: "+s;$("nx").classList.remove("hide")}
$("nx").onclick=()=>{i++;i<L.length?render():finish()};
function finish(){show("end");const p=Math.round(s/L.length*100);$("fs").textContent=s+" / "+L.length;
$("fm").textContent=p>=90?"🌟 Outstanding!":p>=70?"👏 Great work!":p>=50?"👍 Good effort — keep practising!":"💪 Keep going — review and try again!";
$("rm").classList.toggle("hide",!miss.length);$("mc").classList.toggle("hide",!miss.length);
$("ml").innerHTML="";miss.forEach(x=>{const d=document.createElement("div");d.className="miss";d.textContent=x.q;const m=document.createElement("small");m.textContent="Answer: "+x.a;d.appendChild(m);$("ml").appendChild(d)})}
$("rm").onclick=()=>{L=sh(miss);i=0;s=0;miss=[];show("quiz");render()};
$("hm").onclick=()=>show("home");
</script></body></html>

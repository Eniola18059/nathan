<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estimating and Multiplying Quiz</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#667085;--brand:#4f46e5;--brand-d:#3730a3;--ok:#16a34a;--okbg:#e8f8ee;--bad:#dc2626;--badbg:#fdecec;--line:#e3e7f0}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
  .app{width:100%;max-width:640px}
  header{text-align:center;margin-bottom:16px}
  header h1{margin:0;font-size:1.45rem}
  header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
  .card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(30,40,80,.08)}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px}
  .bar>div{height:100%;width:0;background:var(--brand);transition:width .3s}
  .meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:16px}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:#eef0ff;color:var(--brand-d);padding:3px 9px;border-radius:99px;margin-bottom:10px}
  .q{font-size:1.4rem;font-weight:700;line-height:1.4;margin:0 0 18px}
  .opts{display:grid;gap:10px}
  .opt{font:inherit;font-size:1.1rem;text-align:left;padding:14px 16px;border:2px solid var(--line);background:#fff;border-radius:12px;cursor:pointer;display:flex;gap:12px;align-items:center;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--brand);background:#f7f7ff}
  .opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:700}
  .opt.ok{border-color:var(--ok);background:var(--okbg)}
  .opt.ok .l{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:var(--badbg)}
  .opt.bad .l{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .fb{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:.98rem;line-height:1.5;display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--okbg);color:#14532d}
  .fb.bad{background:var(--badbg);color:#7f1d1d}
  .btn{font:inherit;font-weight:700;border:0;background:var(--brand);color:#fff;padding:13px 22px;border-radius:12px;cursor:pointer;font-size:1rem}
  .btn:hover{background:var(--brand-d)}
  .btn.alt{background:#eef0ff;color:var(--brand-d)}
  .nav{margin-top:16px;display:none;text-align:right}
  .nav.show{display:block}
  .center{text-align:center}
  .big{font-size:3rem;font-weight:800;color:var(--brand);margin:6px 0}
  .review{text-align:left;margin-top:18px}
  .review h3{margin:0 0 8px;font-size:1rem}
  .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.95rem}
  .item b{color:var(--ok)}
  .item span{color:var(--bad)}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Multiplying by a 1-Digit Number</h1>
    <p>Chapter 4 &middot; Exercise 2 &middot; 50 questions</p>
  </header>
  <div class="card" id="card"></div>
</div>

<script>
const fmt = n => n.toLocaleString('en-US');

/* Q(tag, question, numeric answer, wrong options, explanation)
   The correct answer is computed from the expression, so it cannot be mistyped. */
function Q(tag, q, c, d, x){ return {tag, q, c, a: typeof c==="number" ? fmt(c) : c, d, x}; }

const BANK = [
  /* ---------- Textbook Exercise 2 ---------- */
  Q('Book 1(a)', 'Estimate the product of 5,172 and 4 by replacing 5,172 with 5,000. 5,000 × 4 = ?', 5000*4, ['2,000','200,000','16,000'], '5 thousands × 4 = 20 thousands = 20,000.'),
  Q('Book 1(a)', 'Estimate the product of 5,172 and 4 by replacing 5,172 with 5,200. 5,200 × 4 = ?', 5200*4, ['2,080','20,200','208,000'], '52 hundreds × 4 = 208 hundreds = 20,800.'),
  Q('Book 1(b)', '5,172 × 4: what is 7 tens × 4?', '28 tens', ['11 tens','21 tens','74 tens'], '7 × 4 = 28, so 7 tens × 4 = 28 tens (which is 2 hundreds and 8 tens).'),
  Q('Book 1(b)', 'In 5,172 × 4, 7 tens × 4 = 28 tens. How many hundreds are regrouped and added to the hundreds column?', '2 hundreds', ['8 hundreds','4 hundreds','1 hundred'], '28 tens = 2 hundreds + 8 tens. Write 8 in the tens place and carry the 2 hundreds.'),
  Q('Book 1(b)', 'Use the vertical method to find 5,172 × 4.', 5172*4, ['20,488','20,628','21,688'], '2 × 4 = 8. 7 × 4 = 28, write 8, carry 2. 1 × 4 = 4, plus 2 = 6. 5 × 4 = 20. So the product is 20,688.'),
  Q('Book 1(c)', 'The actual product of 5,172 × 4 is 20,688. Which estimate was lower than the actual product?', '5,000 × 4 = 20,000', ['5,200 × 4 = 20,800','Both estimates are lower','Neither, both are equal'], '20,000 is less than 20,688, so the estimate using 5,000 was lower. 20,800 is higher.'),
  Q('Book 1(c)', 'The actual product of 5,172 × 4 is 20,688. Which estimate was higher than the actual product?', '5,200 × 4 = 20,800', ['5,000 × 4 = 20,000','Both estimates are higher','Neither, both are equal'], '20,800 is greater than 20,688, so the estimate using 5,200 was higher.'),
  Q('Book 1(c)', 'The actual product of 5,172 × 4 is 20,688. Which estimate was closer to the actual product?', '5,200 × 4 = 20,800', ['5,000 × 4 = 20,000','They are equally close','You cannot tell'], '20,800 − 20,688 = 112, but 20,688 − 20,000 = 688. 112 is smaller, so 20,800 is closer.'),

  Q('Book 2(a)', 'Dion estimated the product of 3,521 and 3 to be 12,000. With what number did he replace 3,521?', 4000, ['3,500','3,000','4,500'], '12,000 ÷ 3 = 4,000. He rounded 3,521 up to 4,000.'),
  Q('Book 2(b)', 'Mei estimated the product of 3,521 and 3 to be 9,900. With what number did she replace 3,521?', 3300, ['3,000','3,500','3,100'], '9,900 ÷ 3 = 3,300. She replaced 3,521 with 3,300.'),
  Q('Book 2(c)', 'The actual product of 3,521 and 3 is 10,563. Dion estimated 12,000 and Mei estimated 9,900. Whose estimate is closer?', "Mei's estimate", ["Dion's estimate",'They are equally close','Neither is close'], 'Dion is off by 12,000 − 10,563 = 1,437. Mei is off by 10,563 − 9,900 = 663. 663 is smaller, so Mei is closer.'),
  Q('Book 2(d)', 'Find the product of 3,521 and 3.', 3521*3, ['9,563','10,163','10,553'], '1 × 3 = 3. 2 × 3 = 6. 5 × 3 = 15, write 5, carry 1. 3 × 3 = 9, plus 1 = 10. The product is 10,563.'),

  Q('Book 3', 'Is 9,183 × 3 greater than or less than 25,000?', 'Greater than 25,000', ['Less than 25,000','Exactly 25,000','You must multiply exactly to tell'], '9,183 is close to 9,000, and 9,000 × 3 = 27,000, which is more than 25,000. The exact product is 27,549.'),
  Q('Book 4', 'The product of 4,962 and 8 is closest to which multiple of 10,000?', 40000, ['30,000','50,000','400,000'], '4,962 is about 5,000 and 5,000 × 8 = 40,000. The exact product is 39,696, which is closest to 40,000.'),

  Q('Book 5(a)', 'Is 7 × 986 = 6,902 reasonable? Why or why not?', 'Reasonable: 7 × 1,000 = 7,000, which is close to 6,902', ['Not reasonable: it should be about 700','Not reasonable: it should be about 70,000','Not reasonable: 986 is not a round number'], '986 is close to 1,000 and 7 × 1,000 = 7,000. 6,902 is close to 7,000, so it is reasonable.'),
  Q('Book 5(b)', 'Is 71,081 × 8 = 57,448 reasonable? Why or why not?', 'Not reasonable: 70,000 × 8 = 560,000, so it should be about 560,000', ['Reasonable: 70,000 × 8 = 56,000, which is close to 57,448','Not reasonable: it should be about 5,600','Reasonable: 1 × 8 = 8, and 57,448 ends in 8'], '71,081 is about 70,000 and 7 ten-thousands × 8 = 56 ten-thousands = 560,000. 57,448 is far too small. The exact product is 568,648.'),

  Q('Book 6(a)', 'Estimate 8,292 × 3 by rounding 8,292 to the nearest thousand.', 8000*3, ['27,000','24,900','21,000'], '8,292 rounds to 8,000. 8,000 × 3 = 24,000.'),
  Q('Book 6(a)', 'Find the exact product: 8,292 × 3 = ?', 8292*3, ['24,676','24,886','25,876'], '2 × 3 = 6. 9 × 3 = 27, write 7, carry 2. 2 × 3 = 6, plus 2 = 8. 8 × 3 = 24. The product is 24,876.'),
  Q('Book 6(b)', 'Estimate 6,710 × 8 by rounding 6,710 to the nearest thousand.', 7000*8, ['48,000','53,600','63,000'], '6,710 rounds to 7,000. 7,000 × 8 = 56,000.'),
  Q('Book 6(b)', 'Find the exact product: 6,710 × 8 = ?', 6710*8, ['48,680','53,080','54,680'], '0 × 8 = 0. 1 × 8 = 8. 7 × 8 = 56, write 6, carry 5. 6 × 8 = 48, plus 5 = 53. The product is 53,680.'),
  Q('Book 6(c)', 'Estimate 6,114 × 7 by rounding 6,114 to the nearest thousand.', 6000*7, ['49,000','42,700','36,000'], '6,114 rounds to 6,000. 6,000 × 7 = 42,000.'),
  Q('Book 6(c)', 'Find the exact product: 6,114 × 7 = ?', 6114*7, ['42,778','42,198','43,798'], '4 × 7 = 28, write 8, carry 2. 1 × 7 = 7, plus 2 = 9. 1 × 7 = 7. 6 × 7 = 42. The product is 42,798.'),
  Q('Book 6(d)', 'Estimate 11,771 × 6 by rounding 11,771 to the nearest thousand.', 12000*6, ['66,000','70,000','720,000'], '11,771 rounds to 12,000. 12,000 × 6 = 72,000.'),
  Q('Book 6(d)', 'Find the exact product: 11,771 × 6 = ?', 11771*6, ['70,026','70,636','71,626'], '1 × 6 = 6. 7 × 6 = 42, write 2, carry 4. 7 × 6 = 42, plus 4 = 46, write 6, carry 4. 1 × 6 = 6, plus 4 = 10, write 0, carry 1. 1 × 6 = 6, plus 1 = 7. The product is 70,626.'),

  Q('Book 7', 'A backhoe costs $12,199 and an excavator costs $165,599. A company wants to buy 4 backhoes and 1 excavator. What is the total cost in dollars?', 4*12199+165599, ['177,798','214,495','213,395'], '4 backhoes: 4 × 12,199 = 48,796. Add 1 excavator: 48,796 + 165,599 = 214,395.'),

  Q('Book 8', '1,089 × 1 = ?', 1089*1, ['1,098','1,189','1,980'], 'Any number × 1 is itself: 1,089.'),
  Q('Book 8', '1,089 × 2 = ?', 1089*2, ['2,168','2,278','2,187'], '9 × 2 = 18, write 8, carry 1. 8 × 2 = 16, plus 1 = 17, write 7, carry 1. 0 + 1 = 1. 1 × 2 = 2. The product is 2,178.'),
  Q('Book 8', '1,089 × 3 = ?', 1089*3, ['3,167','3,257','3,367'], '9 × 3 = 27. 8 × 3 = 24, plus 2 = 26. 0 + 2 = 2. 1 × 3 = 3. The product is 3,267.'),
  Q('Book 8', '1,089 × 4 = ?', 1089*4, ['4,346','4,256','4,366'], '9 × 4 = 36. 8 × 4 = 32, plus 3 = 35. 0 + 3 = 3. 1 × 4 = 4. The product is 4,356.'),
  Q('Book 8', '1,089 × 5 = ?', 1089*5, ['5,545','5,435','5,345'], '9 × 5 = 45. 8 × 5 = 40, plus 4 = 44. 0 + 4 = 4. 1 × 5 = 5. The product is 5,445.'),
  Q('Book 8', '1,089 × 6 = ?', 1089*6, ['6,524','6,634','6,434'], '9 × 6 = 54. 8 × 6 = 48, plus 5 = 53. 0 + 5 = 5. 1 × 6 = 6. The product is 6,534.'),
  Q('Book 8', '1,089 × 7 = ?', 1089*7, ['7,613','7,723','7,523'], '9 × 7 = 63. 8 × 7 = 56, plus 6 = 62. 0 + 6 = 6. 1 × 7 = 7. The product is 7,623.'),
  Q('Book 8', '1,089 × 8 = ?', 1089*8, ['8,702','8,812','8,612'], '9 × 8 = 72. 8 × 8 = 64, plus 7 = 71. 0 + 7 = 7. 1 × 8 = 8. The product is 8,712.'),
  Q('Book 8', '1,089 × 9 = ?', 1089*9, ['9,701','9,811','9,891'], '9 × 9 = 81. 8 × 9 = 72, plus 8 = 80. 0 + 8 = 8. 1 × 9 = 9. The product is 9,801.'),
  Q('Book 8', 'Look at 1,089 × 9 = 9,801. What pattern do you notice?', '9,801 is 1,089 with its digits in reverse order', ['9,801 has the same digits as 1,089 in the same order','Every product in the list ends in the digit 9','Every product in the list has four odd digits'], '9,801 is 1,089 written backwards. Also 2,178 × 4 = 8,712, which is 2,178 backwards.'),

  Q('Book 9', 'In STOP × 4 = POTS, each letter is a different digit. What is the number POTS?', 8712, ['2,178','8,721','8,172'], 'STOP = 2,178 and 2,178 × 4 = 8,712. So S = 2, T = 1, O = 7, P = 8 and POTS = 8,712.'),
  Q('Book 9', 'In STOP × 4 = POTS, what digit does T stand for?', '1', ['7','2','8'], 'STOP = 2,178 (S = 2, T = 1, O = 7, P = 8). 2,178 × 4 = 8,712, which reads P O T S. So T = 1.'),

  /* ---------- Extra practice (same skills) ---------- */
  Q('Extra', '4,236 × 5 = ?', 4236*5, ['20,180','21,080','22,180'], '6 × 5 = 30, write 0, carry 3. 3 × 5 = 15, plus 3 = 18, write 8, carry 1. 2 × 5 = 10, plus 1 = 11, write 1, carry 1. 4 × 5 = 20, plus 1 = 21. The product is 21,180.'),
  Q('Extra', 'Estimate 6,842 × 4 by rounding 6,842 to the nearest thousand.', 7000*4, ['24,000','27,200','32,000'], '6,842 rounds to 7,000. 7,000 × 4 = 28,000.'),
  Q('Extra', '3,418 × 6 = ?', 3418*6, ['19,508','20,408','20,588'], '8 × 6 = 48, write 8, carry 4. 1 × 6 = 6, plus 4 = 10, write 0, carry 1. 4 × 6 = 24, plus 1 = 25, write 5, carry 2. 3 × 6 = 18, plus 2 = 20. The product is 20,508.'),
  Q('Extra', '23,145 × 3 = ?', 23145*3, ['69,335','69,425','68,435'], '5 × 3 = 15, write 5, carry 1. 4 × 3 = 12, plus 1 = 13, write 3, carry 1. 1 × 3 = 3, plus 1 = 4. 3 × 3 = 9. 2 × 3 = 6. The product is 69,435.'),
  Q('Extra', 'The product of 7,205 and 4 is closest to which multiple of 10,000?', 30000, ['20,000','40,000','280,000'], '7,205 is about 7,000 and 7,000 × 4 = 28,000. The exact product is 28,820, which is closest to 30,000.'),
  Q('Extra', 'Which is the only reasonable answer for 4 × 6,018?', 24072, ['2,407','240,720','18,054'], '6,018 is about 6,000 and 4 × 6,000 = 24,000. So the answer must be close to 24,000, and 24,072 is the only one that is.'),
  Q('Extra', 'Without finding the exact products, which gives the greatest product?', '3,950 × 9', ['4,812 × 7','5,206 × 6','6,430 × 5'], 'Estimate: 4,800 × 7 ≈ 33,600. 5,200 × 6 ≈ 31,200. 6,400 × 5 ≈ 32,000. 3,950 × 9 ≈ 4,000 × 9 = 36,000, which is the greatest.'),
  Q('Extra', '9,008 × 7 = ?', 9008*7, ['63,506','62,056','63,156'], '8 × 7 = 56, write 6, carry 5. 0 × 7 = 0, plus 5 = 5. 0 × 7 = 0. 9 × 7 = 63. The product is 63,056.'),
  Q('Extra', 'A factory makes 2,486 toys every day. How many toys does it make in 5 days?', 2486*5, ['12,030','11,430','12,440'], '6 × 5 = 30, write 0, carry 3. 8 × 5 = 40, plus 3 = 43, write 3, carry 4. 4 × 5 = 20, plus 4 = 24, write 4, carry 2. 2 × 5 = 10, plus 2 = 12. The product is 12,430.'),
  Q('Extra', 'A library buys 7 boxes of books. Each box has 1,845 books. How many books is that altogether?', 1845*7, ['12,815','12,905','11,915'], '5 × 7 = 35, write 5, carry 3. 4 × 7 = 28, plus 3 = 31, write 1, carry 3. 8 × 7 = 56, plus 3 = 59, write 9, carry 5. 1 × 7 = 7, plus 5 = 12. The product is 12,915.'),
  Q('Extra', 'A farm has 4 barns with 1,350 chickens in each barn, and 1 coop with 875 chickens. How many chickens are there in total?', 4*1350+875, ['5,400','6,375','8,900'], '4 barns: 4 × 1,350 = 5,400. Add the coop: 5,400 + 875 = 6,275.'),
  Q('Extra', 'Estimate 7,846 × 5 by rounding 7,846 to the nearest thousand.', 8000*5, ['35,000','39,000','45,000'], '7,846 rounds to 8,000. 8,000 × 5 = 40,000.'),
  Q('Extra', '6,725 × 8 = ?', 6725*8, ['48,800','53,200','54,800'], '5 × 8 = 40, write 0, carry 4. 2 × 8 = 16, plus 4 = 20, write 0, carry 2. 7 × 8 = 56, plus 2 = 58, write 8, carry 5. 6 × 8 = 48, plus 5 = 53. The product is 53,800.')
];

/* ---------- Quiz engine ---------- */
const card = document.getElementById('card');
let order, idx, score, missed;
const L = ['A','B','C','D'];

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function start(){
  order = BANK.slice();            // textbook questions first, then extras (as in the workbook order)
  idx = 0; score = 0; missed = [];
  show();
}

function show(){
  const q = order[idx];
  const opts = shuffle([q.a, ...q.d]);
  card.innerHTML = `
    <div class="bar"><div style="width:${(idx/order.length)*100}%"></div></div>
    <div class="meta"><span>Question ${idx+1} of ${order.length}</span><span>Score: ${score}</span></div>
    <span class="tag">${q.tag}</span>
    <p class="q">${q.q}</p>
    <div class="opts">
      ${opts.map((o,i)=>`<button class="opt" data-v="${o}"><span class="l">${L[i]}</span><span>${o}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <div class="nav" id="nav"><button class="btn" id="next">${idx===order.length-1?'See results':'Next question'}</button></div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,q));
  document.getElementById('next').onclick=()=>{ idx++; idx<order.length?show():finish(); };
}

function pick(btn,q){
  const chosen = btn.dataset.v, right = chosen===q.a;
  card.querySelectorAll('.opt').forEach(b=>{
    b.disabled = true;
    if(b.dataset.v===q.a) b.classList.add('ok');
  });
  if(!right) btn.classList.add('bad');
  if(right) score++; else missed.push({q:q.q, yours:chosen, a:q.a, x:q.x});
  const fb = document.getElementById('fb');
  fb.className = 'fb show ' + (right?'ok':'bad');
  fb.innerHTML = (right?'<b>Correct!</b> ':'<b>Not quite.</b> The answer is '+q.a+'. ') + q.x;
  document.getElementById('nav').classList.add('show');
}

function finish(){
  const pct = Math.round(score/order.length*100);
  const msg = pct>=90?'Outstanding multiplying!':pct>=70?'Great work!':pct>=50?'Good effort. Keep practising!':'Keep going. Review the steps below and try again.';
  card.innerHTML = `
    <div class="center">
      <div class="bar"><div style="width:100%"></div></div>
      <h2 style="margin:8px 0 0">Quiz complete</h2>
      <div class="big">${score} / ${order.length}</div>
      <p style="margin:0;color:var(--muted)">${pct}% &middot; ${msg}</p>
      <div class="row">
        <button class="btn" id="again">Try again</button>
        ${missed.length?'<button class="btn alt" id="retryMissed">Retry missed only</button>':''}
      </div>
    </div>
    ${missed.length?`<div class="review"><h3>Questions to review (${missed.length})</h3>
      ${missed.map(m=>`<div class="item"><div>${m.q}</div><div>You chose <span>${m.yours}</span> &middot; Correct: <b>${m.a}</b></div><div style="color:var(--muted);margin-top:4px">${m.x}</div></div>`).join('')}</div>`:''}`;
  document.getElementById('again').onclick = start;
  const r = document.getElementById('retryMissed');
  if(r) r.onclick = () => {
    const keep = new Set(missed.map(m=>m.q));
    order = BANK.filter(b=>keep.has(b.q)); idx=0; score=0; missed=[]; show();
  };
}

start();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chemistry Quiz – 100 Questions</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1b2430;--mut:#667085;--pri:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#d9e0ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#182131;--tx:#e8edf5;--mut:#9aa6b8;--bd:#2a364a}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
h1{margin:0 0 4px;font-size:1.6rem}p{color:var(--mut);margin:4px 0 14px}
button{font:inherit;cursor:pointer;color:var(--tx)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);text-align:left}
.t:hover{border-color:var(--pri)}.all{grid-column:1/-1;background:var(--pri);color:#fff;border:0;text-align:center;font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem}
h2{font-size:1.2rem;margin:6px 0 14px}
.o{display:block;width:100%;margin:8px 0;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);text-align:left}
.o:hover:not(:disabled){border-color:var(--pri)}.o.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.o.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.nx{margin-top:10px;padding:12px 20px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-weight:600}
.big{font-size:3rem;font-weight:700;margin:0}.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}
</style></head><body><main><div id="app"></div></main>
<script>
const RAW=`#Physical Change
Which is a physical change?|Ice melting|Wood burning|Iron rusting|Milk souring
Which is NOT a physical change?|Paper burning|Water freezing|Glass breaking|Sugar dissolving
Liquid changing to gas is called|Evaporation|Condensation|Freezing|Sublimation
A solid turning directly into gas is|Sublimation|Deposition|Melting|Condensation
After a physical change, the substance's identity|stays the same|becomes new|is destroyed|becomes an element
Which is a physical property?|Melting point|Flammability|Reactivity with acid|Ability to rust
Crushing a can is|a physical change|a chemical change|combustion|decomposition
Gas changing to liquid is|Condensation|Evaporation|Melting|Boiling
Which is a physical change?|Cutting paper|Baking a cake|Frying an egg|Burning gas
Water freezes at (sea level)|0 °C|100 °C|-10 °C|4 °C
Boiling water into steam is a|physical change|chemical change|combustion|decomposition
#Chemical Change
Which is a sign of a chemical change?|Production of a new gas|Change in shape|Change in size|Stretching
Iron rusting is a|chemical change|physical change|mixture|evaporation
Burning wood is a|chemical change|physical change|melting|sublimation
Which is a chemical change?|Baking a cake|Melting butter|Chopping wood|Boiling water
Milk going sour is a|chemical change|physical change|evaporation|filtration
Chemical changes form|new substances|the same substances|only mixtures|no new matter
Which is a chemical property?|Flammability|Density|Colour|Boiling point
Photosynthesis is a|chemical change|physical change|melting|dissolving
Baking soda + vinegar releases which gas?|Carbon dioxide|Oxygen|Hydrogen|Nitrogen
Can a chemical change be undone by simply freezing?|No|Yes, always|Only for gases|Only in water
Digesting food is a|chemical change|physical change|evaporation|condensation
#Periodic Table
Who created the first widely accepted periodic table?|Mendeleev|Dalton|Curie|Bohr
Modern table orders elements by increasing|atomic number|colour|density|state
Horizontal rows are called|periods|groups|families|blocks
Vertical columns are called|groups|periods|series|rows
Group 18 elements are the|noble gases|alkali metals|halogens|alkaline earth metals
Group 1 (except hydrogen) are the|alkali metals|halogens|noble gases|transition metals
Symbol for sodium|Na|S|So|N
Symbol for gold|Au|Ag|Go|Gd
Symbol for potassium|K|P|Po|Pt
Group 17 elements are the|halogens|alkali metals|noble gases|metalloids
Most elements are|metals|nonmetals|gases|metalloids
Which is a noble gas?|Neon|Oxygen|Chlorine|Sodium
#Precipitate
A precipitate is|an insoluble solid formed in a solution|a gas|a dissolved salt|a liquid layer
A precipitate forms when two solutions mix and|make an insoluble product|bubble|freeze|evaporate
AgNO₃ + NaCl gives a white precipitate of|AgCl|NaNO₃|Ag₂O|NaCl
A precipitation reaction is a type of|double displacement|combustion|decomposition|synthesis
Which separates a precipitate from a liquid?|Filtration|A magnet|Sublimation|Electrolysis
A sign of precipitate forming is the solution turning|cloudy|clear|hot only|colourless
The liquid that passes through filter paper is the|filtrate|residue|solute|alloy
The solid left on filter paper is the|residue|filtrate|solvent|distillate
PbI₂ precipitate is|yellow|white|blue|green
A precipitate is ___ in the solvent|insoluble|soluble|a gas|a solvent
Which pair forms a precipitate?|Pb(NO₃)₂ + KI|NaCl + KNO₃|KCl + NaNO₃|NaNO₃ + KNO₃
#Oxidation
Oxidation is the|loss of electrons|gain of electrons|gain of protons|loss of neutrons
Reduction is the|gain of electrons|loss of electrons|loss of protons|gain of neutrons
In OIL RIG, "Oxidation Is"|Loss|Gain|Light|Low
Rusting is the oxidation of|iron|copper|carbon|helium
Rust is mainly|iron oxide|iron sulfide|copper oxide|iron chloride
Rusting needs oxygen and|water|helium|argon|oil
Oxygen's usual oxidation number in compounds|-2|+2|0|+1
Oxidation number of a pure element|0|+1|-1|+2
An oxidizing agent|gains electrons|loses electrons|is always a gas|is a noble gas
Green coating on old copper roofs is due to|oxidation|evaporation|condensation|filtration
Which slows rusting?|Painting the iron|Wetting it|Salt water|Heating in air
#Compounds
A compound is|elements chemically bonded|a physical mixture|one type of atom|a solution
Water's formula|H₂O|HO₂|H₂O₂|OH
Table salt|NaCl|KCl|NaOH|CaCl₂
CO₂ contains|1 carbon, 2 oxygen|2 carbon, 1 oxygen|1 carbon, 1 oxygen|2 oxygen only
Compounds are separated by|chemical reactions|filtering|a magnet|sieving
Which is a compound?|Carbon dioxide|Oxygen gas|Gold|Nitrogen gas
Which is an element?|Oxygen|Water|Salt|Sugar
Ionic compounds form between a|metal and nonmetal|two noble gases|two metals|two identical atoms
Covalent bonds involve|sharing electrons|transferring electrons|sharing protons|no electrons
Formula for methane|CH₄|C₂H₆|CO|CH₃
A compound's properties are|different from its elements|same as its elements|an average|identical to a mixture
#Mixtures
A mixture is|substances physically combined|chemically bonded|one element|a compound
Components of a mixture|keep their properties|lose their properties|form a new substance|bond together
Which is a mixture?|Air|Water|Gold|CO₂
A heterogeneous mixture is|not uniform|uniform|a pure element|a compound
Homogeneous mixture example|Salt water|Sand and water|Salad|Granite
Separate sand from water by|Filtration|A magnet|Sublimation|Electrolysis
Separate iron filings from sand using|A magnet|Filtration|Distillation|Chromatography
Separate salt from salt water by|Evaporation|A magnet|Sieving|Decanting only
Separate the dyes in ink using|Chromatography|Filtration|A magnet|Sieving
Another name for a homogeneous mixture|Solution|Suspension|Compound|Element
Brass is|a mixture of metals|a compound|an element|a gas
#Atoms
The centre of an atom is the|nucleus|electron cloud|shell|orbit
Positive particle|Proton|Electron|Neutron|Photon
Negative particle|Electron|Proton|Neutron|Nucleus
Neutral particle|Neutron|Proton|Electron|Ion
Atomic number equals the number of|protons|neutrons|shells|ions
Mass number = protons +|neutrons|electrons|shells|ions
Atoms of one element with different neutrons|Isotopes|Ions|Compounds|Molecules
An atom that loses an electron becomes a|positive ion|negative ion|neutral atom|isotope
Carbon's atomic number|6|12|8|14
A neutral atom has equal|protons and electrons|protons and neutrons|neutrons and electrons|shells and protons
Maximum electrons in the first shell|2|8|4|18
#Solubility
A solute is the|substance dissolved|dissolving liquid|undissolved solid|mixture
A solvent|does the dissolving|is dissolved|is a precipitate|is a gas
The "universal solvent"|Water|Oil|Mercury|Ethanol
A saturated solution|cannot dissolve more solute|has no solute|can dissolve more|is a gas
An unsaturated solution|can dissolve more solute|cannot dissolve more|is a precipitate|is pure solvent
Heating usually ___ solubility of solids|increases|decreases|doesn't change|destroys
Heating ___ solubility of gases|decreases|increases|doesn't change|doubles
Stirring|speeds up dissolving|raises the solubility limit|lowers it|makes solute insoluble
Oil dissolves best in|nonpolar solvents|water|polar solvents|vinegar
Oil and water don't mix because oil is|nonpolar|ionic|acidic|a gas
Soluble means it|dissolves in a solvent|won't dissolve|is a gas|is a metal`;
let Q=[],T=[],cur="";
RAW.split("\n").forEach(l=>{if(l[0]=="#"){cur=l.slice(1);T.push(cur)}else{const p=l.split("|");Q.push({t:cur,q:p[0],a:p[1],o:p.slice(1)})}});
const $=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let L,i,sc,res,done;
function home(){$.innerHTML=`<div class="card"><h1>🧪 Chemistry Quiz</h1><p>${Q.length} questions · pick a topic or take them all.</p><div class="grid"><button class="t all" onclick="start()">All ${Q.length} questions</button>${T.map(t=>`<button class="t" onclick="start('${t}')">${t}<br><small>${Q.filter(q=>q.t==t).length} Qs</small></button>`).join("")}</div></div>`}
function start(t){L=sh(t?Q.filter(q=>q.t==t):Q);i=0;sc=0;res={};show()}
function show(){const q=L[i];done=0;$.innerHTML=`<div class="card"><div class="meta"><span>${q.t}</span><span>Q ${i+1}/${L.length} · Score ${sc}</span></div><div class="bar"><i style="width:${i/L.length*100}%"></i></div><h2>${q.q}</h2><div id="os">${sh(q.o).map(o=>`<button class="o" data-v="${o}">${o}</button>`).join("")}</div><div id="nx"></div></div>`;
document.querySelectorAll(".o").forEach(b=>b.onclick=()=>pick(b))}
function pick(b){if(done)return;done=1;const q=L[i],r=res[q.t]=res[q.t]||[0,0];r[1]++;
const ok=b.dataset.v==q.a;if(ok){sc++;r[0]++}
document.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(x.dataset.v==q.a)x.classList.add("ok");else if(x==b)x.classList.add("bad")});
document.getElementById("nx").innerHTML=`<button class="nx" onclick="nxt()">${i+1<L.length?"Next →":"See results"}</button>`}
function nxt(){i++;i<L.length?show():end()}
function end(){const p=Math.round(sc/L.length*100);$.innerHTML=`<div class="card"><h1>Results</h1><p class="big">${sc}/${L.length}</p><p>${p}% — ${p>=80?"Excellent! 🎉":p>=60?"Good work! Keep practising.":"Review the topics below and try again."}</p>${Object.keys(res).map(t=>`<div class="row"><span>${t}</span><b>${res[t][0]}/${res[t][1]}</b></div>`).join("")}<button class="nx" onclick="home()">Back to topics</button></div>`}
home();
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Negatives Quiz 4</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2b3a;--muted:#5d6b7a;--brand:#2f6fed;--brand-d:#2457bd;--ok:#1e9e5a;--okbg:#e6f6ee;--bad:#d64545;--badbg:#fdeaea;--line:#dbe3ee}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:20px}
.wrap{width:100%;max-width:640px}
.card{background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(30,60,110,.09);padding:28px}
h1{margin:0 0 6px;font-size:1.7rem}
.sub{color:var(--muted);margin:0 0 20px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-size:1rem;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opt-row{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.bar>div{height:100%;background:var(--brand);width:0;transition:width .25s}
.sec{display:inline-block;background:#eaf1ff;color:var(--brand-d);font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px;margin-bottom:12px}
.q{font-size:1.5rem;font-weight:700;margin:4px 0 18px;line-height:1.35}
.q.small{font-size:1.2rem}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px;font-size:1.15rem;font-weight:600;cursor:pointer;text-align:center;color:var(--ink)}
.ans:hover:not(:disabled){border-color:var(--brand)}
.ans.right{background:var(--okbg);border-color:var(--ok)}
.ans.wrong{background:var(--badbg);border-color:var(--bad)}
.ans:disabled{cursor:default}
.fb{margin-top:18px;padding:14px;border-radius:12px;display:none;line-height:1.5}
.fb.ok{display:block;background:var(--okbg)}
.fb.no{display:block;background:var(--badbg)}
.nav{margin-top:18px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(3,56px);gap:4px;margin:0 0 18px}
.grid div{height:50px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;border-radius:6px}
.grid .qm{background:#fff4c9;border-color:#d4a300}
.grid .blank{background:#f0f3f8;border-color:var(--line);color:var(--muted)}
.score{font-size:3rem;font-weight:800;color:var(--brand);margin:6px 0}
.review{margin-top:18px;max-height:340px;overflow:auto;border-top:1px solid var(--line)}
.review div{padding:10px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.review b{color:var(--bad)}
.hidden{display:none}
@media(max-width:480px){.answers{grid-template-columns:1fr}.q{font-size:1.3rem}.card{padding:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="start">
    <h1>Negatives Quiz 4</h1>
    <p class="sub">Adding and subtracting negative numbers. 50 new questions, one at a time.</p>
    <div class="opt-row"><input type="checkbox" id="shuf"><label for="shuf">Shuffle the question order</label></div>
    <button class="btn" id="go">Start quiz</button>
  </div>

  <div class="card hidden" id="play">
    <div class="top"><span id="count"></span><span id="scoreLive"></span></div>
    <div class="bar"><div id="prog"></div></div>
    <span class="sec" id="sec"></span>
    <div id="grid"></div>
    <div class="q" id="qtext"></div>
    <div class="answers" id="answers"></div>
    <div class="fb" id="fb"></div>
    <div class="nav"><button class="btn" id="next" disabled>Next</button></div>
  </div>

  <div class="card hidden" id="end">
    <h1>Quiz complete</h1>
    <div class="score" id="final"></div>
    <p class="sub" id="msg"></p>
    <button class="btn" id="again">Try again</button>
    <div class="review" id="review"></div>
  </div>
</div>

<script>
const ev = e => Function('return ' + e)();
const fmt = n => String(n).replace('-', '\u2212');
const show = e => e.replace(/([+\-]) ([+\-])(\d+)/g, '$1 ($2$3)').replace(/-/g, '\u2212');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const TIPS = {
  basic: 'Use a number line. Taking away more than you have goes below zero. Adding to a negative moves you to the right.',
  chain: 'Work from left to right, one step at a time.',
  addneg: 'Adding a negative is the same as subtracting. For example, 4 + (\u22121) = 4 \u2212 1.',
  subpos: 'Subtracting a positive number is just ordinary subtraction. For example, 6 \u2212 (+1) = 6 \u2212 1.',
  subneg: 'Subtracting a negative is the same as adding. For example, 1 \u2212 (\u22122) = 1 + 2.',
  mixed: 'Rewrite double signs first: + \u2212 becomes \u2212, and \u2212 \u2212 becomes +.',
  missing: 'Put your answer back into the box and check that the sum works.',
  magic: 'Find a complete row, column or diagonal to get the magic total, then work out the missing number.',
  real: 'Draw a quick number line to see the change.',
  cards: 'Try each pair and work out the answer before choosing.'
};

const Q = [];
function numOpts(a, unit) {
  const c = [...new Set([-a, a + 1, a - 1, a + 2, a - 2, a + 3, a - 3].filter(x => x !== a))];
  const first = c[0] === -a ? [c.shift()] : [];
  const picks = first.concat(shuffle(c).slice(0, 3 - first.length));
  const f = x => (unit === '\u00a3' ? (x < 0 ? '\u2212\u00a3' + Math.abs(x) : '\u00a3' + x) : fmt(x) + (unit || ''));
  return { opts: shuffle([a, ...picks]).map(f), correct: f(a) };
}
function addExpr(sec, list) {
  list.forEach(e => {
    const a = ev(e), o = numOpts(a);
    Q.push({ sec, tip: TIPS[sec.key], text: show(e) + ' = ?', opts: o.opts, correct: o.correct, expl: show(e) + ' = ' + fmt(a) });
  });
}

const S = {
  basic: { key: 'basic', name: 'Basic negatives' },
  chain: { key: 'chain', name: 'Chains of + and \u2212' },
  addneg: { key: 'addneg', name: 'Adding negatives' },
  subpos: { key: 'subpos', name: 'Subtracting positives' },
  subneg: { key: 'subneg', name: 'Subtracting negatives' },
  mixed: { key: 'mixed', name: 'Mixed practice' },
  missing: { key: 'missing', name: 'Missing numbers' },
  magic: { key: 'magic', name: 'Magic squares' },
  real: { key: 'real', name: 'Real-life problems' },
  cards: { key: 'cards', name: 'Cards and reasoning' }
};

addExpr(S.basic, ['4 - 10','8 - 15','11 - 17','-5 + 9','-13 + 7','-16 + 21']);
addExpr(S.chain, ['6 - 9 + 2','-5 + 8 - 6','4 - 7 - 3','-11 + 6 + 9','13 - 21 + 5','-3 - 8 + 15','-4 + -6 - -3','5 - -2 + -9']);
addExpr(S.addneg, ['6 + -13','12 + -5','4 + -10','-8 + -3','-9 + -11']);
addExpr(S.subpos, ['8 - +14','-4 - +7','-9 - +5','5 - +12','-6 - +10']);
addExpr(S.subneg, ['6 - -8','3 - -12','-9 - -4','-14 - -6','-5 - -11','-8 - -8','0 - -9']);
addExpr(S.mixed, ['15 - 23','-19 + 8','7 + -16','-4 - -13','-22 - 8','-35 + 50']);

[['□ + 7 = 3', -4, '−4 + 7 = 3'], ['□ − 6 = −11', -5, '−5 − 6 = −11'],
 ['−5 − □ = 4', -9, '−5 − (−9) = 4'], ['8 − □ = 15', -7, '8 − (−7) = 15']]
.forEach(([t, a, x]) => { const o = numOpts(a); Q.push({ sec: S.missing, tip: TIPS.missing, text: 'Find the missing number: ' + t, opts: o.opts, correct: o.correct, expl: x }); });

const mg = [-5, 0, -1, 2, -2, -6, -3, -4, 1];
const hole = k => mg.map((v, j) => j === k ? null : v);
[[4, 'Every row, column and diagonal adds to −6. Middle row: 2 + ? + (−6) = −6, so ? = −2.'],
 [7, 'Every row, column and diagonal adds to −6. Middle column: 0 + (−2) + ? = −6, so ? = −4.'],
 [2, 'Every row, column and diagonal adds to −6. Top row: −5 + 0 + ? = −6, so ? = −1.'],
 [6, 'Every row, column and diagonal adds to −6. Left column: −5 + 2 + ? = −6, so ? = −3.']]
.forEach(([k, ex]) => { const o = numOpts(mg[k]); Q.push({ sec: S.magic, tip: TIPS.magic, grid: hole(k), qi: k, text: 'Every row, column and diagonal adds to the same total. What number goes in the yellow square?', opts: o.opts, correct: o.correct, expl: ex }); });

(() => {
  let o = numOpts(-25, ' m');
  Q.push({ sec: S.real, tip: TIPS.real, small: 1, text: 'A submarine is at −40 m. It rises 15 m. Where is it now?', opts: o.opts, correct: o.correct, expl: '−40 + 15 = −25, so it is at −25 m.' });
  o = numOpts(7, '°C');
  Q.push({ sec: S.real, tip: TIPS.real, small: 1, text: 'At 3am the temperature was −4°C. By 2pm it had risen by 11 degrees. What is the temperature at 2pm?', opts: o.opts, correct: o.correct, expl: '−4 + 11 = 7, so it is 7°C.' });
  o = numOpts(-65, '£');
  Q.push({ sec: S.real, tip: TIPS.real, small: 1, text: "Tolu's account is at −£45. The bank charges him a £20 fee. What is his balance now?", opts: o.opts, correct: o.correct, expl: '−£45 − £20 = −£65.' });
})();

const cardNote = 'Cards: −8, −2, 4, 7, −5, 1, 3. ';
const pairQ = (text, ans, wrong, expl) => Q.push({ sec: S.cards, tip: TIPS.cards, small: 1, text: cardNote + text, opts: shuffle([ans, ...wrong]), correct: ans, expl });
pairQ('Which two cards add to make −7?', '−5 and −2', ['−8 and 4', '−5 and 3', '−2 and 4'], '−5 + (−2) = −7.');
pairQ('Which subtraction gives the greatest possible answer?', '7 − (−8)', ['7 − (−5)', '4 − (−8)', '7 − (−2)'], '7 − (−8) = 7 + 8 = 15.');

// Rebuild wrong options from realistic mistakes so the answer cannot be guessed by pattern
(function rebuild() {
  const parse = c => { const d = parseInt(c.replace(/[^\d]/g, '')); return /^−/.test(c) ? -d : d; };
  Q.forEach(q => {
    if (q.text.startsWith('Cards') || q.text.startsWith('Which of')) return;
    const a = parse(q.correct);
    const unit = q.correct.includes('£') ? '£' : q.correct.includes('°C') ? '°C' : q.correct.includes(' m') ? ' m' : '';
    const f = x => unit === '£' ? (x < 0 ? '−£' + Math.abs(x) : '£' + x) : fmt(x) + unit;
    let nums = [];
    if (q.grid) nums = q.grid.filter(v => v !== null);
    else {
      const t = q.text.replace(/\d+\s?(am|pm)/g, '');
      const re = /(−?)(\d+)/g; let m;
      while ((m = re.exec(t))) nums.push((m[1] ? -1 : 1) * parseInt(m[2]));
      nums = nums.slice(0, 4);
    }
    const pool = new Set();
    for (let x = 0; x < nums.length; x++) {
      const p = nums[x]; pool.add(p); pool.add(-p);
      for (let y = 0; y < nums.length; y++) {
        if (x === y) continue;
        const r = nums[y];
        [p + r, p - r, -(p + r), Math.abs(p) + Math.abs(r), -(Math.abs(p) + Math.abs(r)), Math.abs(p) - Math.abs(r), Math.abs(r) - Math.abs(p)].forEach(v => pool.add(v));
      }
    }
    pool.delete(a);
    let cand = shuffle([...pool]);
    // keep wrong answers within a believable range of the real answer
    const lim = Math.max(12, Math.abs(a) + 12);
    cand = cand.filter(v => Math.abs(v) <= lim);
    if (Math.random() < 0.5) { const k = cand.indexOf(-a); if (k > 0) { cand.splice(k, 1); cand.unshift(-a); } }
    else { const k = cand.indexOf(-a); if (k >= 0) cand.splice(k, 1); }
    let picks = cand.slice(0, 3);
    let k = 1;
    while (picks.length < 3) { const v = a + (Math.random() < 0.5 ? -1 : 1) * (k++ + 2); if (v !== a && !picks.includes(v)) picks.push(v); }
    q.opts = shuffle([a, ...picks]).map(f);
    q.correct = f(a);
  });
})();

// App logic
let order = [], i = 0, score = 0, missed = [], locked = false;
const $ = id => document.getElementById(id);
function renderGrid(q) {
  if (!q.grid) return '';
  return '<div class="grid">' + q.grid.map((v, k) => k === q.qi ? '<div class="qm">?</div>' : v === null ? '<div class="blank"></div>' : '<div>' + fmt(v) + '</div>').join('') + '</div>';
}
function load() {
  const q = order[i]; locked = false;
  $('count').textContent = 'Question ' + (i + 1) + ' of ' + order.length;
  $('scoreLive').textContent = 'Score: ' + score;
  $('prog').style.width = (i / order.length * 100) + '%';
  $('sec').textContent = q.sec.name;
  $('grid').innerHTML = renderGrid(q);
  const t = $('qtext'); t.textContent = q.text; t.className = 'q' + (q.small || q.grid ? ' small' : '');
  const box = $('answers'); box.innerHTML = '';
  q.opts.forEach(o => { const b = document.createElement('button'); b.className = 'ans'; b.textContent = o; b.onclick = () => pick(b, o); box.appendChild(b); });
  $('fb').className = 'fb'; $('fb').innerHTML = '';
  $('next').disabled = true; $('next').textContent = i === order.length - 1 ? 'See results' : 'Next';
}
function pick(btn, val) {
  if (locked) return; locked = true;
  const q = order[i], ok = val === q.correct;
  document.querySelectorAll('.ans').forEach(b => { b.disabled = true; if (b.textContent === q.correct) b.classList.add('right'); });
  if (ok) { score++; } else { btn.classList.add('wrong'); missed.push(q); }
  const fb = $('fb'); fb.className = 'fb ' + (ok ? 'ok' : 'no');
  fb.innerHTML = '<b>' + (ok ? 'Correct!' : 'Not quite.') + '</b> ' + q.expl + (ok ? '' : '<br><small>Tip: ' + q.tip + '</small>');
  $('scoreLive').textContent = 'Score: ' + score;
  $('next').disabled = false;
}
function finish() {
  $('play').classList.add('hidden'); $('end').classList.remove('hidden');
  const pct = Math.round(score / order.length * 100);
  $('final').textContent = score + ' / ' + order.length + ' (' + pct + '%)';
  $('msg').textContent = pct >= 90 ? 'Excellent work. You really know your negatives.' : pct >= 70 ? 'Good job. Review the ones you missed below.' : pct >= 50 ? 'A fair start. Read the tips and try again.' : 'Keep practising. Use a number line and try again.';
  $('review').innerHTML = missed.length ? '<h3>Questions to review</h3>' + missed.map(q => '<div><b>' + q.text + '</b><br>Answer: ' + q.correct + ' &mdash; ' + q.expl + '</div>').join('') : '<h3>No mistakes. Perfect score!</h3>';
}
function start() {
  order = $('shuf').checked ? shuffle(Q) : Q.slice(); i = 0; score = 0; missed = [];
  $('start').classList.add('hidden'); $('end').classList.add('hidden'); $('play').classList.remove('hidden'); load();
}
$('go').onclick = start;
$('again').onclick = () => { $('end').classList.add('hidden'); $('start').classList.remove('hidden'); };
$('next').onclick = () => { i++; if (i >= order.length) { $('prog').style.width = '100%'; finish(); } else load(); };
</script>
</body>
</html>

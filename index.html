<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 2 Number Sense Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f4ff;--card:#fff;--ink:#17324d;--soft:#5b738c;--line:#cfe0f0;--blue:#2f7be5;--yellow:#ffc933;--green:#27a862;--coral:#f0553f;--gbg:#dff6e8;--cbg:#ffe5e0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e2e;--card:#172c42;--ink:#eaf3fb;--soft:#9db4c9;--line:#2a4560;--blue:#6aa5f5;--green:#4fd18a;--coral:#ff8a78;--gbg:#17402b;--cbg:#4a2620;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1e2e;--card:#172c42;--ink:#eaf3fb;--soft:#9db4c9;--line:#2a4560;--blue:#6aa5f5;--green:#4fd18a;--coral:#ff8a78;--gbg:#17402b;--cbg:#4a2620;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;font-size:18px;line-height:1.4;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:24px;box-shadow:0 6px 0 var(--ink)}
h1{font-size:2.2rem;line-height:1.1;margin:0 0 8px}
h2{font-size:1.5rem;margin:0 0 12px}
p{margin:0 0 14px;color:var(--soft)}
.topics{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px;padding:0;list-style:none}
.topics li{background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.95rem;color:var(--ink)}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.big{background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:12px 28px;font-weight:700;font-size:1.2rem;box-shadow:0 4px 0 var(--ink);color:#17324d}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.bar{height:16px;background:var(--card);border:3px solid var(--ink);border-radius:999px;overflow:hidden;margin-bottom:18px}
.bar>div{height:100%;background:var(--green);width:0;transition:width .3s}
.tag{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:2px 14px;font-size:.9rem;font-weight:600;margin-bottom:12px}
.q{font-size:1.7rem;font-weight:600;line-height:1.25;margin:0 0 6px}
.say{background:none;border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.9rem;margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:460px){.opts{grid-template-columns:1fr}.q{font-size:1.5rem}}
.opt{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:16px 10px;font-size:1.5rem;font-weight:600;box-shadow:0 4px 0 var(--ink);min-height:68px}
.opt:hover:not(:disabled){background:var(--bg)}
.opt:disabled{cursor:default}
.opt.right{background:var(--gbg);border-color:var(--green);box-shadow:0 4px 0 var(--green)}
.opt.wrong{background:var(--cbg);border-color:var(--coral);box-shadow:0 4px 0 var(--coral)}
.fb{min-height:30px;font-size:1.2rem;font-weight:600;margin-bottom:12px}
.fb.good{color:var(--green)}.fb.bad{color:var(--coral)}
.stars{font-size:3rem;letter-spacing:6px;margin:6px 0}
.score{font-size:2.4rem;font-weight:700;margin:0 0 12px}
.row{margin-bottom:12px}
.row .l{display:flex;justify-content:space-between;font-weight:600;margin-bottom:4px}
.row .b{height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.row .b>div{height:100%;background:var(--blue)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <section id="start" class="card">
    <h1>Number Sense Quiz</h1>
    <p>Grade 2 · 50 questions. Pick the best answer for each one. You can tap “Read it to me” to hear a question.</p>
    <ul class="topics" id="tl"></ul>
    <button class="big" id="go">Start quiz</button>
  </section>

  <section id="quiz" class="card hide">
    <div class="top"><span id="cnt">Question 1 of 50</span><span id="sc">Score: 0</span></div>
    <div class="bar"><div id="pg"></div></div>
    <span class="tag" id="tg"></span>
    <p class="q" id="qt" style="color:var(--ink)"></p>
    <button class="say" id="say">🔊 Read it to me</button>
    <div class="opts" id="op"></div>
    <div class="fb" id="fb" aria-live="polite"></div>
    <button class="big hide" id="nx">Next question</button>
  </section>

  <section id="end" class="card hide">
    <h2>All done!</h2>
    <div class="stars" id="st" aria-hidden="true"></div>
    <div class="score" id="fs"></div>
    <p id="msg"></p>
    <div id="br"></div>
    <button class="big" id="again">Play again</button>
  </section>
</main>

<script>
var TOPICS=["Counting & writing","Place value","Comparing & ordering","Skip counting","Even & odd","Ordinal numbers"];
// [topic, question, correct, wrong, wrong, wrong]
var BANK=[
[0,"What number comes after 49?","50","48","59","40"],
[0,"What number comes before 80?","79","81","70","89"],
[0,"Which is 46 written with digits? Forty-six is…","46","64","406","40"],
[0,"Which words match the number 73?","seventy-three","thirty-seven","seventy-two","seventeen"],
[0,"What number is between 29 and 31?","30","20","28","32"],
[0,"Which word is the number 15?","fifteen","fifty","five","fourteen"],
[0,"Count on: 97, 98, 99, …","100","90","101","109"],
[0,"Which number is “sixty-one”?","61","16","601","60"],
[0,"What number is missing? 62, 63, __, 65","64","66","61","54"],
[1,"In the number 47, how many tens are there?","4","7","47","11"],
[1,"In the number 47, how many ones are there?","7","4","47","11"],
[1,"5 tens and 3 ones make which number?","53","35","8","503"],
[1,"What is the value of the 6 in 62?","60","6","2","62"],
[1,"What is the value of the 8 in 38?","8","80","3","38"],
[1,"Which number is 20 + 7?","27","72","207","9"],
[1,"In 358, how many hundreds are there?","3","5","8","358"],
[1,"Which digit is in the tens place of 94?","9","4","94","13"],
[1,"100 + 20 + 5 = ?","125","152","1,025","25"],
[1,"7 tens is the same as…","70","7","17","700"],
[1,"Which number has 2 tens and 9 ones?","29","92","11","209"],
[1,"10 tens is the same as…","100","10","1,000","20"],
[1,"Which digit is in the tens place of 406?","0","4","6","40"],
[2,"Which number is greater: 56 or 65?","65","56","They are the same","Neither"],
[2,"Which sign makes this true? 34 __ 43","<",">","=","+"],
[2,"Which sign makes this true? 72 __ 27",">","<","=","−"],
[2,"Which number is the smallest?","29","38","83","92"],
[2,"Which number is the biggest?","54","45","15","51"],
[2,"Which list goes from smallest to largest?","13, 22, 31","31, 22, 13","22, 13, 31","13, 31, 22"],
[2,"Which number is 10 more than 35?","45","36","25","55"],
[2,"Which number is 10 less than 60?","50","59","70","61"],
[2,"Which number is less than 48?","39","52","84","48"],
[2,"Which sign makes this true? 205 __ 250","<",">","=","+"],
[3,"Count by 2s: 2, 4, 6, 8, __","10","9","12","11"],
[3,"Count by 5s: 5, 10, 15, __","20","25","16","30"],
[3,"Count by 10s: 10, 20, 30, __","40","31","50","35"],
[3,"Count by 5s: 25, 30, 35, __","40","45","36","50"],
[3,"Count by 10s: 50, 60, __, 80","70","65","75","90"],
[3,"Count by 2s: 12, 14, __, 18","16","15","17","20"],
[3,"Counting by 5s, what comes after 45?","50","46","55","40"],
[3,"Count backward by 2s: 10, 8, 6, __","4","5","2","3"],
[4,"Which number is even?","14","13","15","17"],
[4,"Which number is odd?","27","26","28","30"],
[4,"Is 38 even or odd?","Even","Odd","Both","Neither"],
[4,"An odd number ends in which digit?","7","4","6","8"],
[4,"Which group has only even numbers?","2, 4, 6","1, 3, 5","2, 3, 4","5, 6, 7"],
[5,"Which is the short way to write “twentieth”?","20th","20nd","20rd","20st"],
[5,"Which word comes after “ninth”?","tenth","eighth","eleventh","twelfth"],
[5,"Which word goes with the number 3?","third","three","thirty","thirteenth"],
[5,"Which is the short way to write “fifth”?","5th","5nd","5rd","5st"],
[5,"🍎 🍌 🍇 🍓 🍊  Which fruit is 4th in the line?","🍓","🍇","🍊","🍌"]
];

var $=function(i){return document.getElementById(i)};
var cur=0,score=0,order=[],tally=[],locked=false;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["start","quiz","end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)});window.scrollTo(0,0)}

TOPICS.forEach(function(t){var li=document.createElement("li");li.textContent=t;$("tl").appendChild(li)});

function begin(){
  cur=0;score=0;order=BANK.map(function(_,i){return i});
  tally=TOPICS.map(function(){return [0,0]});
  show("quiz");render();
}

function render(){
  locked=false;
  var q=BANK[order[cur]];
  $("cnt").textContent="Question "+(cur+1)+" of "+BANK.length;
  $("sc").textContent="Score: "+score;
  $("pg").style.width=(cur/BANK.length*100)+"%";
  $("tg").textContent=TOPICS[q[0]];
  $("qt").textContent=q[1];
  $("fb").textContent="";$("fb").className="fb";
  $("nx").classList.add("hide");
  $("nx").textContent=cur===BANK.length-1?"See my results":"Next question";
  var box=$("op");box.innerHTML="";
  shuffle(q.slice(2)).forEach(function(o){
    var b=document.createElement("button");
    b.className="opt";b.textContent=o;
    b.onclick=function(){pick(b,o,q)};
    box.appendChild(b);
  });
}

function pick(btn,val,q){
  if(locked)return;locked=true;
  var ok=val===q[2];
  tally[q[0]][1]++;
  if(ok){score++;tally[q[0]][0]++;btn.classList.add("right");$("fb").textContent="Great job! That’s right.";$("fb").className="fb good"}
  else{btn.classList.add("wrong");$("fb").textContent="Not quite. The answer is "+q[2]+".";$("fb").className="fb bad"}
  Array.prototype.forEach.call($("op").children,function(b){b.disabled=true;if(b.textContent===q[2])b.classList.add("right")});
  $("sc").textContent="Score: "+score;
  $("pg").style.width=((cur+1)/BANK.length*100)+"%";
  $("nx").classList.remove("hide");$("nx").focus();
}

function finish(){
  show("end");
  var n=BANK.length,s=score/n;
  var stars=s>=0.9?3:s>=0.7?2:s>=0.4?1:0;
  $("st").textContent="⭐".repeat(stars)+"☆".repeat(3-stars);
  $("fs").textContent=score+" out of "+n;
  $("msg").textContent=s>=0.9?"Wow, you are a number star!":s>=0.7?"Nice work! You know your numbers well.":s>=0.4?"Good try! Practice a little more and play again.":"Keep going! Every try makes you stronger.";
  var br=$("br");br.innerHTML="";
  TOPICS.forEach(function(t,i){
    var r=tally[i],pct=r[1]?r[0]/r[1]*100:0;
    var d=document.createElement("div");d.className="row";
    d.innerHTML='<div class="l"><span></span><span>'+r[0]+' / '+r[1]+'</span></div><div class="b"><div style="width:'+pct+'%"></div></div>';
    d.querySelector("span").textContent=t;
    br.appendChild(d);
  });
}

$("go").onclick=begin;
$("again").onclick=begin;
$("nx").onclick=function(){cur++;if(cur>=BANK.length)finish();else render()};
$("say").onclick=function(){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    var q=BANK[order[cur]];
    var u=new SpeechSynthesisUtterance(q[1].replace(/__/g,"blank").replace(/</g," less than ").replace(/>/g," greater than "));
    u.rate=0.85;speechSynthesis.speak(u);
  }catch(e){}
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zion's Math Adventure</title>
<style>
:root{--red:#ff6b6b;--yel:#ffd93d;--grn:#4cc46a;--blu:#4d96ff;--pur:#9b5de5;--ink:#2b2d42}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#6fcfff,#c9f1ff 55%,#b4f0c0);overflow-x:hidden}
.bg span{position:fixed;font-size:2.4rem;opacity:.5;animation:fl 7s ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes fl{50%{transform:translateY(-22px) rotate(12deg)}}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px}
.screen{display:none;animation:pop .4s}.screen.on{display:block}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.card{background:#fff;border-radius:28px;padding:22px;box-shadow:0 8px 0 rgba(0,0,0,.12);border:4px solid var(--ink);text-align:center}
h1{font-size:clamp(2rem,7vw,3.2rem);margin:.2em 0;color:var(--pur);text-shadow:3px 3px 0 var(--yel)}
.mascot{font-size:5.5rem;display:inline-block;animation:bn 1.2s infinite}
@keyframes bn{50%{transform:translateY(-16px) rotate(-6deg)}}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.chip{background:var(--yel);border:3px solid var(--ink);border-radius:99px;padding:6px 14px;font-weight:700}
.btn{font:inherit;font-weight:800;font-size:1.4rem;color:#fff;background:var(--grn);border:4px solid var(--ink);border-radius:20px;padding:12px 30px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:.1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--blu)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:800}
.pill{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:4px 12px}
.track{position:relative;height:22px;background:#fff;border:3px solid var(--ink);border-radius:99px;margin:16px 0 20px}
.fill{height:100%;background:repeating-linear-gradient(45deg,var(--red),var(--red) 10px,var(--yel) 10px,var(--yel) 20px);border-radius:99px;width:0;transition:width .5s}
.rocket{position:absolute;top:-16px;font-size:1.8rem;transition:left .5s;transform:translateX(-50%) rotate(45deg)}
.q{font-size:clamp(2.4rem,10vw,4rem);font-weight:900;margin:8px 0;letter-spacing:2px}
.q.word{font-size:clamp(1.3rem,4.5vw,1.9rem);line-height:1.4;letter-spacing:0}
.pic{font-size:clamp(1.5rem,6vw,2.1rem);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 12px;min-height:44px;margin-bottom:6px}
.pic .g{display:inline-flex;flex-wrap:wrap;justify-content:center;max-width:46%}
.pic .gone{opacity:.2;filter:grayscale(1)}
.say{font:inherit;font-size:1rem;background:#fff;border:3px solid var(--ink);border-radius:99px;padding:4px 14px;cursor:pointer;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.opt{font:inherit;font-size:2.2rem;font-weight:900;color:#fff;border:4px solid var(--ink);border-radius:22px;padding:16px;cursor:pointer;box-shadow:0 6px 0 var(--ink)}
.opt:nth-child(1){background:var(--red)}.opt:nth-child(2){background:var(--blu)}.opt:nth-child(3){background:var(--pur)}.opt:nth-child(4){background:#ff9f1c}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt.ok{background:var(--grn)!important;animation:bn .5s}
.opt.no{background:#8d99ae!important;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.fb{min-height:40px;font-size:1.5rem;font-weight:800;margin-top:14px}
.big{font-size:5rem}
.stars{font-size:2.6rem;letter-spacing:4px}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0}
.lv div{background:#f1f6ff;border:3px solid var(--ink);border-radius:14px;padding:6px;font-weight:700;font-size:.95rem}
.conf{position:fixed;top:-40px;font-size:2rem;animation:fall 2.6s linear forwards;z-index:9;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media(max-width:420px){.opt{font-size:1.8rem;padding:12px}}

.buddies{display:flex;gap:10px;justify-content:center;margin:10px 0 16px}
.buddy{font-size:2.6rem;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:4px 10px;cursor:pointer;transition:.15s}
.buddy.sel{background:var(--yel);transform:scale(1.15) translateY(-4px)}
.map{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:16px 0}
.node{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);background:#e9ecef;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.5rem;line-height:1;opacity:.55}
.node small{font-size:.65rem;font-weight:800}
.node.done{background:var(--grn);opacity:1}
.node.cur{background:var(--yel);opacity:1;animation:bn 1s infinite;box-shadow:0 0 0 6px rgba(255,217,61,.5)}
.bd{font-size:2.4rem;display:inline-block;margin-right:8px;vertical-align:middle}
.bd.cheer{animation:bn .5s}.bd.oops{animation:sh .4s}
.nl{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;width:100%}
.nl span{width:27px;height:27px;font-size:.7rem;font-weight:800;border:2px solid var(--ink);border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}
.nl .s{background:var(--yel);transform:scale(1.25)}
body{transition:background .6s}
</style>
</head>
<body>
<div class="bg"><span style="left:4%;top:12%">☁️</span><span style="right:6%;top:8%;animation-delay:1s">☀️</span><span style="left:10%;bottom:10%;animation-delay:2s">🌈</span><span style="right:8%;bottom:14%;animation-delay:3s">🎈</span><span style="left:48%;top:3%;animation-delay:4s">⭐</span></div>
<div class="wrap">

<section class="screen on" id="s-start"><div class="card">
<div class="mascot" id="mascot">🦁</div><div style="font-weight:800">Pick your buddy:</div><div class="buddies" id="buddies"></div>
<h1>Zion's Math Adventure</h1>
<p style="font-size:1.3rem">Hi Zion! Ready to add and take away?<br>Let's blast off with <b>100 fun word problems!</b></p>
<div class="chips"><span class="chip">➕ Adding</span><span class="chip">➖ Taking away</span><span class="chip">📖 Word problems</span><span class="chip">🚀 10 levels</span><span class="chip">⭐ Win stars</span></div>
<button class="btn" onclick="startGame()">Let's Go! 🚀</button>
<p style="font-size:.95rem;margin-top:16px">Tip: tap 🔊 to hear the question read out loud.</p>
</div></section>

<section class="screen" id="s-level"><div class="card">
<div class="big" id="l-icon"></div>
<h1 id="l-title" style="font-size:2.2rem"></h1>
<h2 id="l-name" style="margin:.2em 0"></h2>
<p id="l-tip" style="font-size:1.25rem"></p><div class="map" id="map"></div>
<button class="btn" onclick="showQ()">Start Level! ▶</button>
</div></section>

<section class="screen" id="s-quiz">
<div class="top"><span class="pill" id="q-lv"></span><span class="pill" id="q-streak">🔥 0</span><span class="pill" id="q-score">⭐ 0</span><button class="pill" id="mute" onclick="toggleMute()" style="font:inherit;cursor:pointer">🔔</button></div>
<div class="track"><div class="fill" id="fill"></div><div class="rocket" id="rocket">🚀</div></div>
<div class="card">
<div style="font-weight:700" id="q-num"></div>
<div class="pic" id="pic"></div>
<div class="q" id="q"></div>
<button class="say" onclick="speak()">🔊 Read to me</button>
<div class="opts" id="opts"></div>
<div class="fb"><span class="bd" id="bd"></span><span id="fbt"></span></div>
<button class="btn alt" id="nextBtn" style="display:none" onclick="advance()">Next ▶</button>
</div></section>

<section class="screen" id="s-end"><div class="card">
<div class="mascot">🏆</div>
<h1 id="e-title">Amazing, Zion!</h1>
<div class="stars" id="e-stars"></div>
<p style="font-size:2rem;font-weight:900;margin:6px 0" id="e-score"></p>
<p style="font-size:1.2rem" id="e-msg"></p>
<div class="lv" id="e-lv"></div>
<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
<button class="btn" onclick="startGame()">Play Again 🔁</button>
<button class="btn alt" id="practice" onclick="practiceMissed()">Practise Oops Ones 💪</button>
</div></div></section>
</div>

<script>
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const E=['🍎','⭐','🐟','🚀','🐥','🍪','🎈','🐞','🍓','🧸'];
const LV=[
{n:'Add Up the Story',i:'🍎',tip:'Read the story, count the pictures, and add them together!'},
{n:'Take-Away Story',i:'🐟',tip:'Some things go away. How many are left?'},
{n:'Story Adds to 10',i:'🎈',tip:'Put the groups together. Can you get to 10?'},
{n:'Story Take-Aways to 10',i:'🍪',tip:'Start with the big number and take some away.'},
{n:'Which Way?',i:'🎲',tip:'Read carefully: do we put together or take away?'},
{n:'Big Adds to 20',i:'🚀',tip:'Bigger numbers! Try counting on from the big one.'},
{n:'Big Take-Aways to 20',i:'🐳',tip:'Count back to find how many are left.'},
{n:'Mystery Number',i:'🕵️',tip:'Something is missing in the story. Can you find it?'},
{n:'Story Mix-Up',i:'🌈',tip:'Adding, taking away and comparing, all mixed up!'},
{n:'Super Stories',i:'🦸',tip:'Boss level! These stories have two steps. Go one step at a time.'}];
const NM=['Zion','Mia','Leo','Ava','Sam','Zoe','Ben','Lily'];
const IT=[['apples','🍎'],['stars','⭐'],['fish','🐟'],['cookies','🍪'],['balloons','🎈'],['ladybugs','🐞'],['strawberries','🍓'],['teddy bears','🧸'],['toy cars','🚗'],['ducks','🐥']];
function row(n,em,gone=0){let s='<span class="g">';for(let i=0;i<n;i++)s+=`<span class="${i>=n-gone?'gone':''}">${em}</span>`;return s+'</span>'}
function gen(lv){
 const [x,e]=IT[R(0,9)],nm=NM[R(0,7)];let n2=NM[R(0,7)];while(n2==nm)n2=NM[R(0,7)];
 const pic=lv<5;
 const add=mx=>{const n=R(1,mx-1),m=R(1,mx-n);
  const t=[`${nm} has ${n} ${x}. Then ${nm} gets ${m} more. How many ${x} does ${nm} have now?`,`There are ${n} ${x} in a box and ${m} ${x} on the table. How many ${x} are there altogether?`,`${nm} finds ${n} ${x} in the morning and ${m} ${x} in the afternoon. How many ${x} did ${nm} find in all?`,`${nm} has ${n} ${x}. ${n2} has ${m} ${x}. How many ${x} do they have together?`][R(0,3)];
  return{t,ans:n+m,pic:pic?row(n,e)+'<b>+</b>'+row(m,e):''}};
 const sub=mx=>{const a=R(2,mx),b=R(1,a-1);
  const t=[`${nm} has ${a} ${x}. ${nm} gives ${b} to a friend. How many ${x} are left?`,`There were ${a} ${x} in a bag. ${nm} took out ${b}. How many ${x} are still in the bag?`,`${nm} had ${a} ${x} but lost ${b} of them. How many ${x} does ${nm} have now?`,`${nm} has ${a} ${x}. ${n2} has ${b} ${x}. How many more ${x} does ${nm} have?`][R(0,pic?2:3)];
  return{t,ans:a-b,pic:pic?row(a,e,b):''}};
 const miss=()=>{const c=R(3,20),a=R(1,c-1);
  return R(0,1)?{t:`${nm} had ${a} ${x}. Then ${nm} got some more. Now ${nm} has ${c}. How many did ${nm} get?`,ans:c-a}:{t:`${nm} had ${c} ${x}. ${nm} gave some away. Now ${nm} has ${a} left. How many did ${nm} give away?`,ans:c-a}};
 const two=()=>{const a=R(2,10),b=R(1,10),c=R(1,a+b-1);return{t:`${nm} has ${a} ${x}, then gets ${b} more. Then ${nm} gives away ${c}. How many ${x} does ${nm} have now?`,ans:a+b-c}};
 const mix=m=>R(0,1)?add(m):sub(m);
 const q=[()=>add(5),()=>sub(5),()=>add(10),()=>sub(10),()=>mix(10),()=>add(20),()=>sub(20),miss,()=>mix(20),two][lv]();
 q.w=1;return q;
}
function build(){
 const out=[];
 LV.forEach((_,lv)=>{const seen=new Set();let k=0,t=0;
  while(k<10){const q=gen(lv);t++;if(seen.has(q.t)&&t<300)continue;seen.add(q.t);q.lv=lv;
   const o=new Set([q.ans]);[1,-1,2,-2,3,R(0,20)].forEach(d=>{if(o.size<4){const v=d>3?d:q.ans+d;if(v>=0&&v<=20)o.add(v)}});
   while(o.size<4)o.add(R(0,20));q.opts=shuf([...o]);out.push(q);k++}});
 return out;
}
let buddy='🦁';
const BD=['🦁','🤖','🦄','🦖'];
const TH=['#6fcfff,#c9f1ff 55%,#b4f0c0','#ffd6a5,#ffe9d6 55%,#fdffb6','#b8f2e6,#e0fbfc 55%,#ffd6e0','#c3b1ff,#e8e0ff 55%,#bde0fe','#ffadad,#ffe5d9 55%,#ffd6a5','#a0c4ff,#d6e4ff 55%,#caffbf','#9bf6ff,#d0f4ff 55%,#fdffb6','#ffc6ff,#f3d9ff 55%,#bdb2ff','#fdffb6,#e9ffd0 55%,#9bf6ff','#ffb3c6,#ffe0e9 55%,#ffd6a5'];
function buildBuddies(){$('buddies').innerHTML=BD.map(b=>`<button class="buddy ${b===buddy?'sel':''}" onclick="setBuddy('${b}')">${b}</button>`).join('')}
function setBuddy(b){buddy=b;$('mascot').textContent=b;buildBuddies();beep(700)}
function nlq(q,op){const a=parseInt(q.t);let h='<div class="nl">';for(let k=0;k<=20;k++)h+=`<span class="${k==a?'s':''}">${k}</span>`;q.pic=h+'</div><div style="width:100%;font-size:.95rem">Start at the yellow number, then hop '+(op=='+'?'forward':'back')+'!</div>';return q}
let qs=[],i=0,score=0,streak=0,missed=[],ls=[],practice=false,locked=false,muted=false,ac;
buildBuddies();
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}
function startGame(){qs=build();i=0;score=0;streak=0;missed=[];ls=Array(10).fill(0);practice=false;go()}
function practiceMissed(){qs=missed.map(q=>({...q,opts:shuf([...q.opts])}));i=0;score=0;streak=0;missed=[];practice=true;go()}
function go(){document.body.style.background=`linear-gradient(${TH[qs[i].lv]})`;if(!practice&&(i==0||qs[i].lv!==qs[i-1].lv)){const l=LV[qs[i].lv];$('l-icon').textContent=l.i;$('l-title').textContent='Level '+(qs[i].lv+1);$('l-name').textContent=l.n;$('l-tip').textContent=l.tip;$('map').innerHTML=LV.map((l,k)=>`<div class="node ${k<qs[i].lv?'done':k==qs[i].lv?'cur':''}">${l.i}<small>${k<qs[i].lv?ls[k]+'/10':'L'+(k+1)}</small></div>`).join('');show('s-level')}else showQ()}
function showQ(){
 const q=qs[i];locked=false;show('s-quiz');
 $('q-lv').textContent=practice?'💪 Practice':`Level ${q.lv+1}: ${LV[q.lv].n}`;
 $('q-num').textContent=`Question ${i+1} of ${qs.length}`;
 $('q-score').textContent='⭐ '+score;$('q-streak').textContent='🔥 '+streak;
 const p=i/qs.length*100;$('fill').style.width=p+'%';$('rocket').style.left=Math.max(p,2)+'%';
 $('pic').innerHTML=q.pic||'';const el=$('q');el.textContent=q.t;el.className='q'+(q.w?' word':'');
 $('opts').innerHTML=q.opts.map(o=>`<button class="opt" onclick="pick(${o},this)">${o}</button>`).join('');
 $('bd').textContent=buddy;$('bd').className='bd';$('fbt').textContent='';$('nextBtn').style.display='none';
 if(!muted)setTimeout(speak,300);
}
function speak(){if(!window.speechSynthesis)return;speechSynthesis.cancel();const q=qs[i];
 const t=q.t.replace('+',' plus ').replace('−',' minus ').replace('=','equals').replace('▢','what number').replace('?','');
 const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.2;speechSynthesis.speak(u)}
function beep(f,d=.15,t='sine'){if(muted)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function toggleMute(){muted=!muted;$('mute').textContent=muted?'🔕':'🔔';if(muted)speechSynthesis&&speechSynthesis.cancel()}
function boom(n=20,set=['🎉','⭐','✨','🎈','🌟']){for(let k=0;k<n;k++){const s=document.createElement('span');s.className='conf';s.textContent=set[R(0,set.length-1)];s.style.left=R(0,95)+'vw';s.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3400)}}
const GOOD=['Awesome, Zion! 🎉','You got it! 🌟','Super smart! 🦁','Wow, great job! 🚀','Brilliant! ⭐','Math star! 🌈'];
function pick(v,btn){
 if(locked)return;locked=true;const q=qs[i];const bs=[...document.querySelectorAll('.opt')];
 if(v===q.ans){score++;streak++;if(!practice)ls[q.lv]++;btn.classList.add('ok');$('bd').className='bd cheer';$('fbt').textContent=streak>=5?`🔥 ${streak} in a row! Unstoppable!`:GOOD[R(0,5)];
  beep(660);setTimeout(()=>beep(880),120);if(streak%5==0)boom(24);setTimeout(advance,1100)}
 else{streak=0;missed.push(q);btn.classList.add('no');$('bd').className='bd oops';bs.forEach(b=>{if(+b.textContent===q.ans)b.classList.add('ok')});
  $('fbt').textContent=`Good try! The answer is ${q.ans}. 💪`;beep(200,.3,'triangle');$('nextBtn').style.display='inline-block'}
}
function advance(){if(!locked)return;locked=false;i++;if(i>=qs.length)finish();else go()}
function finish(){
 show('s-end');speechSynthesis&&speechSynthesis.cancel();
 const pct=score/qs.length*100,st=Math.max(1,Math.ceil(pct/20));
 $('e-stars').textContent='⭐'.repeat(st)+'☆'.repeat(5-st);
 $('e-score').textContent=`${score} out of ${qs.length}`;
 $('e-title').textContent=pct>=90?'Math Champion, Zion! 🏆':pct>=70?'Great Work, Zion! 🎉':pct>=50?'Nice Try, Zion! 👍':'Keep Practising, Zion! 💪';
 $('e-msg').textContent=pct>=90?'You are a super adder and take-away expert!':pct>=70?'You are getting really good at this!':'Every try makes your brain stronger. Play again!';
 $('e-lv').innerHTML=practice?'':LV.map((l,k)=>`<div>${l.i} L${k+1}: ${ls[k]}/10 ${ls[k]>=9?'🏅':''}</div>`).join('');
 $('practice').style.display=missed.length?'inline-block':'none';
 boom(pct>=50?50:15);
}
</script>
</body>
</html>
